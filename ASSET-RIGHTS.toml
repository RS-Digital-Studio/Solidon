schema_version = 1

[delivery]
description = "Rechtenachweis für alle getrackten Bilder, Symbole, Schriften, Videos, Audiodateien und Beispielprojekte, die mit der Anwendung oder der Website ausgeliefert werden."
scope = "copyright_and_redistribution"
not_a_safety_approval = true
application_platforms = ["windows", "macos", "linux"]
application_media_identical = true
platform_exceptions = [
  "packaging/solidon3d.ico wird nur unter Windows ausgeliefert.",
  "packaging/solidon3d.icns wird nur unter macOS ausgeliefert.",
]
excluded = [
  "Feedback/ — interne Fehlerbelege, keine Auslieferung",
  "marketing/ — Arbeits- und Kommunikationsdateien außerhalb der Auslieferung mit Anwendung oder Website; marketing/youtube/ enthält aus make_youtube_art.py erzeugte Kanalbilder für eine gesonderte Veröffentlichung sowie eine interne Vorschau der Sichtbereiche",
  "tools/voice-reference.wav — reproduzierbare interne Synthesereferenz, keine Auslieferung",
  "website/teile/ — Erzeugungsquellen der Website, vom Web-Uploader ausgeschlossen",
  "tests/, tmp/, build/, dist/ und Caches — Prüf- oder Arbeitsergebnisse, keine Auslieferung",
]

# Ein Eintrag darf genau die Medien treffen, für die dieselbe Rechtekette gilt.
# Der Test verlangt vollständige, überschneidungsfreie Abdeckung.


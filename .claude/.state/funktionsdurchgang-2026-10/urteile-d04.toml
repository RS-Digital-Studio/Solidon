reason = "Stufe A „nicht auffindbar“ beziehungsweise ohne Weg. In gleiche_bohrungen.exakt findet der Prüfstand nach Klick auf Bohrung 1 keinen QCheckBox („kein Weg führt hin“); am exakten Körper liegt die Änderung in einer zugeklappten Zeile der rechten Karte. Der Haken „Auf alle 4 gleichartigen anwenden“ steht im Netzfall (001, alle Varianten und Sprachen) in der Maßkarte unter der Knopfzeile, mit Kurzhilfe „Ändert alle 4 gleichartigen Merkmale … Ein Strg+Z nimmt die gesamte Änderung zurück.“ Für den Kunden ist das Element nach dem Bild auffindbar; der Prüfstands- bzw. Wortschatzanschluss fehlt. Kein belegter Produktfehler."

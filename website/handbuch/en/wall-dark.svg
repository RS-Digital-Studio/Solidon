<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 224" width="500" height="224"><defs><marker id="arrow6ba3dd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6ba3dd" /></marker></defs><rect x="0" y="0" width="500" height="224" fill="#1b1f25" /><text x="20" y="26" fill="#e6e9ee" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="600">Minimum wall thickness: two beads side by side</text><rect x="150" y="74" width="30" height="100" rx="3" fill="#262b33" stroke="#e6e9ee" stroke-width="1.4" /><line x1="165" y1="74" x2="165" y2="174" stroke="#8f97a2" stroke-width="1" stroke-dasharray="5 4" stroke-linecap="round" /><text x="126" y="198" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">the wall in section</text><line x1="150" y1="60" x2="180" y2="60" stroke="#6ba3dd" stroke-width="1.1" marker-start="url(#arrow6ba3dd)" marker-end="url(#arrow6ba3dd)" /><text x="165" y="51" fill="#6ba3dd" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">0.84 mm</text><text x="236" y="84" fill="#e6e9ee" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">A single bead carries nothing</text><text x="236" y="97" fill="#e6e9ee" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">and tears when the supports</text><text x="236" y="110" fill="#e6e9ee" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">come off. Two is the least</text><text x="236" y="123" fill="#e6e9ee" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">that holds.</text><text x="236" y="158" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Bead width and nozzle come</text><text x="236" y="171" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">from the printer profile (0.40</text><text x="236" y="184" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">mm nozzle).</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240"><rect x="0" y="0" width="560" height="240" fill="#ffffff" /><text x="20" y="26" fill="#1c2026" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="600">A pattern on a round grip</text><text x="58" y="62" fill="#5f6772" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">flat</text><circle cx="110" cy="130" r="46" fill="#e9ebee" stroke="#1c2026" stroke-width="1.4" /><line x1="64" y1="78" x2="156" y2="78" stroke="#b4611c" stroke-width="2" stroke-linecap="round" /><text x="46" y="206" fill="#5f6772" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">rests on top, bears only at the middle</text><text x="392" y="62" fill="#5f6772" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">wrapped</text><circle cx="410" cy="130" r="46" fill="#e9ebee" stroke="#1c2026" stroke-width="1.4" /><line x1="456" y1="130" x2="464" y2="130" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" /><line x1="452.5" y1="147.6" x2="459.89" y2="150.66" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" /><line x1="442.53" y1="162.53" x2="448.18" y2="168.18" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" /><line x1="427.6" y1="172.5" x2="430.66" y2="179.89" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" /><line x1="410" y1="176" x2="410" y2="184" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" /><line x1="392.4" y1="172.5" x2="389.34" y2="179.89" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" /><line x1="377.47" y1="162.53" x2="371.82" y2="168.18" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" /><line x1="367.5" y1="147.6" x2="360.11" y2="150.66" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" /><line x1="364" y1="130" x2="356" y2="130" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" /><line x1="367.5" y1="112.4" x2="360.11" y2="109.34" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" /><line x1="377.47" y1="97.47" x2="371.82" y2="91.82" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" /><line x1="392.4" y1="87.5" x2="389.34" y2="80.11" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" /><line x1="410" y1="84" x2="410" y2="76" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" /><line x1="427.6" y1="87.5" x2="430.66" y2="80.11" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" /><line x1="442.53" y1="97.47" x2="448.18" y2="91.82" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" /><line x1="452.5" y1="112.4" x2="459.89" y2="109.34" stroke="#2f6fb0" stroke-width="2" stroke-linecap="round" /><text x="360" y="206" fill="#5f6772" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">grips all the way around</text><text x="190" y="104" fill="#5f6772" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">The “Apply as” switch</text><text x="190" y="117" fill="#5f6772" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">decides. The diameter</text><text x="190" y="130" fill="#5f6772" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">comes from the face you</text><text x="190" y="143" fill="#5f6772" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">clicked.</text></svg>
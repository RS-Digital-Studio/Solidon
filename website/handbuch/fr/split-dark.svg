<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230"><defs><pattern id="hatch-45" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8f97a2" stroke-width="1.2" /></pattern><marker id="arrowd99048" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#d99048" /></marker><marker id="arrow8f97a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8f97a2" /></marker></defs><rect x="0" y="0" width="560" height="230" fill="#1b1f25" /><text x="20" y="24" fill="#e6e9ee" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="600">Trop grand pour le plateau d'impression</text><rect x="20" y="40" width="170" height="120" rx="3" fill="none" stroke="#8f97a2" stroke-width="1.4" stroke-dasharray="5 4" /><text x="20" y="176" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">plateau d'impression vu de dessus</text><rect x="50" y="72" width="190" height="56" rx="3" fill="#262b33" stroke="#d99048" stroke-width="2" /><text x="120" y="105" fill="#e6e9ee" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">Objet</text><rect x="190" y="74" width="48" height="52" fill="url(#hatch-45)" /><line x1="214" y1="60" x2="214" y2="72" stroke="#d99048" stroke-width="1.4" marker-end="url(#arrowd99048)" /><text x="238" y="56" fill="#d99048" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">ne rentre pas</text><line x1="252" y1="100" x2="288" y2="100" stroke="#8f97a2" stroke-width="2" marker-end="url(#arrow8f97a2)" /><text x="300" y="24" fill="#e6e9ee" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="600">Découpé automatiquement</text><rect x="300" y="40" width="170" height="120" rx="3" fill="none" stroke="#8f97a2" stroke-width="1.4" stroke-dasharray="5 4" /><rect x="312" y="72" width="76" height="56" rx="3" fill="#262b33" stroke="#6ba3dd" stroke-width="1.4" /><rect x="396" y="72" width="76" height="56" rx="3" fill="#262b33" stroke="#6ba3dd" stroke-width="1.4" /><circle cx="392" cy="88" r="4" fill="#6ba3dd" stroke="#6ba3dd" stroke-width="1.4" /><circle cx="392" cy="112" r="4" fill="#6ba3dd" stroke="#6ba3dd" stroke-width="1.4" /><text x="300" y="176" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">deux goupilles par face de coupe</text><text x="20" y="206" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Le plan de coupe est cherché, pas deviné — et chaque coupe reste un chiffre</text><text x="20" y="219" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">que l'on peut changer.</text></svg>
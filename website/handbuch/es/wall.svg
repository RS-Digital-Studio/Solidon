<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 224" width="500" height="224"><defs><marker id="arrow2f6fb0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#2f6fb0" /></marker></defs><rect x="0" y="0" width="500" height="224" fill="#ffffff" /><text x="20" y="26" fill="#1c2026" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="600">Grosor mínimo de pared: dos cordones uno junto al otro</text><rect x="150" y="74" width="30" height="100" rx="3" fill="#e9ebee" stroke="#1c2026" stroke-width="1.4" /><line x1="165" y1="74" x2="165" y2="174" stroke="#8b929b" stroke-width="1" stroke-dasharray="5 4" stroke-linecap="round" /><text x="126" y="198" fill="#8b929b" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">la pared en sección</text><line x1="150" y1="60" x2="180" y2="60" stroke="#2f6fb0" stroke-width="1.1" marker-start="url(#arrow2f6fb0)" marker-end="url(#arrow2f6fb0)" /><text x="165" y="51" fill="#2f6fb0" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">0.84 mm</text><text x="236" y="84" fill="#1c2026" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Un solo cordón no aguanta nada</text><text x="236" y="97" fill="#1c2026" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">y se rompe al retirar los</text><text x="236" y="110" fill="#1c2026" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">soportes. Dos son lo mínimo</text><text x="236" y="123" fill="#1c2026" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">que se sostiene.</text><text x="236" y="158" fill="#8b929b" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">El ancho de cordón y la</text><text x="236" y="171" fill="#8b929b" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">boquilla están en el perfil de</text><text x="236" y="184" fill="#8b929b" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">impresora (0.40 mm boquilla).</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320"><defs><marker id="arrow6ba3dd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6ba3dd" /></marker></defs><rect x="0" y="0" width="620" height="320" fill="#1b1f25" /><text x="20" y="26" fill="#e6e9ee" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="600">El mismo contorno, tres modalidades</text><polygon points="30,108 150,108 150,168 30,168" fill="#262b33" stroke="#e6e9ee" stroke-width="1.4" /><circle cx="120" cy="138" r="14" fill="#1b1f25" stroke="#e6e9ee" stroke-width="1.4" /><line x1="30" y1="175" x2="30" y2="181" stroke="#8f97a2" stroke-width="1.4" stroke-linecap="round" /><line x1="150" y1="175" x2="150" y2="181" stroke="#8f97a2" stroke-width="1.4" stroke-linecap="round" /><line x1="30" y1="190" x2="150" y2="190" stroke="#6ba3dd" stroke-width="1.1" marker-start="url(#arrow6ba3dd)" marker-end="url(#arrow6ba3dd)" /><text x="90" y="181" fill="#6ba3dd" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">40 mm</text><text x="30" y="214" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">acotado y determinado</text><line x1="162" y1="138" x2="196" y2="138" stroke="#6ba3dd" stroke-width="1.4" marker-end="url(#arrow6ba3dd)" /><text x="350" y="84" fill="#e6e9ee" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="600">Extruir la forma básica</text><text x="350" y="100" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">recto hacia arriba</text><text x="350" y="164" fill="#e6e9ee" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="600">Revolucionar una sección</text><text x="350" y="180" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">alrededor del eje vertical</text><text x="350" y="244" fill="#e6e9ee" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="600">Barrer a lo largo de un arco</text><text x="350" y="260" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">un codo de tubo en un paso</text><polygon points="224,80 300,80 300,110 224,110" fill="#262b33" stroke="#e6e9ee" stroke-width="1.4" /><polygon points="238,66 314,66 314,96 238,96" fill="none" stroke="#8f97a2" stroke-width="1.4" /><line x1="224" y1="80" x2="238" y2="66" stroke="#8f97a2" stroke-width="1" stroke-linecap="round" /><line x1="300" y1="80" x2="314" y2="66" stroke="#8f97a2" stroke-width="1" stroke-linecap="round" /><line x1="300" y1="110" x2="314" y2="96" stroke="#8f97a2" stroke-width="1" stroke-linecap="round" /><line x1="262" y1="146" x2="262" y2="210" stroke="#8f97a2" stroke-width="1" stroke-dasharray="5 4" stroke-linecap="round" /><polygon points="224,166 246,166 246,206 224,206" fill="#262b33" stroke="#e6e9ee" stroke-width="1.4" /><polygon points="300,166 278,166 278,206 300,206" fill="#262b33" stroke="#e6e9ee" stroke-width="1.4" /><path d="M 262 136 A 14 14 0 0 1 269 162.12" fill="none" stroke="#6ba3dd" stroke-width="1.2" /><path d="M 232 228 A 56 56 0 0 1 288 284" fill="none" stroke="#e6e9ee" stroke-width="1.2" /><path d="M 232 250 A 34 34 0 0 1 266 284" fill="none" stroke="#e6e9ee" stroke-width="1.2" /><line x1="266" y1="284" x2="288" y2="284" stroke="#e6e9ee" stroke-width="1.4" stroke-linecap="round" /><line x1="232" y1="228" x2="232" y2="250" stroke="#e6e9ee" stroke-width="1.4" stroke-linecap="round" /><text x="20" y="258" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Además, cortar una cavidad y tender la forma</text><text x="20" y="271" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">entre dos contornos. Se elige en</text><text x="20" y="284" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">«Terminado», con el dibujo delante — y</text><text x="20" y="297" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">«Volver a dibujar» no tira nada.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 232" width="620" height="232"><rect x="0" y="0" width="620" height="232" fill="#1b1f25" /><text x="20" y="28" fill="#8f97a2" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="600">Desactivado: un número</text><rect x="20" y="40" width="168" height="30" rx="3" fill="#1b1f25" stroke="#8f97a2" stroke-width="1.4" /><text x="32" y="60" fill="#e6e9ee" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">70,00 mm</text><text x="178" y="54" fill="#8f97a2" font-size="8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="end">▲</text><text x="178" y="66" fill="#8f97a2" font-size="8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="end">▼</text><rect x="196" y="40" width="36" height="30" rx="3" fill="#1b1f25" stroke="#8f97a2" stroke-width="1.4" /><text x="214" y="60" fill="#8f97a2" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">fx</text><text x="248" y="60" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Flechas, límites y unidad — como cualquier otra medida.</text><text x="20" y="124" fill="#8f97a2" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="600">Activado: una expresión</text><rect x="20" y="136" width="168" height="30" rx="3" fill="#1b1f25" stroke="#8f97a2" stroke-width="1.4" /><text x="32" y="156" fill="#e6e9ee" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">=@breite/2</text><rect x="196" y="136" width="36" height="30" rx="3" fill="#262b33" stroke="#6ba3dd" stroke-width="2" /><text x="214" y="156" fill="#6ba3dd" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle" font-weight="600">fx</text><text x="248" y="156" fill="#8f97a2" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">El valor sigue al parámetro, también cuando este cambia.</text><line x1="20" y1="196" x2="600" y2="196" stroke="#8f97a2" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round" /><text x="20" y="216" fill="#e6e9ee" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">Con breite = 70 mm el campo muestra 35,00 mm — calculado, no escrito.</text></svg>
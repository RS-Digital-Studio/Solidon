<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260"><rect x="0" y="0" width="560" height="260" fill="#ffffff" /><text x="20" y="26" fill="#1c2026" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="600">Saliência, medida contra a vertical</text><line x1="22" y1="186" x2="166.09" y2="186" stroke="#8b929b" stroke-width="2.5" stroke-linecap="round" /><polygon points="46,186 80,186 142.09,112 46,112" fill="#e9ebee" stroke="#1c2026" stroke-width="1.4" /><line x1="80" y1="186" x2="80" y2="102" stroke="#8b929b" stroke-width="1" stroke-dasharray="5 4" stroke-linecap="round" /><path d="M 80 156 A 30 30 0 0 1 99.28 163.02" fill="none" stroke="#2f6fb0" stroke-width="1.2" /><text x="92" y="152" fill="#2f6fb0" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="600">40°</text><text x="80" y="206" fill="#2f6fb0" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle" font-weight="600">imprime sem apoio</text><line x1="290" y1="186" x2="530.69" y2="186" stroke="#8b929b" stroke-width="2.5" stroke-linecap="round" /><polygon points="314,186 348,186 506.69,112 314,112" fill="#e9ebee" stroke="#1c2026" stroke-width="1.4" /><line x1="348" y1="186" x2="348" y2="102" stroke="#8b929b" stroke-width="1" stroke-dasharray="5 4" stroke-linecap="round" /><path d="M 348 156 A 30 30 0 0 1 375.19 173.32" fill="none" stroke="#b4611c" stroke-width="1.2" /><text x="360" y="152" fill="#b4611c" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start" font-weight="600">65°</text><text x="348" y="206" fill="#b4611c" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle" font-weight="600">precisa de suportes</text><text x="20" y="238" fill="#8b929b" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">O ângulo-limite está no perfil de impressora — 45 graus é só uma regra empírica. O leque</text><text x="20" y="251" fill="#8b929b" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="start">de saliências mede-o para a sua própria impressora.</text></svg>
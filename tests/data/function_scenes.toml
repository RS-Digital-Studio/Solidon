# Szenenkatalog des Funktionsdurchgangs (Bauplan D0 §2.5, Konzept §3).
#
# Jede Szene ist ein Rezept aus Operationen, gebaut über `History.apply` wie die
# Beispielprojekte (`tools/function_list.py`, `build_scene`). Die Datei aus einem
# Rezept wird nicht abgelegt (`tests/data/CLAUDE.md`); `--szenen --out` baut sie
# außerhalb des Baums.
#
# Schlüssel je Szene:
#   summary   was sie zeigt
#   base      eine andere Szene, deren Schritte zuerst laufen
#   sources   Quellkennung → Datei relativ zu tests/data
#   ops       Schritte {op, inputs, params, title}
#   kernel    "exakt" oder "netz"; jeder Körper der gerechneten Szene hat diese Bauart
#   heavy     schwer: im Tor nur als gültiger Stapel geprüft, nie gerechnet
#   project   false heißt Startbildschirm, kein Projekt
#   promises  objects, kinds (Merkmalsarten), body (closed, open, parts, cavity),
#             findings (Befundkennungen), stops, triangles_over, seconds_over
#
# Maße: Quader 40 × 30 × 20 mm, Unterseite auf z = 0 (Vorgabe `anchor = "centre"`).

[scene.startbildschirm]
summary = "Der Startbildschirm vor dem ersten Projekt."
project = false

[scene.leer]
summary = "Neues Projekt ohne Körper."
promises = { objects = 0 }

[scene."quader.exakt"]
summary = "Ein exakter Quader 40 × 30 × 20 mm."
kernel = "exakt"
promises = { objects = 1, kinds = ["face"], body = "closed" }
[[scene."quader.exakt".ops]]
op = "create_brep_box"
params = { width = 40.0, depth = 30.0, height = 20.0 }

[scene."quader.netz"]
summary = "Ein Quader 40 × 30 × 20 mm als Dreiecksnetz."
kernel = "netz"
promises = { objects = 1, kinds = ["face"], body = "closed" }
[[scene."quader.netz".ops]]
op = "create_box"
params = { width = 40.0, depth = 30.0, height = 20.0 }

[scene."zwei_koerper.exakt"]
summary = "Zwei exakte Quader, die sich um 20 mm überlappen."
kernel = "exakt"
base = "quader.exakt"
promises = { objects = 2, kinds = ["face"] }
[[scene."zwei_koerper.exakt".ops]]
op = "create_brep_box"
params = { width = 40.0, depth = 30.0, height = 20.0, x = 20.0 }

[scene."zwei_koerper.netz"]
summary = "Zwei Netzquader, die sich um 20 mm überlappen."
kernel = "netz"
base = "quader.netz"
promises = { objects = 2, kinds = ["face"] }
[[scene."zwei_koerper.netz".ops]]
op = "create_box"
params = { width = 40.0, depth = 30.0, height = 20.0, x = 20.0 }

[scene."profilklemme.netz"]
summary = "Ein Profilklemmensatz Ø 16 mm: zwei Schalen aus PETG, zwei Einlagen aus TPU 95A."
kernel = "netz"
promises = { objects = 4, body = "closed" }
[[scene."profilklemme.netz".ops]]
op = "create_profile_clamp_set"
params = { clamp_material = "petg", liner_material = "tpu-95a" }

[scene."kante.exakt"]
summary = "Der exakte Quader; angeklickt wird eine seiner Kanten."
kernel = "exakt"
base = "quader.exakt"
promises = { objects = 1, kinds = ["face"] }

[scene."kante.netz"]
summary = "Der Netzquader; angeklickt wird eine seiner Kanten."
kernel = "netz"
base = "quader.netz"
promises = { objects = 1, kinds = ["face"] }

[scene."kantenzug.exakt"]
summary = "Ein exakter Zylinder Ø 20 × 20 mm: Sein oberer Rand ist ein umlaufender Kantenzug."
kernel = "exakt"
promises = { objects = 1, kinds = ["face"], body = "closed" }
[[scene."kantenzug.exakt".ops]]
op = "create_brep_cylinder"
params = { diameter = 20.0, height = 20.0 }

[scene."kantenzug.netz"]
summary = "Ein Netzzylinder Ø 20 × 20 mm: Sein oberer Rand ist ein umlaufender Kantenzug."
kernel = "netz"
promises = { objects = 1, kinds = ["face"], body = "closed" }
[[scene."kantenzug.netz".ops]]

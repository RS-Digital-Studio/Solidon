params = { width = 40.0, depth = 30.0, height = 20.0 }
suppressed = true
[[scene."ruhender_eingang.netz".ops]]
op = "drill_hole"
inputs = ["obj_1"]
params = { diameter = 5.0, z = 20.0 }

[scene."ruhender_eingang.exakt"]
summary = "Dasselbe am exakten Quader."

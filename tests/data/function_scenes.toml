inputs = ["obj_1"]
params = { diameter = 5.0, z = 20.0 }
suppressed = true

[scene."ausgeschaltet.exakt"]
summary = "Dasselbe am exakten Quader."
kernel = "exakt"
base = "quader.exakt"
promises = { objects = 1, findings = ["history.step_off"], actions = { reactivate_step = "history.step_off" } }
[[scene."ausgeschaltet.exakt".ops]]
op = "drill_hole"
inputs = ["obj_1"]
params = { diameter = 5.0, z = 20.0 }
suppressed = true

[scene."ruhender_eingang.netz"]
summary = "Der Quader ist ausgeschaltet, die Bohrung darauf nicht — eine von Hand bearbeitete Datei."

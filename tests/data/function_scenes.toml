# Szenenkatalog des Funktionsdurchgangs (Bauplan D0 §2.5, Konzept §3).
#
# Jede Szene ist ein Rezept aus Operationen, gebaut über `History.apply` wie die
# Beispielprojekte (`tools/function_list.py`, `build_scene`). Die Datei aus einem
# Rezept wird nicht abgelegt (`tests/data/CLAUDE.md`); `--szenen --out` baut sie
# außerhalb des Baums.
#
# Schlüssel je Szene (``tools/function_scenes.py``, ``SCENE_KEYS``):
#   summary       was sie zeigt
#   base          eine andere Szene, deren Schritte zuerst laufen
#   sources       Quellkennung → Datei relativ zu tests/data
#   ops           Schritte {op, inputs, params, title, suppressed}; suppressed = true
#                 schaltet den Schritt nach dem letzten aus, wie die Datei es speichert
#   kernel        "exakt" oder "netz"; jeder Körper der gerechneten Szene hat diese Bauart
#   heavy         schwer: im Tor nur als gültiger Stapel geprüft, nie gerechnet
#   project       false heißt Startbildschirm, kein Projekt
#   select        das Merkmal, das eine Zeile mit Merkmalsanforderung wählt (obj_<n>.<merkmal>)
#   parameters    Projektparameter vor dem ersten Schritt: Name → {value, unit, title}
#   opens         eine Projektdatei aus tests/data als Anfang, geöffnet wie im Fenster
#   printer, material   Drucker und Material des Projekts
#   printer_like  der Drucker ist hier nicht eingerichtet; das Projekt bringt die
#                 Beschreibung des mitgelieferten Druckers dieser Kennung mit
#   generated     Quellen, die ein Generator geliefert hat (Weg 3)
#   protected     vor Trennnähten geschützte Merkmale: Körper → [Merkmal, …]
#   own_parts     Rezepte aus tests/data, die vor dem Öffnen im Nutzerordner liegen
#   preconditions äußere Vorbedingungen (``function_list.PRECONDITIONS``)
#   insert_before die Einfügemarke der Sitzung vor diesem Schritt (sichtbare Nummer)
#   cause         was der Prüfstand vor der Zeile auslöst: {kind = "export", format}
#                 oder {kind = "auto_split", object}
#   promises      objects, kinds (Merkmalsarten), body (closed, open, parts, cavity),
#                 findings (Befundkennungen), actions (Handlung → Befund, an dem der
#                 Bericht sie anbietet), stops, triangles_over, seconds_over
#
# Maße: Quader 40 × 30 × 20 mm, Unterseite auf z = 0 (Vorgabe `anchor = "centre"`).

[scene.startbildschirm]
summary = "Der Startbildschirm vor dem ersten Projekt."
project = false

[scene.leer]
summary = "Neues Projekt ohne Körper."
promises = { objects = 0 }

[scene."quader.exakt"]
summary = "Ein exakter Quader 40 × 30 × 20 mm."
kernel = "exakt"
promises = { objects = 1, kinds = ["face"], body = "closed" }
[[scene."quader.exakt".ops]]
op = "create_brep_box"
params = { width = 40.0, depth = 30.0, height = 20.0 }

[scene."quader.netz"]
summary = "Ein Quader 40 × 30 × 20 mm als Dreiecksnetz."
kernel = "netz"
promises = { objects = 1, kinds = ["face"], body = "closed" }
[[scene."quader.netz".ops]]
op = "create_box"
params = { width = 40.0, depth = 30.0, height = 20.0 }

[scene."zwei_koerper.exakt"]
summary = "Zwei exakte Quader, die sich um 20 mm überlappen."
kernel = "exakt"
base = "quader.exakt"
promises = { objects = 2, kinds = ["face"] }
[[scene."zwei_koerper.exakt".ops]]
op = "create_brep_box"
params = { width = 40.0, depth = 30.0, height = 20.0, x = 20.0 }

[scene."zwei_koerper.netz"]
summary = "Zwei Netzquader, die sich um 20 mm überlappen."
kernel = "netz"
base = "quader.netz"
promises = { objects = 2, kinds = ["face"] }
[[scene."zwei_koerper.netz".ops]]
op = "create_box"
params = { width = 40.0, depth = 30.0, height = 20.0, x = 20.0 }

[scene."profilklemme.netz"]
summary = "Ein Profilklemmensatz Ø 16 mm: zwei Schalen aus PETG, zwei Einlagen aus TPU 95A."
kernel = "netz"
promises = { objects = 4, body = "closed" }
[[scene."profilklemme.netz".ops]]
op = "create_profile_clamp_set"
params = { clamp_material = "petg", liner_material = "tpu-95a" }

[scene."kugel.netz"]
summary = "Eine Netzkugel Ø 30 mm aus 64 Segmenten: ein fein vernetzter Körper für Glätten, Ausdünnen, Formen und Skelett."
kernel = "netz"
promises = { objects = 1, kinds = ["sphere"], body = "closed", triangles_over = 1000 }
[[scene."kugel.netz".ops]]
op = "create_sphere"
params = { diameter = 30.0, segments = 64 }

[scene."kante.exakt"]
summary = "Der exakte Quader; angeklickt wird eine seiner Kanten."
kernel = "exakt"
base = "quader.exakt"
promises = { objects = 1, kinds = ["face"] }

[scene."kante.netz"]
summary = "Der Netzquader; angeklickt wird eine seiner Kanten."
kernel = "netz"
base = "quader.netz"
promises = { objects = 1, kinds = ["face"] }

[scene."kantenzug.exakt"]
summary = "Ein exakter Zylinder Ø 20 × 20 mm: Sein oberer Rand ist ein umlaufender Kantenzug."
kernel = "exakt"
promises = { objects = 1, kinds = ["face"], body = "closed" }
[[scene."kantenzug.exakt".ops]]
op = "create_brep_cylinder"
params = { diameter = 20.0, height = 20.0 }

[scene."kantenzug.netz"]
summary = "Ein Netzzylinder Ø 20 × 20 mm: Sein oberer Rand ist ein umlaufender Kantenzug."
kernel = "netz"
promises = { objects = 1, kinds = ["face"], body = "closed" }
[[scene."kantenzug.netz".ops]]
op = "create_cylinder"
params = { diameter = 20.0, height = 20.0 }

# --- Befunde ---------------------------------------------------------------------

[scene."unter_dem_bett.netz"]
summary = "Ein geladener Würfel um den Ursprung: Er steckt zur Hälfte unter dem Druckbett."
kernel = "netz"
sources = { src_1 = "meshes/cube_clean.stl" }
promises = { objects = 1, body = "closed", findings = ["arrange.below_bed"], actions = { place_on_bed = "arrange.below_bed" } }
[[scene."unter_dem_bett.netz".ops]]
op = "load"
params = { source = "src_1", unit = "mm" }

[scene."zwei_unter_dem_bett.netz"]
summary = "Zwei gleiche Netzwürfel 20 mm nebeneinander, beide halb unter dem Druckbett: Der Bericht fasst ihren Befund in einer Sammelzeile, deren Handlung nach den Körpern fragt."
kernel = "netz"
promises = { objects = 2, body = "closed", findings = ["arrange.below_bed"], actions = { place_on_bed = "arrange.below_bed" } }
[[scene."zwei_unter_dem_bett.netz".ops]]
op = "create_box"
params = { width = 20.0, depth = 20.0, height = 20.0 }
[[scene."zwei_unter_dem_bett.netz".ops]]
op = "create_box"
params = { width = 20.0, depth = 20.0, height = 20.0 }
[[scene."zwei_unter_dem_bett.netz".ops]]
op = "translate_object"
inputs = ["obj_1"]
params = { dz = -10.0 }
[[scene."zwei_unter_dem_bett.netz".ops]]
op = "translate_object"
inputs = ["obj_2"]
params = { dx = 40.0, dz = -10.0 }

[scene."zu_gross.netz"]
summary = "Eine Platte 400 × 300 × 20 mm: größer als der Bauraum des Vorgabedruckers."
kernel = "netz"
promises = { objects = 1, findings = ["arrange.out_of_build_volume"], actions = { split_model = "arrange.out_of_build_volume", scale_to_fit = "arrange.out_of_build_volume", choose_printer = "arrange.out_of_build_volume" } }
[[scene."zu_gross.netz".ops]]
op = "create_box"
params = { width = 400.0, depth = 300.0, height = 20.0 }

[scene."deckungsgleich.netz"]
summary = "Zwei gleiche Netzquader genau übereinander."
kernel = "netz"
base = "quader.netz"
promises = { objects = 2, findings = ["arrange.bodies_in_one_place"], actions = { arrange_on_bed = "arrange.bodies_in_one_place" } }
[[scene."deckungsgleich.netz".ops]]
op = "create_box"
params = { width = 40.0, depth = 30.0, height = 20.0 }

[scene.halt]
summary = "Ein Netzquader, dessen Verrundung mit 40 mm scheitert; die Bohrung danach rechnet nicht mehr."
kernel = "netz"
base = "quader.netz"
promises = { objects = 1, stops = true, findings = ["op.fillet_edges.GeometryError"], actions = { correct_input = "op.fillet_edges.GeometryError", change_selection = "op.fillet_edges.GeometryError" } }
[[scene.halt.ops]]
op = "fillet_edges"
inputs = ["obj_1"]
params = { radius = 40.0 }
[[scene.halt.ops]]
op = "drill_hole"
inputs = ["obj_1"]
params = { diameter = 5.0, z = 20.0 }

[scene.zweites_projekt]
summary = "Ein kleiner Netzwürfel 10 mm — das Projekt, zu dem während einer Rechnung gewechselt wird."
kernel = "netz"
promises = { objects = 1, body = "closed" }
[[scene.zweites_projekt.ops]]
op = "create_box"
params = { width = 10.0, depth = 10.0, height = 10.0 }

# --- Befunde mit Handlungen --------------------------------------------------------

[scene."zu_fein.netz"]
summary = "Ein offener Würfel in Zentimetern, auf 0,05 mm verfeinert: das Verfeinern sagt ab."
kernel = "netz"
sources = { src_1 = "meshes/broken_open.stl" }
promises = { objects = 1, stops = true, findings = ["op.remesh_mesh.ValidationError", "ingest.not_watertight"], actions = { use_reachable = "op.remesh_mesh.ValidationError", repair_before_and_retry = "op.remesh_mesh.ValidationError" } }
[[scene."zu_fein.netz".ops]]
op = "load"
params = { source = "src_1", unit = "cm", mend = false, wide_holes = false }
[[scene."zu_fein.netz".ops]]
op = "remesh_mesh"
inputs = ["obj_1"]
params = { edge = 0.05 }

[scene."geglaettet.netz"]
summary = "Ein Netzquader, fünfzigmal geglättet: er schrumpft, und seine Wände werden zu dünn für die Düse."
kernel = "netz"
base = "quader.netz"
promises = { objects = 1, findings = ["mesh.smooth_shrank", "settings.wall_below_nozzle"], actions = { remesh_and_retry = "mesh.smooth_shrank", open_print_settings = "settings.wall_below_nozzle" } }
[[scene."geglaettet.netz".ops]]
op = "smooth_mesh"
inputs = ["obj_1"]
params = { iterations = 50 }

[scene."kreuzend.netz"]
summary = "Drei Körper, zwei davon durchdringen sich; das Zerlegen in vier Körper sagt ab."
kernel = "netz"
sources = { src_1 = "meshes/crossing_and_apart.stl" }
promises = { stops = true, findings = ["ingest.multiple_components", "op.split_bodies.ValidationError", "slice.large_overhang"], actions = { resolve_intersections = "ingest.multiple_components", split_bodies = "ingest.multiple_components", recount_and_retry = "op.split_bodies.ValidationError", orient_for_print = "slice.large_overhang", show_support_need = "slice.large_overhang" } }
[[scene."kreuzend.netz".ops]]
op = "load"
params = { source = "src_1", unit = "mm" }
[[scene."kreuzend.netz".ops]]
op = "split_bodies"
inputs = ["obj_1"]
params = { count = 4 }

[scene."offen_repariert.netz"]
summary = "Ein teilweise offenes Netz, repariert: das weite Loch wird geschlossen und gemeldet."
kernel = "netz"
sources = { src_1 = "meshes/partially_open.stl" }
promises = { objects = 1, findings = ["repair.wide_hole_filled"], actions = { show_location = "repair.wide_hole_filled", leave_open = "repair.wide_hole_filled" } }
[[scene."offen_repariert.netz".ops]]
op = "load"
params = { source = "src_1", unit = "mm", mend = false, wide_holes = false }
[[scene."offen_repariert.netz".ops]]
op = "repair"
inputs = ["obj_1"]
params = {}

# --- Befunde aus Datei, Fenster und Umgebung ---------------------------------------
# Jede Befundhandlung beginnt in einer Szene, deren Befund sie trägt (Konzept §10).
# Was über das Rezept hinausgeht — eine Korpusdatei als Anfang, Drucker, ausgeschaltete
# Schritte, Einfügemarke, Auslöser, Vorbedingungen —, steht in der Szene und wirkt beim
# Prüfen wie im Fenster (``function_scenes.check_scene``).

[scene."duenne_huelse.netz"]
summary = "Ein Netzzylinder Ø 8 mit einer Bohrung Ø 7,4: um die Bohrung bleibt weniger Wand, als der Drucker legt."
kernel = "netz"
promises = { objects = 1, findings = ["perceive.thin_wall"], actions = { show_history = "perceive.thin_wall", show_details = "perceive.thin_wall" } }
[[scene."duenne_huelse.netz".ops]]
op = "create_cylinder"
params = { diameter = 8.0, height = 20.0 }
[[scene."duenne_huelse.netz".ops]]
op = "drill_hole"
inputs = ["obj_1"]
params = { diameter = 7.4, z = 20.0 }

[scene."duenne_huelse.exakt"]
summary = "Derselbe Zylinder exakt."
kernel = "exakt"
promises = { objects = 1, findings = ["perceive.thin_wall"], actions = { show_history = "perceive.thin_wall", show_details = "perceive.thin_wall" } }
[[scene."duenne_huelse.exakt".ops]]
op = "create_brep_cylinder"
params = { diameter = 8.0, height = 20.0 }
[[scene."duenne_huelse.exakt".ops]]
op = "drill_hole"
inputs = ["obj_1"]
params = { diameter = 7.4, z = 20.0 }

[scene."schale_am_netz.netz"]
summary = "Ein Netzquader, an dem das exakte Aushöhlen absagt: Es braucht Flächen und Kanten."
kernel = "netz"
base = "quader.netz"
promises = { objects = 1, stops = true, findings = ["op.shell_exact.NeedsSolidError"], actions = { mesh_to_exact = "op.shell_exact.NeedsSolidError" } }
[[scene."schale_am_netz.netz".ops]]
op = "shell_exact"
inputs = ["obj_1"]
params = {}

[scene.export_gemischt]
summary = "Ein exakter Quader und ein Netzquader; der Export nach STEP sagt, dass das Netz keine Flächen hat."
cause = { kind = "export", format = "step" }
promises = { objects = 2, findings = ["export.needs_solid"], actions = { export_as_mesh = "export.needs_solid", mesh_to_exact = "export.needs_solid", show_details = "export.needs_solid" } }
[[scene.export_gemischt.ops]]
op = "create_brep_box"
params = { width = 40.0, depth = 30.0, height = 20.0 }
[[scene.export_gemischt.ops]]
op = "create_box"
params = { width = 40.0, depth = 30.0, height = 20.0, x = 60.0 }

[scene."geschuetzte_leiste.netz"]
summary = "Eine Leiste 600 mm, Unterseite, Oberseite und Längsseiten geschützt; Automatisch teilen findet daneben keine Ebene."
kernel = "netz"
protected = { obj_1 = ["face_1", "face_3", "face_4", "face_top"] }
cause = { kind = "auto_split", object = "obj_1" }
promises = { objects = 1, findings = ["split.blocked_by_protection"], actions = { release_protection = "split.blocked_by_protection", split_along_line = "split.blocked_by_protection" } }
[[scene."geschuetzte_leiste.netz".ops]]
op = "create_box"
params = { width = 600.0, depth = 30.0, height = 20.0 }

[scene."geschuetzte_leiste.exakt"]
summary = "Dieselbe Leiste exakt."
kernel = "exakt"
protected = { obj_1 = ["face_3", "face_4", "face_5", "face_6"] }
cause = { kind = "auto_split", object = "obj_1" }
promises = { objects = 1, findings = ["split.blocked_by_protection"], actions = { release_protection = "split.blocked_by_protection", split_along_line = "split.blocked_by_protection" } }
[[scene."geschuetzte_leiste.exakt".ops]]
op = "create_brep_box"
params = { width = 600.0, depth = 30.0, height = 20.0 }

[scene."ausgeschaltet.netz"]
summary = "Ein Netzquader mit einer Bohrung, deren Schritt ausgeschaltet ist."
kernel = "netz"
base = "quader.netz"
promises = { objects = 1, findings = ["history.step_off"], actions = { reactivate_step = "history.step_off" } }
[[scene."ausgeschaltet.netz".ops]]

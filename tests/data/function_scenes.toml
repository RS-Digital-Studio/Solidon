# Am exakten Kern über *Verrunden mit Verlauf*: Die Rundung mit wachsendem Radius
# ist keine Verrundung fester Breite, sondern eine gerundete Seite. *Text
# aufbringen* trägt am exakten Körper heute keine Merkmale (Bericht D0-L, Fund 1).
[scene."merkmal.curved_face.exakt"]
summary = "Der exakte Quader, senkrechte Kanten verrundet von 2 auf 6 mm: gerundete Seiten."
kernel = "exakt"
base = "quader.exakt"
promises = { objects = 1, kinds = ["curved_face"] }
[[scene."merkmal.curved_face.exakt".ops]]
op = "fillet_edges"
inputs = ["obj_1"]
params = { radius = 2.0, mode = "variable_radius", end_radius = 6.0 }

[scene."merkmal.curved_face.netz"]
summary = "Der Netzquader mit erhabener Schrift „OS“ oben: die Bögen der Buchstaben."
kernel = "netz"
base = "quader.netz"
promises = { objects = 1, kinds = ["curved_face"] }
[[scene."merkmal.curved_face.netz".ops]]
op = "label_text"
inputs = ["obj_1"]
params = { text = "OS", size = 12.0, depth = 1.0, z = 20.0 }

[scene."merkmal.edge_loop.netz"]
summary = "Der offene Würfel: sein Rand ist ein offener Randzug."
kernel = "netz"
base = "offen.netz"
promises = { objects = 1, kinds = ["edge_loop"] }


promises = { stops = true, findings = ["evaluate.needs_resting_step"], actions = { reactivate_step = "evaluate.needs_resting_step", suppress_step = "evaluate.needs_resting_step" } }
[[scene."ruhender_eingang.exakt".ops]]
op = "create_brep_box"
params = { width = 40.0, depth = 30.0, height = 20.0 }
suppressed = true
[[scene."ruhender_eingang.exakt".ops]]
op = "drill_hole"
inputs = ["obj_1"]
params = { diameter = 5.0, z = 20.0 }

[scene."einfuegen.netz"]
summary = "Ein Netzquader mit Bohrung; die Einfügemarke steht vor der Bohrung."
kernel = "netz"
base = "quader.netz"

# Die häufigsten Kundenziele für I3 des Funktionsdurchgangs (Konzept §4,
# „Vorschlag statt Suche“): Steht das Ziel nach der Auswahl ohne Suche und ohne
# Aufklappen da — als Hauptaktion der Auswahlkarte oder als Feld oben im
# Merkmalfenster? Schwelle 80 % dieser Liste.
#
# Vorab festgelegt aus Bauplan §2.2 (die vier Hauptwege) und den anonymen
# Fragebögen. Keine Kundenkennung: Der Korpus wird veröffentlicht.
#
#   goal       das Ziel in den Worten des Kunden
#   origin     bauplan oder fragebogen; ref nennt die Stelle bzw. den Wunsch
#   scene      Startszene aus function_scenes.toml
#   selection  was gewählt ist, in den Wörtern der Anforderungen der Funktionsliste:
#              koerper:1, koerper:2, kante oder merkmal:<art>
#   target     wo das Ziel stehen soll: operation:<op> als Hauptaktion,
#              feature:<schlüssel> oder edge:<op> als Feld oben


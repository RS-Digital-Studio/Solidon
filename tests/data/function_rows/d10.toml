# Zeilenspezifikationen für D10 — Filament, Beschriftung, Passungen, Parameter
# (RM-746). Format: Bauplan D0 §2.4. Eine Zeile ohne Eintrag hier ist „ungeprüft“.

[row."Bearbeiten/Parameter anlegen …"]
start_scene = "quader.exakt"
example_goal = "Ein Maß „breite“ mit 40 mm anlegen."
inputs = { "field:name" = "breite", "field:value" = 40.0 }
search_probes = [
  { word = "Variable", origin = "cad" },
  { word = "Parameter", origin = "cad" },
  { word = "Benutzerparameter", origin = "cad" },
]
questions = ["Wie lege ich ein Maß an, das ich mehrfach verwende?"]
fault_case = { inputs = { "field:name" = "breite außen" }, expected = "meldung" }

[row."Bearbeiten/Parameter anlegen …".expectation]
"parameter.breite" = { value = 40.0, tolerance = 0.0005, origin = "Konstruktion: getippte 40 mm; Toleranz = halbe letzte Stelle des Wertfelds (drei Nachkommastellen, dialogs.ParameterDialog)" }

# Gegenstücke brauchen zwei markierte Stellen an zwei Teilen
# (``MainWindow._counterpart_targets``); in der leeren Szene ist der Eintrag grau,
# und der Sprachfall maß eine Fläche, die nie aufging (Probelauf F-32).
[row."Erzeugen/Bausteine/Gegenstücke setzen …"]
start_scene = "zwei_koerper.exakt"
route = [
  { target = "tree.row:obj_1.face_1" },
  { target = "tree.row:obj_2.face_1", modifier = "ctrl" },
]

# Die Fenster der Parameter, des Kalibrierens und der Gegenstücke öffnet ihr
# Menüeintrag; ohne Weg lief die Zeile im Sprachfall nie (FD-101).
[row."dialog:parameter_dialog"]
route = [{ target = "menu:menubar.parameter_anlegen" }]

[row."dialog:calibration_dialog"]
route = [{ target = "menu:menubar.material_kalibrieren" }]

[row."dialog:counterpart_dialog"]
route = [
  { target = "tree.row:obj_1.face_1" },
  { target = "tree.row:obj_2.face_1", modifier = "ctrl" },
  { target = "menu:menubar.gegenstuecke_setzen" },
]

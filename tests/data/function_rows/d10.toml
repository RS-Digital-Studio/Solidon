# Zeilenspezifikationen für D10 — Filament, Beschriftung, Passungen, Parameter
# (RM-746). Format: Bauplan D0 §2.4. Eine Zeile ohne Eintrag hier ist „ungeprüft“.

[row."Bearbeiten/Parameter anlegen …"]
start_scene = "quader.exakt"
example_goal = "Ein Maß „breite“ mit 40 mm anlegen."
inputs = { "field:name" = "breite", "field:value" = 40.0 }
search_probes = [
  { word = "Variable", origin = "cad" },
  { word = "Parameter", origin = "cad" },
  { word = "Benutzerparameter", origin = "cad" },
]
questions = ["Wie lege ich ein Maß an, das ich mehrfach verwende?"]
fault_case = { inputs = { "field:name" = "breite außen" }, expected = "meldung" }

[row."Bearbeiten/Parameter anlegen …".expectation]
"parameter.breite" = { value = 40.0, tolerance = 0.0005, origin = "Konstruktion: getippte 40 mm; Toleranz = halbe letzte Stelle des Wertfelds (drei Nachkommastellen, dialogs.ParameterDialog)" }

# Gegenstücke brauchen zwei markierte Stellen an zwei Teilen
# (``MainWindow._counterpart_targets``); in der leeren Szene ist der Eintrag grau,
# und der Sprachfall maß eine Fläche, die nie aufging (Probelauf F-32).
[row."Erzeugen/Bausteine/Gegenstücke setzen …"]
start_scene = "zwei_koerper.exakt"
route = [
  { target = "tree.row:obj_1.face_1" },
  { target = "tree.row:obj_2.face_1", modifier = "ctrl" },
]

# Die Fenster der Parameter, des Kalibrierens und der Gegenstücke öffnet ihr
# Menüeintrag; ohne Weg lief die Zeile im Sprachfall nie (FD-101).
[row."dialog:parameter_dialog"]
route = [{ target = "menu:menubar.parameter_anlegen" }]

[row."dialog:calibration_dialog"]
route = [{ target = "menu:menubar.material_kalibrieren" }]

[row."dialog:counterpart_dialog"]
route = [
  { target = "tree.row:obj_1.face_1" },
  { target = "tree.row:obj_2.face_1", modifier = "ctrl" },
  { target = "menu:menubar.gegenstuecke_setzen" },
]

# Das Kontextmenü der Parameterleiste öffnet der Rechtsklick auf die Beschriftung
# einer Maßzeile; das Wertfeld trägt das Bearbeitungsmenü des Zahlenfelds (FD-101).
[row."menu:parameters.edit"]
route = [{ target = "parameters.first.label", button = "right" }]

# Den Bindedialog öffnet der Knopf der Parameterleiste, sobald eine feste Zahl zu
# einem Maß passt: In parameter.exakt ist die Höhe 20 = 0,5 · breite (FD-101).
[row."dialog:binding_dialog"]
route = [{ target = "parameters.bind" }]

# Einen eigenen Baustein speichert der Katalog erst mit einem Projektparameter;
# am starren Quader nennt er nur den Grund (FD-101).
[row."dialog:recipe_dialog"]
start_scene = "parameter.exakt"
route = [
  { target = "menu:menubar.bausteinkatalog" },
  { target = "parts.save" },
]

# Die Profile des Slicers wählt *Wählen …* im Fenster einer neuen Spule; die
# Auswahl öffnet erst, wenn der Arbeiter sie gelesen hat (FD-101).
[row."dialog:slicer_filament_dialog"]
start_scene = "quader_mit_slicer.exakt"
route = [
  { target = "menu:menubar.filamentlager" },
  { target = "filament.add" },
  { target = "filament.profile" },
]

# Der Farbwähler steht am Farbknopf im Fenster einer neuen Spule (FD-101).
[row."meldung:_pick_colour"]
route = [
  { target = "menu:menubar.filamentlager" },
  { target = "filament.add" },
  { target = "filament.colour" },
]

# Die Knöpfe auf diesen Wegen sind eigene Zeilen: Der Katalog und das Fenster der
# neuen Spule öffnen erst ihr Menüeintrag und *Spule von Hand anlegen* (FD-101).
[row."parts.save"]
route = [{ target = "menu:menubar.bausteinkatalog" }]

[row."filament.profile"]
route = [{ target = "menu:menubar.filamentlager" }, { target = "filament.add" }]

[row."filament.colour"]
route = [{ target = "menu:menubar.filamentlager" }, { target = "filament.add" }]

# Die Rückfrage nach der Größe stellt *Gegenstücke setzen …* an einem Gewinde, das
# zu Größen zweier Reihen passt: gewählt sind das Gewinde und eine Fläche der
# Platte (FD-101).
[row."meldung:action_counterpart"]
start_scene = "gewinde_zwei_reihen.netz"
route = [
  { target = "tree.row:obj_1.thread_1" },
  { target = "tree.row:obj_2.face_1", modifier = "ctrl" },
  { target = "menu:menubar.gegenstuecke_setzen" },
]

# Sind alle Filamente des Körpers belegt, fragt das Filamentfeld beim Wählen einer
# Spule aus dem Lager, welches sie ersetzt. Das Feld steht unter *Weitere
# Einstellungen* von *Text aufbringen* (FD-101).
[row."meldung:_replacement_slot"]
start_scene = "sieben_filamente.netz"
route = [
  { target = "operation:label_text" },
  { target = "field:slot" },
  { target = "filament.spool" },
]

[row."filament.spool"]
start_scene = "sieben_filamente.netz"
route = [{ target = "operation:label_text" }, { target = "field:slot" }]

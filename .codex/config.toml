# Python-Ausgaben behalten auch in Windows-Pipes echte Umlaute.
[shell_environment_policy.set]
PYTHONUTF8 = "1"

# Die beiden Unity-Server gehören zu anderen Projekten und sind in Claude Code
# für Solidon ebenfalls abgeschaltet.
[mcp_servers.unity-mcp]
enabled = false

[mcp_servers.unity-mcp-hwi]
enabled = false

# C# wird in Roberts .NET-Projekten gebraucht, hier rechnet Python.
[plugins."csharp-lsp@claude-plugins-official"]
enabled = false

developer_instructions = """
# Auslieferung\r
\r
Was ausgeliefert wird, ist grün und rechtlich sauber. Beides ist prüfbar,\r
also wird es geprüft.\r
\r
Gespräch auf Deutsch. **Bezeichner englisch, Docstrings und Kommentare deutsch.**\r
\r
## Lizenzen\r
\r
- **Keine GPL-Abhängigkeit.** Kein `pymeshlab`, kein `PyQt`. OpenSCAD und\r
  Slicer werden extern aufgerufen, nie mitgeliefert.\r
- LGPL-Bibliotheken (PySide6, OCCT hinter `cadquery-ocp`) bleiben **dynamisch\r
  gebunden**.\r
- Jede neue Abhängigkeit: Lizenz feststellen, in die Freigabeliste eintragen,\r
  bei Bedarf Hinweis im Über-Dialog, `tests/test_licences.py` grün.\r
- Die Prüfung läuft **bevor** die Abhängigkeit eingebaut wird. Eine\r
  GPL-Bibliothek, die schon im Code steckt, ist teurer als eine Alternative,\r
  die vorher gesucht wurde.\r
\r
## Paket\r
\r
`packaging/solidon3d.spec` mit PyInstaller. Vor dem Bauen:\r
\r
```\r
.venv\\Scripts\\python.exe -m pytest -q\r
.venv\\Scripts\\python.exe -m ruff check . && .venv\\Scripts\\python.exe -m ruff format --check .\r
.venv\\Scripts\\python.exe -m mypy\r
.venv\\Scripts\\python.exe tools/make_examples.py\r
```\r
\r
Eine Installationsdatei aus einer roten Suite ist schlimmer als keine. Die drei\r
Beispielprojekte sind zugleich Dokumentation, Abnahmeprüfung und Inhalt des\r
Startbildschirms — sie werden erzeugt, nicht von Hand gepflegt.\r
\r
## CI\r
\r
`.github/workflows/build.yml` prüft auf Windows, Linux und macOS, paketiert auf\r
Windows und Linux, und signiert nur, wenn das Zertifikat als Secret vorliegt.\r
Der Signaturschritt überspringt sich selbst, damit ein Fork eine unsignierte\r
Version bekommt statt eines Fehlschlags. Beim Ändern des Workflows: die\r
Reihenfolge bleibt Suite → Paket.\r
\r
## Phasenabschluss\r
\r
Eine Phase gilt als fertig, wenn ihre Abnahmekriterien aus Bauplan §40 grün\r
sind — nicht wenn sie sich vollständig anfühlt. Prüfe gegen die Kriterien, und\r
melde jedes offene ausdrücklich, statt es abzurunden."""

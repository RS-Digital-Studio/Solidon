developer_instructions = """
# Operationen bauen\r
\r
Du baust Operationen für Solidon. Eine Op ist die einzige Stelle, an der\r
Geometrie entsteht oder sich ändert.\r
\r
Gespräch auf Deutsch. **Bezeichner englisch, Docstrings und Kommentare deutsch.**\r
\r
## Zuerst\r
\r
Lies `AGENTS.md` (Checkliste „neue Operation"), Bauplan §10 (Register), §17.2\r
(Rückfallkette), §25 (Katalog) und mindestens **zwei bestehende Ops** aus\r
`app/core/geom/` — die zeigen den Ton besser als jede Beschreibung. Prüfe im\r
Register, ob es die Op oder eine sehr ähnliche schon gibt.\r
\r
## Die acht Schritte\r
\r
1. `@register_op(...)` mit `name`, `title`, `category`, `params`, `reversible`,\r
   `consumes`/`produces`, `applies_to`, `deterministic`, `doc`, optional\r
   `shortcut` — Kürzel gegen das Register prüfen, Dubletten fallen im\r
   Konsistenztest auf\r
2. Parameterschema: Grenzen, Einheiten, Vorgaben, und die Zuordnung zu\r
   Vorderseite oder „Weitere Einstellungen". Vorn stehen zwei bis drei Werte.\r
   Jeder `doc`-Satz sagt, was der Wert bewirkt, nicht wie er heißt\r
3. Umsetzung als `OpFn` gegen `manifold3d`/`trimesh`; Boolesches über die\r
   Rückfallkette, erreichte Stufe in `solver`\r
4. Bei Zufall: Startwert aus `ctx.seed`, `deterministic=False`\r
5. Beide Qualitätsstufen bedienen (`ctx.quality`) — in Entwurf endet die Kette\r
   nach Stufe 2\r
6. Befunde als `findings` zurückgeben, nicht selbst protokollieren\r
7. Geometrietest gegen den Korpus in `tests/data/` — **zuerst der Test**, dann\r
   die Umsetzung\r
8. Texte über `tr()`, deutsch und englisch in `app/i18n/locales/`\r
\r
## Woran es meistens scheitert\r
\r
- Toleranz als Zahl statt `auto:<material>`\r
- Ein Fehlerpfad ohne `suggestions` — „Boolesche Op fehlgeschlagen" ohne\r
  Handlungsvorschlag ist unfertig\r
- `ctx.scene` schreibend benutzt statt ein neues Objekt zu erzeugen\r
- Die Op ändert Materialslots, ohne sie nach `voxel` neu zu übertragen\r
- Ein Test, der das erzeugte Ergebnis mit sich selbst vergleicht\r
- Vergessene Übersetzung — fällt erst in `test_translations.py` auf\r
\r
## Abschluss\r
\r
```\r
.venv\\Scripts\\python.exe -m pytest -q\r
.venv\\Scripts\\python.exe -m ruff check . && .venv\\Scripts\\python.exe -m mypy\r
```\r
\r
Melde am Ende: Name der Op, wo sie im Katalog steht, welche Tests sie decken,\r
und was bewusst offen blieb. Wenn die Aufgabe mehrdeutig war, hast du gefragt\r
statt geraten — das ist Regel 21, und sie gilt auch für dich."""

developer_instructions = """
# Sprache

Die Regelung steht in `AGENTS.md` (Sprachregelung, Begriffszuordnung), die
Glossare und das Nachtragen neuer Schlüssel in `.claude/rules/uebersetzung.md`.
Hier steht, wie du Verstöße findest und behebst.

## Finden

1. **Deutsche Stämme in Bezeichnern** unter `app/` und `tools/`.
   `tests/test_language_rules.py` findet nur, was in `GERMAN_STEMS` steht — die
   Regel gilt der Sprache, nicht der Liste. Neben jedem Fund die Nachbarn
   ansehen (Schleifenvariablen, Parameter, Zuweisungen) und jeden neuen Stamm
   in die Liste eintragen.
2. **Feste Zeichenketten** in `app/ui/`: Texte in `setText`,
   `setWindowTitle`, `setToolTip`, `setPlaceholderText`, `addItem`,
   `QMessageBox` und Menüeinträgen ohne `tr()` — und Auswahlwerte, die als
   Schlüssel statt als Name erscheinen (`_CHOICE_NAMES` in `app/ui/labels.py`).
3. **Kataloge** in `app/i18n/locales/`: fehlende und leere Einträge, verwaiste
   Schlüssel, abweichende Platzhalter.
4. **Docstrings und Kommentare** in `app/` und `tools/` deutsch mit echten
   Umlauten; in `tests/` gilt der Bestand der Datei.

## Beheben

Eine Umbenennung zieht jede Verwendung mit — Aufrufer, Tests, Dokumentation.
Ein Bezeichner, der als Schlüssel in Projektdateien oder Schemata steht, ist
Dateiformat: umbenennen nur mit Migration (Checkliste „Dateiformat ändern“ in
`AGENTS.md`). Weder Text- noch Schlüsselsuche trägt allein: Ein Schlüssel kann
zwei Bedeutungen haben, ein Wort anders übersetzt sein — jeden Treffer an
seiner Verwendung entscheiden. Fehlende Übersetzungen nach den Glossaren
ergänzen; neue Formulierungen sind Sache von oberflaechentexte.

## Prüfen

Nach jeder Änderung an `app/` oder `tools/` diese zwei Läufe, `ruff` über den
ganzen Baum — sie prüfen den Bestand, nicht nur die geänderte Datei:

```
.venv\\Scripts\\python.exe -m pytest -q tests/test_language_rules.py
.venv\\Scripts\\python.exe -m ruff check .
```

Danach die betroffenen Tests über `tools/affected_tests.py`; bei einer
Katalogänderung ist das die Suite, also das Entwicklungstor nach `.agents/skills/pruefen/SKILL.md`.
"""

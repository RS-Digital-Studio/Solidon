developer_instructions = """
# Sprache\r
\r
Dieses Projekt trennt streng, und die Trennung ist getestet.\r
\r
| Bereich | Sprache |\r
|---|---|\r
| Bezeichner, Dateinamen, Modulnamen | Englisch |\r
| Docstrings, Kommentare | **Deutsch** |\r
| Schlüssel in Projektdatei und Schemata | Englisch |\r
| Oberflächentexte | Deutsch **und** Englisch über `tr()` |\r
| Doku, Bauplan, Roadmap, Commits | Deutsch |\r
\r
Gespräch mit Robert: Deutsch, echte Umlaute, keine Emojis.\r
\r
## Begriffszuordnung (verbindlich)\r
\r
Op → `Operation`, Transaktion → `Transaction`, Baustein → `Part`, Steckbrief →\r
`digest`, Prüfbericht → `report`, Passung → `Fit`, Provenienz → `provenance`,\r
Profil → `Profile`, Regelsammlung → `rules`. Ein neuer Begriff kommt **zuerst**\r
in Bauplan §4.2, dann in den Code — nicht umgekehrt.\r
\r
## Was du prüfst\r
\r
1. **Feste Zeichenketten** in `app/ui/`: jeder sichtbare Text muss durch `tr()`\r
   gehen. Suche nach Anführungszeichen in `setText`, `setWindowTitle`,\r
   `setToolTip`, `addItem`, `QMessageBox`, Menüeinträgen.\r
2. **Vollständigkeit** der Dateien in `app/i18n/locales/`: fehlende Schlüssel,\r
   leere Werte, verwaiste Einträge, unterschiedliche Platzhalter zwischen den\r
   Sprachen.\r
3. **Deutsche Stämme in Bezeichnern** unter `app/` — das prüft\r
   `tests/test_language_rules.py`, aber ein Fund vor dem roten Lauf ist\r
   billiger.\r
4. **Deutsche Docstrings in `app/`.** Fallen keinem Test auf und sind trotzdem\r
   falsch. In `tests/` sind sie erlaubt.\r
5. **Typografie in Oberflächentexten**: „20 × 20 mm" mit echtem Malzeichen,\r
   deutsche Anführungszeichen, Umlaute ausgeschrieben.\r
\r
## Übersetzen\r
\r
Die deutsche Version ist die Vorlage, die englische die Übersetzung — nicht\r
andersherum. Der Ton ist knapp und sachlich, in ganzen Sätzen, ohne Ausrufe:\r
so wie der Rest der Anwendung spricht. Ein Text, der eine Handlung anbietet,\r
beginnt mit dem Verb.\r
\r
`.venv\\Scripts\\python.exe -m pytest tests/test_translations.py tests/test_language_rules.py -q`"""

developer_instructions = """
# Schichtanalyse und Leistung\r
\r
Solidon schneidet, um zu **beurteilen** — nicht um zu drucken. Die Datei für\r
den Drucker kommt vom externen Slicer, und das bleibt so.\r
\r
Gespräch auf Deutsch. **Bezeichner englisch, Docstrings und Kommentare deutsch.**\r
\r
## Die harte Trennung\r
\r
Kennzahlen aus der eigenen Schichtanalyse und aus dem G-Code des externen\r
Slicers werden **nie vermischt** (Regel 14). Jeder Wert weist seine Herkunft\r
aus. Ein geschätztes Stützvolumen ist etwas anderes als ein gemessenes, und\r
wer beides in eine Zahl legt, macht den Prüfbericht wertlos.\r
\r
In der Oberfläche heißt es „Schichtanalyse", nicht „Vorschau": gezeigt wird\r
Geometrie, nicht der Werkzeugweg.\r
\r
## Prüfen gegen Rechenbares\r
\r
Die Kennzahlen prüft man gegen Körper, deren Werte man ausrechnen kann —\r
Quader, Zylinder, Kegel, eine Brücke bekannter Weite, ein schwebender Würfel\r
als Insel. Erst wenn die stimmen, sagt ein Lauf über ein echtes Modell etwas\r
aus.\r
\r
Was aus der Analyse fällt: Überhangfläche je Schicht, Stützvolumen,\r
Querschnittsverlauf (sprunghafte Änderung heißt Verzugs- und Haftungsrisiko),\r
**Inseln** — Konturen ohne Verbindung nach unten —, erste Schichtfläche,\r
Brückenweiten, kleinste Strukturbreite gegen den Düsendurchmesser.\r
\r
## Leistung\r
\r
Das Budget aus §31 ist die Messlatte, unter anderem:\r
\r
| Vorgang | Zielwert |\r
|---|---|\r
| Schichtanalyse, 200 000 Dreiecke, 0,2 mm | unter 300 ms |\r
| Boolesche Op, 200 000 Dreiecke | unter 2 s |\r
| Feature-Erkennung, 200 000 Dreiecke | unter 1 s |\r
| Analysekarte Wandstärke | unter 3 s, im Hintergrund |\r
| Orientierungssuche, 200 Kandidaten | unter 20 s, abbrechbar |\r
| Anwendungsstart bis bedienbar | unter 3 s |\r
\r
**Erst messen, dann optimieren.** Eine Verschlechterung um mehr als ein\r
Viertel gilt als Fehler, nicht als Rauschen — Messwerte je Lauf festhalten\r
(`tests/test_performance.py`, Marker `performance`). Zahlen sind\r
maschinenabhängig: vergleiche nur Läufe derselben Maschine, und sag dazu,\r
worauf gemessen wurde.\r
\r
Lange Läufe sind abbrechbar (`ctx.cancelled`) und melden Fortschritt\r
(`ctx.progress`) — auch das ist Teil der Anforderung, nicht Komfort."""

developer_instructions = """
# Agentenschicht\r
\r
Der LLM-Agent steuert denselben Operations-API fern, den auch die Menüs\r
benutzen. Er bekommt keine Sonderwege, keine eigene Geometrie, keinen eigenen\r
Zustand.\r
\r
Gespräch auf Deutsch. **Bezeichner englisch, Docstrings und Kommentare deutsch.** Der\r
Systemprompt selbst ist Text für ein Modell — dessen Sprache richtet sich nach\r
dem, was dort bereits steht.\r
\r
## Die Grundsätze, die du verteidigst\r
\r
- **Ein Vorschlag ist genau eine Transaktion.** Ein Undo nimmt ihn vollständig\r
  zurück. Wer zwei Dinge auf einmal vorschlägt, hat einen Fehler gebaut.\r
- **Bausteine vor Primitiven, Op-Liste vor OpenSCAD, Parameter vor Zahlen,\r
  Fragen vor Raten.** Alle vier im Systemprompt verankert, alle vier in der\r
  Suite gemessen.\r
- **`ask_user` ist Pflicht.** Die Suite enthält absichtlich mehrdeutige\r
  Anfragen und zählt, ob gefragt statt geraten wurde.\r
- **Jeder Chatbeitrag verweist auf seine Transaktion.** Wird sie\r
  zurückgenommen, gilt der Beitrag als verworfen. Ohne diese Kopplung\r
  argumentiert der Agent nach jedem Undo über einen Zustand, den es nicht\r
  mehr gibt.\r
- **`origin` an jeder Transaktion**: Urheber, Modell, Version des\r
  Systemprompts, Version der Regelsammlung, Temperatur. Die Projektdatei ist\r
  auch Fehlerbericht — das ist der einzige Weg, später zu verstehen, unter\r
  welchen Bedingungen eine Op entstanden ist.\r
\r
## Sicherheit ist hier nicht optional\r
\r
Quelltext aus dem Modell ist so fremd wie Quelltext aus einer geschickten\r
Datei: OpenSCAD wird vor jedem Lauf geprüft (`import`, `include`, `use`,\r
`surface` nur relativ, unterhalb des Arbeitsordners), kein `eval` für\r
Ausdrücke, fester Arbeitsordner, Zeit- und Speicherlimit, kein Netzzugriff.\r
\r
## Messen statt behaupten\r
\r
Eine Änderung an Systemprompt oder Regelsammlung ist eine\r
Verhaltensänderung. Also:\r
\r
1. Eintrag unter `core/knowledge/rules/` mit Datum und Anlass\r
2. Version erhöhen\r
3. `tools/run_agent_suite.py` vorher und nachher, **beide Ergebnisse\r
   festhalten** — der Lauf kostet Geld und braucht einen Schlüssel, also\r
   ankündigen statt einfach starten\r
4. Verschlechtert sich die Quote, wird die Regel **zurückgenommen**\r
\r
`tests/test_agent_suite.py` prüft ohne Modell, was das Gerüst garantiert. Was\r
nur mit Modell messbar ist, gehört nicht in die Suite.\r
\r
## Abschluss\r
\r
Melde: Was geändert wurde, welche Version stieg, welche Quote vorher und\r
nachher stand — und wenn keine gemessen wurde, sag das deutlich, statt die\r
Änderung für gut zu erklären."""

    <!-- Das Anwendungssymbol: ein isometrischer Körper in der Markenfarbe,
           mit einer Bohrung auf der Deckfläche (die Operation) und Schichtlinien
           an der linken Flanke (der Druck). Eine gestaltete Form, von Hand —
           gerastert wird sie von tools/make_icon.py, nie von Hand gepflegt. -->
      <!-- Deckfläche -->
      <polygon points="64,18 104,41 64,64 24,41" fill="#e08b4e" />
      <!-- linke Flanke, mit Schichtlinien -->

# Erzeugt von tools/make_linux_packages.py — Werte aus app/branding.py.
# Von Hand geänderte Zeilen verliert der nächste Lauf.
id: de.rsdigital.solidon3d
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: Solidon3D
finish-args:
  - --socket=x11
  - --env=QT_QPA_PLATFORM=xcb
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=home
  - --filesystem=/var/lib/flatpak/app:ro
  - --filesystem=/var/lib/flatpak/exports/bin:ro
  - --filesystem=xdg-data/flatpak/app:ro
  - --filesystem=xdg-data/flatpak/exports/bin:ro
  - --filesystem=~/.var/app/com.orcaslicer.OrcaSlicer:ro
  - --filesystem=~/.var/app/io.github.softfever.OrcaSlicer:ro
  - --filesystem=~/.var/app/com.prusa3d.PrusaSlicer:ro
  - --filesystem=~/.var/app/com.bambulab.BambuStudio:ro
  - --filesystem=~/.var/app/com.ultimaker.cura:ro
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.fcitx.Fcitx5
  - --talk-name=org.freedesktop.portal.Fcitx
modules:
  - name: solidon3d
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/solidon3d
      - cp -r Solidon3D/* /app/lib/solidon3d/
      - mkdir -p /app/bin
      - ln -s /app/lib/solidon3d/Solidon3D /app/bin/Solidon3D
      - install -Dm644 solidon3d.desktop /app/share/applications/de.rsdigital.solidon3d.desktop
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/de.rsdigital.solidon3d.svg
      - install -Dm644 de.rsdigital.solidon3d.metainfo.xml /app/share/metainfo/de.rsdigital.solidon3d.metainfo.xml
      - install -Dm644 de.rsdigital.solidon3d.xml /app/share/mime/packages/de.rsdigital.solidon3d.xml
    sources:
      - type: dir
        path: ../dist/Solidon3D
        dest: Solidon3D
      - type: file
        path: solidon3d.desktop
      - type: file
        path: de.rsdigital.solidon3d.metainfo.xml
      - type: file
        path: de.rsdigital.solidon3d.xml
      - type: file
        path: ../app/images/icon/solidon3d.svg
        dest-filename: icon.svg

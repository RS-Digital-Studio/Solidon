# Ausgewählte Slicertests mit echten Programmen auf Linux und macOS
# (Entscheidung Robert, 07.10.2026). Windows deckt der lokale Lauf.
#
# Vor dem Merge nach main bestimmt `tools/ci_selection.py` die Slicertests,
# die eine Änderung berührt, und gibt den Befehl dazu aus:
#
#   gh workflow run slicer-auswahl.yml --ref <zweig> \
#     -f tests="tests/test_real_slicers.py -m slicer; tests/test_print_settings.py -m slicer"
#
# Installiert werden nur die Programme, die die gewählten Fälle über
# `pytest.mark.slicer(<programm>)` verlangen (`ci_selection.py --programs`);
# `programme` überschreibt das. Jedes Programm hat eine feste Version mit
# Prüfsumme und wird nur aufgerufen, nie mitgeliefert (AGENTS.md, Regel 15).
# Ein übersprungener Slicertest ist hier rot: `SOLIDON_REQUIRE_SLICERS`
# macht ein fehlendes Programm zum Fehler, und der Bericht jeder Auswahl darf
# keinen übersprungenen Fall enthalten.
#
# Die Qt-Schritte sind die von `fenster-auswahl.yml`; wer dort etwas ändert,
# zieht es hier nach.

name: Slicerauswahl

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Pytest-Auswahlen, durch Semikolon getrennt; je Auswahl ein Prozess"
        type: string
        required: true
      programme:
        description: "Leer: aus den Markern der Auswahl. Sonst Programme mit Leerzeichen, etwa: cura orcaslicer"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: slicerauswahl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selection:
    name: Slicerauswahl (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, macos-26-intel]
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: "1"
      SOLIDON_REQUIRE_SLICERS: "1"
      # Über die Umgebung, nie in den Befehl eingesetzt: Eine Eingabe ist Text,
      # kein Teil des Skripts.
      SELECTION: ${{ inputs.tests }}
      WANTED: ${{ inputs.programme }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml

      - name: Qt-Systembibliotheken, FUSE und Flatpak (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 xvfb xauth dbus dbus-x11 \
            libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers \
            fonts-dejavu-core fontconfig \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-sync1 libxcb-glx0 \
            libfuse2t64 flatpak \
            libwebkit2gtk-4.1-0 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0

      - name: Abhängigkeiten
        run: python -m pip install -c constraints.txt -e ".[dev,geom,ui,brep]"

      - name: Programme der Auswahl
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$WANTED" ]; then
            programs="$WANTED"
          else
            programs=$(python tools/ci_selection.py --programs "$SELECTION")
          fi
          if [ -z "$programs" ]; then
            echo "::error::Die Auswahl verlangt keinen Slicer — sie enthält keinen Slicertest."
            exit 1
          fi
          # Nur Programmnamen gehen nach $GITHUB_ENV: Ein Zeilenumbruch in der
          # Eingabe setzte sonst weitere Umgebungsvariablen für jeden
          # folgenden Schritt (BASH_ENV, PYTHONPATH …).
          if ! [[ "$programs" =~ ^[a-z]+( [a-z]+)*$ ]]; then
            echo "::error::Programme sind kleingeschriebene Namen, durch je ein Leerzeichen getrennt, etwa \"orcaslicer cura\"."
            exit 1
          fi
          echo "Programme: $programs"
          echo "PROGRAMS=$programs" >> "$GITHUB_ENV"

      - name: Slicer installieren (feste Version, Prüfsumme)
        shell: bash
        run: |
          set -euo pipefail
          arch=$(uname -m)
          fetch() {  # Adresse, SHA-256, Ziel
            curl -fL --retry 3 --retry-delay 5 -o "$3" "$1"
            if [ "$RUNNER_OS" = "macOS" ]; then
              echo "$2  $3" | shasum -a 256 -c -
            else
              echo "$2  $3" | sha256sum --check --strict
            fi
          }
          appimage() {  # Adresse, SHA-256 — nach /opt, unter dem Namen des Herstellers
            name=$(basename "$1")
            fetch "$1" "$2" "$RUNNER_TEMP/$name"
            sudo install -m 0755 "$RUNNER_TEMP/$name" "/opt/$name"
          }
          dmg() {  # Adresse, SHA-256 — das Bündel nach /Applications
            fetch "$1" "$2" "$RUNNER_TEMP/slicer.dmg"
            # Die Lizenzabfrage mancher Abbilder will ein „Y“; yes endet am
            # geschlossenen Rohr, und pipefail zählte das als Fehler.
            { yes || true; } | hdiutil attach "$RUNNER_TEMP/slicer.dmg" -nobrowse -noverify -mountpoint /Volumes/slicer > /dev/null
            # PrusaSlicer legt sein Bündel eine Ebene tiefer ab.
            bundle=$(find /Volumes/slicer -maxdepth 2 -name '*.app' -prune | head -1)
            if [ -z "$bundle" ]; then
              ls -la /Volumes/slicer
              echo "::error::Kein Programmbündel im Abbild."
              exit 1
            fi
            sudo cp -R "$bundle" /Applications/
            hdiutil detach /Volumes/slicer
            sudo xattr -dr com.apple.quarantine "/Applications/$(basename "$bundle")" 2>/dev/null || true
            echo "installiert: /Applications/$(basename "$bundle")"
          }
          gh=https://github.com
          for program in $PROGRAMS; do
            echo "::group::$program ($RUNNER_OS $arch)"
            case "$RUNNER_OS/$program" in
              Linux/orcaslicer)
                appimage $gh/SoftFever/OrcaSlicer/releases/download/v2.4.2/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.4.2.AppImage \
                  d12fb8c8eac1aecd2dfb6377acd48f994f8fa439ed5292fa532dd82880f029fd ;;
              macOS/orcaslicer)
                dmg $gh/SoftFever/OrcaSlicer/releases/download/v2.4.2/OrcaSlicer_Mac_universal_V2.4.2.dmg \
                  e15e7bb1b66214ec6e96b169b388004179c4f5f705effcdaf8c80d4992ee0366 ;;
              Linux/prusaslicer)
                # Seit 2.9 gibt es PrusaSlicer für Linux nur als Flatpak; die
                # Commit-Kennung ist die Prüfsumme des Inhalts.
                sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
                sudo flatpak install -y --noninteractive flathub com.prusa3d.PrusaSlicer
                sudo flatpak update -y --noninteractive \
                  --commit=bf3534e4ffc688bbaf625206f27f9333b1b8820d3425dae19d3083b47e08ce79 com.prusa3d.PrusaSlicer
                test "$(flatpak info --show-commit com.prusa3d.PrusaSlicer)" = bf3534e4ffc688bbaf625206f27f9333b1b8820d3425dae19d3083b47e08ce79
                flatpak info com.prusa3d.PrusaSlicer | head -12 ;;
              macOS/prusaslicer)
                dmg $gh/prusa3d/PrusaSlicer/releases/download/version_2.9.6/PrusaSlicer-2.9.6.dmg \
                  94fd7b8a9f87c9631e1c71739b15b184fc5f4c0ceabd69072f1c78f229a4fe40 ;;
              Linux/cura)
                appimage $gh/Ultimaker/Cura/releases/download/5.13.0/UltiMaker-Cura-5.13.0-linux-X64.AppImage \
                  100f068127b2598167f00ba4db0e0699ded45adf97bbab2d22ff171a1e1ecc40 ;;
              macOS/cura)
                if [ "$arch" = arm64 ]; then
                  dmg $gh/Ultimaker/Cura/releases/download/5.13.0/UltiMaker-Cura-5.13.0-macos-ARM64.dmg \
                    1483806486a19728bc0f363f847d75be3f179ea43c7f074bfc327f5b5c6e05ad
                else
                  dmg $gh/Ultimaker/Cura/releases/download/5.13.0/UltiMaker-Cura-5.13.0-macos-X64.dmg \
                    341ea41e0bc7a75361823cf9720c1d1ded9a8b2f3c4d791de2266f8d647f5d85
                fi ;;
              Linux/bambustudio)
                appimage $gh/bambulab/BambuStudio/releases/download/v02.08.02.61/BambuStudio_ubuntu24.04-v02.08.02.61-20260820225108.AppImage \
                  d501b103fac5424513ec0e8d6bc145fb30719de2c7d94d7320d723740c81a7fd ;;
              macOS/bambustudio)
                dmg $gh/bambulab/BambuStudio/releases/download/v02.08.02.61/Bambu_Studio_mac-v02.08.02.61-20260820225108.dmg \
                  cf648a95858fb630e1353c4987038df60d6caab693f18411fb95fb809f2d6926 ;;
              Linux/elegooslicer)
                appimage $gh/ELEGOO-3D/ElegooSlicer/releases/download/v1.5.3.5/ElegooSlicer_Linux_V1.5.3.5.AppImage \
                  7b3b3f08e0d0d51bb472c85865d1be9b0c28385423daba1cb0c3b225d0101afc ;;
              macOS/elegooslicer)
                if [ "$arch" = arm64 ]; then
                  dmg $gh/ELEGOO-3D/ElegooSlicer/releases/download/v1.5.3.5/ElegooSlicer_Mac_arm64_V1.5.3.5.dmg \
                    2ff9db9d398af552738f447ad63710d61407b69a7140457238d1507c978b5d9f
                else
                  dmg $gh/ELEGOO-3D/ElegooSlicer/releases/download/v1.5.3.5/ElegooSlicer_Mac_x86_64_V1.5.3.5.dmg \
                    120467d2f61ff1ed4b085a4f062ee524041e12738a6ee32da5baf53a1a943d9c
                fi ;;
              Linux/crealityprint)
                appimage $gh/CrealityOfficial/CrealityPrint/releases/download/v7.2.1/CrealityPrint-V7.2.1.5476-x86_64-Release.AppImage \
                  b28f66c25d0c6652ed6ae49d0766780f46a5b839b93ce1968e639823e1f6e2f3 ;;
              macOS/crealityprint)
                if [ "$arch" = arm64 ]; then
                  dmg $gh/CrealityOfficial/CrealityPrint/releases/download/v7.2.1/CrealityPrint-7.2.1.5476-macx-arm64-Release.dmg \
                    6fe5eb238a2d73e9bcb524d77d6fb84e32da4c5c957a150b97ffae614c2b0713
                else
                  dmg $gh/CrealityOfficial/CrealityPrint/releases/download/v7.2.1/CrealityPrint-7.2.1.5476-macx-x86_64-Release.dmg \
                    5b89736e41bf1917708a4bb6ba7a62a6f3b3c77dc6f076f9e36386cbd85173ba
                fi ;;
              Linux/anycubicslicernext)
                # Das Paket aus der apt-Quelle des Herstellers, als Datei mit
                # Prüfsumme statt über eine Quelle ohne Signatur.
                fetch https://cdn-universe-slicer.anycubic.com/prod/pool/main/a/anycubicslicernext/AnycubicSlicerNext_linux-v2.0.0.5-20260913065625.deb \
                  fe087a56014ed25cdfe4c3c293b517adaee0a9b2e1ded79f5e394b7968817c15 "$RUNNER_TEMP/anycubic.deb"
                sudo apt-get install -y "$RUNNER_TEMP/anycubic.deb" ;;
              macOS/anycubicslicernext)
                if [ "$arch" = arm64 ]; then
                  dmg https://cdn.anycubic-cloud.anycubic.com/file/2026/09/04/dmg/178852197829378100/develop_859_2.0.0.3_arm64_20260904033804_AnycubicSlicerNext.dmg \
                    de7f34ed119b59f3c541ab6593c1bb7986148d672810737f1bd62d774afa65e2
                else
                  dmg https://cdn.anycubic-cloud.anycubic.com/file/2026/09/04/dmg/178852197400444100/develop_859_2.0.0.3_x86_64_20260904033804_AnycubicSlicerNext.dmg \
                    894efb7b70c186ac3893880ae95e188aaa0c3791d5f6cd971a1d0f22cfebf289
                fi ;;
              *)
                echo "::error::Für $program gibt es auf $RUNNER_OS kein Installationsrezept."
                exit 1 ;;
            esac
            echo "::endgroup::"
          done

      - name: Ausgewählte Slicertests
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/auswahl.py" <<'PY'
          import os
          import shlex
          import subprocess
          import sys
          import xml.etree.ElementTree as ElementTree
          from pathlib import Path

          parts = [part.strip() for part in os.environ["SELECTION"].split(";") if part.strip()]
          if not parts:
              sys.exit("Keine Auswahl angegeben.")
          reports = Path(os.environ["RUNNER_TEMP"]) / "berichte"
          reports.mkdir(exist_ok=True)
          failed = []
          for number, part in enumerate(parts):
              report = reports / f"auswahl-{number}.xml"
              print(f"::group::{part}", flush=True)
              code = subprocess.call(
                  [sys.executable, "-m", "pytest", "-q", "-rs", f"--junitxml={report}", *shlex.split(part)]
              )
              print("::endgroup::", flush=True)
              # Grün ist erst, was gelaufen ist: kein Fall, oder ein übersprungener,
              # ist kein Nachweis.
              totals = {"tests": 0, "skipped": 0}
              if report.is_file():
                  for suite in ElementTree.parse(report).getroot().iter("testsuite"):
                      for key in totals:
                          totals[key] += int(suite.get(key, "0"))
              print(f"{part} -> Exit {code}, {totals['tests']} Fälle, {totals['skipped']} übersprungen", flush=True)
              if code != 0 or totals["tests"] == 0 or totals["skipped"]:
                  failed.append(f"{part} (Exit {code}, {totals['tests']} Fälle, {totals['skipped']} übersprungen)")
          if failed:
              sys.exit("Rot: " + "; ".join(failed))
          print(f"Grün: {len(parts)} Auswahlen")
          PY
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" dbus-run-session -- python "$RUNNER_TEMP/auswahl.py"
          else
            python "$RUNNER_TEMP/auswahl.py"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: slicerauswahl-${{ matrix.os }}
          path: ${{ runner.temp }}/berichte/
          if-no-files-found: warn

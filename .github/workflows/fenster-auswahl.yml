# Ausgewählte Fenstertests auf jeder Paketplattform (Robert, 06.10.2026:
# „Fenstertests jetzt immer Windows, Mac und Linux, alle Versionen“).
#
# Vor einem Commit fährt die Sitzung die Fenstertests, die ihre Änderung
# berührt, lokal unter Windows und hier auf den Rechnern, für die es ein
# Paket gibt: Windows, Linux, Apple Silicon und Intel-Mac — dieselbe Liste wie
# die Paketmatrix in build.yml. Gestartet von Hand auf dem Zweig mit der
# Änderung:
#
#   gh workflow run fenster-auswahl.yml --ref <zweig> \
#     -f tests="tests/test_print_contract_ui.py; tests/test_ui.py -k halt_message"
#
# Jede durch Semikolon getrennte Auswahl läuft in einem eigenen Prozess, wie
# im Release-Tor je Datei: In einem Prozess baut die Suite Hunderte Fenster
# nacheinander, und irgendwann reißt eine Grenze ohne Zeile
# (tools/run_suite_isolated.py).
#
# Je Plattform teilen sich drei Läufer die Auswahlen (`shard`): Auswahl i
# fährt Teil i mod 3, so dass die Teile höchstens eine Auswahl auseinander
# liegen. Ein Teil ohne Auswahl ist grün; eine leere Eingabe ist rot.
#
# Die Schritte vor dem Testlauf sind die von `window-contracts` in build.yml;
# wer dort etwas ändert, zieht es hier nach.

name: Fensterauswahl

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Pytest-Auswahlen, durch Semikolon getrennt; je Auswahl ein Prozess"
        type: string
        required: true

concurrency:
  group: fensterauswahl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selection:
    name: Fensterauswahl (${{ matrix.os }}, Teil ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest, macos-26-intel]
        shard: [0, 1, 2]
    env:
      QT_QPA_PLATFORM: offscreen
      # Über die Umgebung, nie in den Befehl eingesetzt: Eine Eingabe ist Text,
      # kein Teil des Skripts.
      SELECTION: ${{ inputs.tests }}
      SHARD: ${{ matrix.shard }}
      SHARDS: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml

      - name: Qt-Systembibliotheken und Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 xvfb xauth \
            libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers \
            fonts-dejavu-core fontconfig \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-sync1 libxcb-glx0

      - name: Abhängigkeiten
        run: python -m pip install -c constraints.txt -e ".[dev,geom,ui,brep]"

      - name: Konturverkettung übersetzen
        run: python tools/build_slice_core.py

      - name: Ausgewählte Fenstertests
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/auswahl.py" <<'PY'
          import os
          import shlex
          import subprocess
          import sys

          parts = [part.strip() for part in os.environ["SELECTION"].split(";") if part.strip()]
          if not parts:
              sys.exit("Keine Auswahl angegeben.")
          shard, shards = int(os.environ["SHARD"]), int(os.environ["SHARDS"])
          mine = parts[shard::shards]
          print(f"Teil {shard} von {shards}: {len(mine)} von {len(parts)} Auswahlen", flush=True)
          failed = []
          for part in mine:
              print(f"::group::{part}", flush=True)
              code = subprocess.call([sys.executable, "-m", "pytest", "-q", *shlex.split(part)])
              print("::endgroup::", flush=True)
              print(f"{part} -> Exit {code}", flush=True)
              if code != 0:
                  failed.append(f"{part} (Exit {code})")
          if failed:
              sys.exit("Rot: " + "; ".join(failed))
          print(f"Grün: {len(mine)} Auswahlen")
          PY
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" python "$RUNNER_TEMP/auswahl.py"
          else
            python "$RUNNER_TEMP/auswahl.py"
          fi

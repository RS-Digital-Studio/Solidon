# Automatische Bauläufe für alle Zielplattformen (Bauplan §37.2).
#
# Zwei Jobs, und die Reihenfolge trägt: zuerst läuft die Suite, auf jeder
# Plattform, und nur was grün ist, wird paketiert. Ein Installer aus einer
# roten Suite ist schlimmer als gar keiner.
#
# Die Signierung braucht ein Zertifikat, das nicht in diesem Repository liegt.
# Der Schritt steht hier und überspringt sich, wenn das Secret fehlt — ein
# Fork baut dann unsigniert, statt zu scheitern.

name: Bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten
        # Mit `brep`, sonst liefe der zweite Kern nie: seine Tests überspringen
        # sich, wenn OpenCASCADE fehlt (§30).
        run: python -m pip install -e ".[dev,geom,ui,agent,brep]"

      - name: Stil und Typen
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy

      - name: Tests
        # Offscreen: die Runner haben keinen Bildschirm, und der Viewport sagt
        # das, statt den Prozess mitzunehmen.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  package:
    name: Paket (${{ matrix.os }})
    needs: suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      # Absichtlich auf Job-Ebene: ein Schritt kann den `secrets`-Kontext nicht
      # im eigenen `if` lesen, und sein eigenes `env` dort auch nicht. Dies ist
      # die eine Stelle, die die Bedingung unten sieht.
      SIGN_CERTIFICATE: ${{ secrets.SIGN_CERTIFICATE }}
      SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten
        run: |
          python -m pip install -e ".[geom,ui,agent,brep]"
          python -m pip install pyinstaller

      - name: Beispielprojekte erzeugen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_examples.py

      - name: Bauen
        run: pyinstaller packaging/formwerk.spec --noconfirm

      - name: Signieren (Windows)
        # Erst die Anwendung, dann unten der Installer — was in die Setup-Datei
        # wandert, muss vorher signiert sein.
        if: runner.os == 'Windows' && env.SIGN_CERTIFICATE != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGN_CERTIFICATE)
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          & signtool sign /f $pfx /p $env:SIGN_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            "dist/Formwerk/Formwerk.exe"

      - name: Inno Setup sicherstellen (Windows)
        # Auf den GitHub-Runnern vorinstalliert; die Prüfung hält den Lauf
        # auch auf einem Runner am Leben, der es nicht mitbringt.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue) -and
              -not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
          }

      - name: Installer bauen (Windows)
        if: runner.os == 'Windows'
        run: python tools/make_installer.py

      - name: Installer signieren (Windows)
        if: runner.os == 'Windows' && env.SIGN_CERTIFICATE != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGN_CERTIFICATE)
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $setup = Get-ChildItem dist -Filter "Formwerk-Setup-*.exe" | Select-Object -First 1
          & signtool sign /f $pfx /p $env:SIGN_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            $setup.FullName

      - name: Archiv packen (Linux)
        # Als tar.gz, nicht als roher Ordner: der Artefakt-Upload verliert die
        # Ausführungsrechte, das Archiv behält sie.
        if: runner.os == 'Linux'
        run: |
          version=$(python -c "from app.branding import APP_VERSION; print(APP_VERSION)")
          tar -czf "dist/Formwerk-${version}-linux-x86_64.tar.gz" -C dist Formwerk

      - name: Installer hochladen (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: formwerk-setup-windows
          path: dist/Formwerk-Setup-*.exe

      - name: Archiv hochladen (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: formwerk-linux
          path: dist/Formwerk-*-linux-x86_64.tar.gz

# Automatische Bauläufe für alle Zielplattformen (Bauplan §37.2).
#
# Drei Jobs. Die ersten zwei tragen eine Reihenfolge: zuerst läuft die Suite,
# auf jeder Plattform, und nur was grün ist, wird paketiert. Ein Installer aus
# einer roten Suite ist schlimmer als gar keiner. Beide bauen gegen
# `constraints.txt`, damit ein Lauf heute dasselbe installiert wie einer in
# drei Monaten.
#
# Der dritte steht daneben und läuft wöchentlich: er lässt die Fassungen frei
# auflösen und meldet, wenn eine neue etwas bricht. Ohne ihn erfährt man davon
# erst beim nächsten frischen Klon — und dann mitten in einer anderen Arbeit.
#
# Die Signierung braucht ein Zertifikat, das nicht in diesem Repository liegt.
# Der Schritt steht hier und überspringt sich, wenn das Secret fehlt — ein
# Fork baut dann unsigniert, statt zu scheitern.
#
# Das Repository ist privat, und private Minuten sind gezählt — macOS zehnfach,
# Windows doppelt. Deshalb läuft der tägliche Push nur auf Ubuntu; die volle
# Drei-Plattform-Matrix und die Paketierung laufen bei Tags und beim Handstart
# (workflow_dispatch), also genau dann, wenn veröffentlicht wird.

name: Bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Montags früh: ein Lauf die Woche findet eine gebrochene Fassung, bevor
    # sie jemandem im Weg steht.
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  suite:
    name: Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && fromJSON('["windows-latest", "ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Qt-Systembibliotheken (Linux)
        # PySide6 lädt libEGL auch offscreen; ohne sie scheitert schon der
        # Import in jedem UI-Test.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Abhängigkeiten
        # Mit `brep`, sonst liefe der zweite Kern nie: seine Tests überspringen
        # sich, wenn OpenCASCADE fehlt (§30). Gegen `constraints.txt`, damit
        # dieser Lauf denselben Satz installiert wie der letzte grüne.
        run: python -m pip install -c constraints.txt -e ".[dev,geom,ui,agent,brep]"

      - name: Stil und Typen
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy

      - name: Tests
        # Offscreen: die Runner haben keinen Bildschirm, und der Viewport sagt
        # das, statt den Prozess mitzunehmen. Ohne die Leistungstests: §31
        # misst eine Referenzmaschine, geteilte Runner streuen zu stark —
        # das Budget prüft der lokale Lauf.
        #
        # Wieder ein Aufruf, und das ist der Beweis: vom 06. bis zum 12.08.2026
        # starb der Runner in jedem Lauf mit einem Segmentierungsfehler in
        # `HistoryPanel.show_document`. Eine Messung mit zerlegter Suite zeigte,
        # dass der Absturz wandert — er hing an keinem Test, sondern an den
        # Fenstern, die sich über den Lauf ansammelten. Die Fixture in
        # `tests/conftest.py` zerstört sie jetzt planmäßig. Bleibt dieser
        # Aufruf grün, war das die Ursache.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not performance"

  package:
    name: Paket (${{ matrix.os }})
    needs: suite
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      # Absichtlich auf Job-Ebene: ein Schritt kann den `secrets`-Kontext nicht
      # im eigenen `if` lesen, und sein eigenes `env` dort auch nicht. Dies ist
      # die eine Stelle, die die Bedingung unten sieht.
      SIGN_CERTIFICATE: ${{ secrets.SIGN_CERTIFICATE }}
      SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Qt-Systembibliotheken (Linux)
        # Auch hier: die Beispielprojekte und die PyInstaller-Analyse
        # importieren Module, die ihre Grafikbibliothek beim Laden ziehen.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Abhängigkeiten
        # Derselbe Satz wie in der Suite: was geprüft wurde, wird paketiert.
        run: |
          python -m pip install -c constraints.txt -e ".[geom,ui,agent,brep]"
          python -m pip install pyinstaller

      - name: Beispielprojekte erzeugen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_examples.py

      - name: Prüfmodul kompilieren und Manifest signieren
        # V4c (Konzept §2 I H4/H5): das Prüfmodul reist als Maschinencode,
        # das Manifest deckt die vier Grenzdateien. Cython und setuptools
        # sind reine Bau-Abhängigkeiten und landen nicht im Paket.
        run: |
          python -m pip install -c constraints.txt cython setuptools
          python tools/build_licence_module.py

      - name: Bauen
        run: pyinstaller packaging/solidon3d.spec --noconfirm

      - name: Ohne Signatur bauen (Windows)
        # Kein stummer Übersprung: die Demo geht unsigniert hinaus, und das
        # gehört ins Protokoll, damit niemand ein signiertes Paket vermutet.
        #
        # Der Weg darunter ist ohnehin einer von gestern: seit Juni 2023 geben
        # die Zertifizierungsstellen keine exportierbaren Code-Signing-Schlüssel
        # mehr heraus — ein PFX in einem Secret ist für ein neu gekauftes
        # Zertifikat kein möglicher Weg. Wenn signiert wird, dann über Azure
        # Trusted Signing, und dann wird dieser Schritt ersetzt, nicht gefüllt.
        if: runner.os == 'Windows' && env.SIGN_CERTIFICATE == ''
        shell: pwsh
        run: |
          Write-Host "::warning::Unsigniert gebaut - SmartScreen warnt beim ersten Start."

      - name: Signieren (Windows)
        # Erst die Anwendung, dann unten der Installer — was in die Setup-Datei
        # wandert, muss vorher signiert sein.
        if: runner.os == 'Windows' && env.SIGN_CERTIFICATE != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGN_CERTIFICATE)
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          # Der Name kommt aus app/branding.py, nicht aus dieser Datei — hier
          # stand er zweimal und war nach der Umbenennung zweimal falsch.
          $name = python -c "from app.branding import APP_NAME; print(APP_NAME)"
          & signtool sign /f $pfx /p $env:SIGN_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            "dist/$name/$name.exe"

      - name: Inno Setup sicherstellen (Windows)
        # Auf den GitHub-Runnern vorinstalliert; die Prüfung hält den Lauf
        # auch auf einem Runner am Leben, der es nicht mitbringt.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue) -and
              -not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
          }

      - name: Installer bauen (Windows)
        if: runner.os == 'Windows'
        run: python tools/make_installer.py

      - name: Installer signieren (Windows)
        if: runner.os == 'Windows' && env.SIGN_CERTIFICATE != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGN_CERTIFICATE)
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $setup = Get-ChildItem dist -Filter "*-Setup-*.exe" | Select-Object -First 1
          & signtool sign /f $pfx /p $env:SIGN_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            $setup.FullName

      - name: Archiv packen (Linux)
        # Als tar.gz, nicht als roher Ordner: der Artefakt-Upload verliert die
        # Ausführungsrechte, das Archiv behält sie.
        if: runner.os == 'Linux'
        run: |
          name=$(python -c "from app.branding import APP_NAME; print(APP_NAME)")
          version=$(python -c "from app.branding import APP_VERSION; print(APP_VERSION)")
          tar -czf "dist/${name}-${version}-linux-x86_64.tar.gz" -C dist "${name}"

      - name: Prüfsummen (Windows)
        # Sie stehen auf der Download-Seite neben der Datei — bei einem
        # unsignierten Paket ist das die einzige Möglichkeit, die Herkunft zu
        # prüfen. Als Datei neben dem Artefakt und im Protokoll: das eine holt
        # man mit, das andere liest man ohne Download.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter "*-Setup-*.exe" | ForEach-Object {
            $sum = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$sum  $($_.Name)" | Tee-Object -FilePath "dist/$($_.Name).sha256"
          }

      - name: Prüfsummen (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          for archive in *-linux-x86_64.tar.gz; do
            sha256sum "$archive" | tee "$archive.sha256"
          done

      - name: Installer hochladen (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: solidon3d-setup-windows
          path: |
            dist/*-Setup-*.exe
            dist/*-Setup-*.exe.sha256
          # Der private Speicher fasst 500 MB, ein Paket rund 250 — was
          # veröffentlicht wird, liegt danach auf der Website, nicht hier.
          retention-days: 7

      - name: Archiv hochladen (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: solidon3d-linux
          path: |
            dist/*-linux-x86_64.tar.gz
            dist/*-linux-x86_64.tar.gz.sha256
          retention-days: 7

  latest:
    name: Neueste Fassungen
    # Die Frühwarnung: ohne `constraints.txt`, also alles frisch aufgelöst.
    # Wird dieser Job rot, während `suite` grün bleibt, liegt es an einer neuen
    # Fassung und nicht am Code — und im Protokoll steht, an welcher.
    #
    # Nur Ubuntu und nur wöchentlich: private Minuten sind gezählt, und für
    # diese Frage genügt eine Plattform. Er hängt an keinem anderen Job und
    # blockiert nichts — er meldet.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Qt-Systembibliotheken
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Abhängigkeiten ohne Constraints
        run: python -m pip install -e ".[dev,geom,ui,agent,brep]"

      - name: Installierte Fassungen
        # Gehört ins Protokoll: nach einem roten Lauf sieht man hier, was sich
        # gegenüber `constraints.txt` bewegt hat.
        run: python -m pip freeze --exclude-editable

      - name: Stil und Typen
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not performance"

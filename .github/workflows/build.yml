          $downloadRoot = (Resolve-Path "signing-download").Path
          $downloadFiles = @(Get-ChildItem -LiteralPath $downloadRoot -Recurse -File -Force)
          $downloadNames = @($downloadFiles | ForEach-Object { $_.FullName.Substring($downloadRoot.Length + 1).Replace('\','/') } | Sort-Object)
          if ($downloadNames.Count -ne 2 -or (Compare-Object $downloadNames @('windows-signing-input.zip', 'windows-signing-input.zip.sha256'))) { throw "Unbekannte Datei in der Windows-App-Übergabe." }
          $archive = (Resolve-Path "signing-download/windows-signing-input.zip").Path
          $line = (Get-Content -Raw "signing-download/windows-signing-input.zip.sha256").Trim()
          if ($line -notmatch '^([0-9a-f]{64})  windows-signing-input\.zip$') { throw "Ungültige Archiv-Prüfsumme." }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne $Matches[1]) { throw "Geändertes Übergabearchiv." }
          $root = [IO.Path]::GetFullPath((Join-Path $PWD "signing-input"))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          $entries = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          try {
            foreach ($entry in $zip.Entries) {
              $name = $entry.FullName.TrimEnd('/')
              $parts = $name.Split('/')
              if (-not $name -or $entry.FullName.Contains('\') -or [IO.Path]::IsPathRooted($name) -or $parts -contains '' -or $parts -contains '.' -or $parts -contains '..' -or -not $entries.Add($name)) { throw "Unzulässiger oder doppelter Archivpfad: $($entry.FullName)" }
              $destination = [IO.Path]::GetFullPath((Join-Path $root $name))
              if (-not $destination.StartsWith($root.TrimEnd('\') + '\', [StringComparison]::OrdinalIgnoreCase)) { throw "Archivpfad verlässt das Ziel: $name" }
            }
          }
          finally { $zip.Dispose() }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $reparsePoints = @(Get-ChildItem -LiteralPath $root -Recurse -Force | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint })
          if ($reparsePoints) { throw "Die Windows-Übergabe enthält Verknüpfungen oder Reparse-Points." }
          $handoffPath = Join-Path $root "packaging/build/windows-signing.json"
          $handoff = Get-Content -Raw -LiteralPath $handoffPath | ConvertFrom-Json
          $fixed = @{
            application = "dist/Solidon3D/Solidon3D.exe"; source_dir = "dist/Solidon3D"; output_dir = "dist"
            script = "packaging/solidon3d.iss"; licence = "packaging/eula.txt"; icon = "packaging/solidon3d.ico"
            licence_manifest = "packaging/build/licence.manifest"
          }
          if ($handoff.schema_version -ne 1 -or $handoff.app_name -ne 'Solidon3D' -or $handoff.app_vendor -ne 'RS Digital' -or $handoff.app_id -ne 'de.rsdigital.solidon3d' -or $handoff.app_url -ne 'https://solidon3d.de/' -or $handoff.project_suffix -ne '.p3d' -or $handoff.part_file_suffix -ne '.solidon-part' -or $handoff.part_file_mime_type -ne 'application/vnd.solidon.part+json' -or $handoff.app_version -notmatch '^\d+\.\d+\.\d+$' -or $handoff.setup_filename -ne "Solidon3D-Setup-$($handoff.app_version).exe") { throw "Unbekannte Produktangaben in der Übergabe." }
          function Resolve-HandoffPath([string]$name) {
            if ([IO.Path]::IsPathRooted($name) -or $name.Contains('\') -or $name.Split('/') -contains '..') { throw "Unzulässiger Übergabepfad: $name" }
            $path = [IO.Path]::GetFullPath((Join-Path $root $name))
            if (-not $path.StartsWith($root.TrimEnd('\') + '\', [StringComparison]::OrdinalIgnoreCase)) { throw "Pfadausbruch: $name" }
            return $path
          }
          foreach ($name in $fixed.Keys) { if ($handoff.$name -ne $fixed[$name]) { throw "Unbekannter Produktpfad: $name" }; Resolve-HandoffPath $handoff.$name | Out-Null }
          $declared = @($handoff.input_sha256.PSObject.Properties.Name | Sort-Object)
          $actual = @(Get-ChildItem -LiteralPath $root -Recurse -File -Force | ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\','/') } | Where-Object { $_ -ne 'packaging/build/windows-signing.json' } | Sort-Object)
          if (Compare-Object $declared $actual) { throw "Dateiliste und Übergabemanifest weichen voneinander ab." }
          foreach ($entry in $handoff.input_sha256.PSObject.Properties) {
            if ($entry.Value -notmatch '^[0-9a-f]{64}$') { throw "Ungültige Datei-Prüfsumme: $($entry.Name)" }
            $path = Resolve-HandoffPath $entry.Name
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLower() -ne $entry.Value) { throw "Geänderter Signiereingang: $($entry.Name)" }
          }
          "SIGNING_ROOT=$root" >> $env:GITHUB_ENV
          "SIGNING_HANDOFF=$handoffPath" >> $env:GITHUB_ENV
          "ARTIFACT_APP=$(Resolve-HandoffPath 'dist/Solidon3D/Solidon3D.exe')" >> $env:GITHUB_ENV

      - name: Anwendung mit vorhandenem PFX signieren und prüfen
        shell: pwsh
        env:
          SIGN_CERTIFICATE: ${{ secrets.SIGN_CERTIFICATE }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERTIFICATE))
            signtool sign /f $pfx /p $env:SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $env:ARTIFACT_APP
            if ($LASTEXITCODE -ne 0) { throw "Die Anwendung konnte nicht signiert werden." }
            signtool verify /pa /v $env:ARTIFACT_APP
            if ($LASTEXITCODE -ne 0) { throw "Die Signatur der Anwendung ist ungültig." }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Signierten App-Baum neu binden
        shell: pwsh
        run: |
          $handoff = Get-Content -Raw -LiteralPath $env:SIGNING_HANDOFF | ConvertFrom-Json
          $handoff.input_sha256.'dist/Solidon3D/Solidon3D.exe' = (Get-FileHash -LiteralPath $env:ARTIFACT_APP -Algorithm SHA256).Hash.ToLower()
          $handoff | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 $env:SIGNING_HANDOFF
          Compress-Archive -Path "$env:SIGNING_ROOT/*" -DestinationPath windows-signing-input.zip
          $sum = (Get-FileHash windows-signing-input.zip -Algorithm SHA256).Hash.ToLower()
          "$sum  windows-signing-input.zip" | Set-Content -Encoding ascii windows-signing-input.zip.sha256

      - name: Signierten App-Baum übergeben
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidon3d-windows-app-pfx
          path: |
            windows-signing-input.zip
            windows-signing-input.zip.sha256
          if-no-files-found: error
          retention-days: 1

  windows-installer:
    name: Windows-Installer ohne Signierrechte bauen
    needs: [package, windows-app-sign-azure, windows-app-sign-pfx]
    if: >-
      always() && needs.package.result == 'success' &&
      ((vars.WINDOWS_SIGNING_MODE == 'azure' && needs.windows-app-sign-azure.result == 'success') ||
       (vars.WINDOWS_SIGNING_MODE == 'pfx' && needs.windows-app-sign-pfx.result == 'success') ||
       ((vars.WINDOWS_SIGNING_MODE == '' || vars.WINDOWS_SIGNING_MODE == 'unsigned') &&
        needs.windows-app-sign-azure.result == 'skipped' && needs.windows-app-sign-pfx.result == 'skipped'))
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE || 'unsigned' }}
    steps:
      - name: Azure-App-Baum laden
        if: env.WINDOWS_SIGNING_MODE == 'azure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-windows-app-azure
          path: signing-download
      - name: PFX-App-Baum laden
        if: env.WINDOWS_SIGNING_MODE == 'pfx'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-windows-app-pfx
          path: signing-download
      - name: Unsignierten App-Baum laden
        if: env.WINDOWS_SIGNING_MODE == 'unsigned'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-windows-signing-input
          path: signing-download

      - name: Vollständigen App-Baum prüfen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadRoot = (Resolve-Path "signing-download").Path
          $downloadFiles = @(Get-ChildItem -LiteralPath $downloadRoot -Recurse -File -Force)
          $downloadNames = @($downloadFiles | ForEach-Object { $_.FullName.Substring($downloadRoot.Length + 1).Replace('\','/') } | Sort-Object)
          if ($downloadNames.Count -ne 2 -or (Compare-Object $downloadNames @('windows-signing-input.zip', 'windows-signing-input.zip.sha256'))) { throw "Unbekannte Datei in der Windows-App-Übergabe." }
          $archive = (Resolve-Path "signing-download/windows-signing-input.zip").Path
          $line = (Get-Content -Raw "signing-download/windows-signing-input.zip.sha256").Trim()
          if ($line -notmatch '^([0-9a-f]{64})  windows-signing-input\.zip$') { throw "Ungültige Archiv-Prüfsumme." }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne $Matches[1]) { throw "Geändertes Übergabearchiv." }
          $root = [IO.Path]::GetFullPath((Join-Path $PWD "signing-input"))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          $entries = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          try {
            foreach ($entry in $zip.Entries) {
              $name = $entry.FullName.TrimEnd('/')
              $parts = $name.Split('/')
              if (-not $name -or $entry.FullName.Contains('\') -or [IO.Path]::IsPathRooted($name) -or $parts -contains '' -or $parts -contains '.' -or $parts -contains '..' -or -not $entries.Add($name)) { throw "Unzulässiger oder doppelter Archivpfad: $($entry.FullName)" }
              $destination = [IO.Path]::GetFullPath((Join-Path $root $name))
              if (-not $destination.StartsWith($root.TrimEnd('\') + '\', [StringComparison]::OrdinalIgnoreCase)) { throw "Archivpfad verlässt das Ziel: $name" }
            }
          }
          finally { $zip.Dispose() }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $reparsePoints = @(Get-ChildItem -LiteralPath $root -Recurse -Force | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint })
          if ($reparsePoints) { throw "Die Windows-Übergabe enthält Verknüpfungen oder Reparse-Points." }
          $handoffPath = Join-Path $root "packaging/build/windows-signing.json"
          $handoff = Get-Content -Raw -LiteralPath $handoffPath | ConvertFrom-Json
          $fixed = @{
            application = "dist/Solidon3D/Solidon3D.exe"; source_dir = "dist/Solidon3D"; output_dir = "dist"
            script = "packaging/solidon3d.iss"; licence = "packaging/eula.txt"; icon = "packaging/solidon3d.ico"
            licence_manifest = "packaging/build/licence.manifest"
          }
          if ($handoff.schema_version -ne 1 -or $handoff.app_name -ne 'Solidon3D' -or $handoff.app_vendor -ne 'RS Digital' -or $handoff.app_id -ne 'de.rsdigital.solidon3d' -or $handoff.app_url -ne 'https://solidon3d.de/' -or $handoff.project_suffix -ne '.p3d' -or $handoff.part_file_suffix -ne '.solidon-part' -or $handoff.part_file_mime_type -ne 'application/vnd.solidon.part+json' -or $handoff.app_version -notmatch '^\d+\.\d+\.\d+$' -or $handoff.setup_filename -ne "Solidon3D-Setup-$($handoff.app_version).exe") { throw "Unbekannte Produktangaben in der Übergabe." }
          function Resolve-HandoffPath([string]$name) {
            if ([IO.Path]::IsPathRooted($name) -or $name.Contains('\') -or $name.Split('/') -contains '..') { throw "Unzulässiger Übergabepfad: $name" }
            $path = [IO.Path]::GetFullPath((Join-Path $root $name))
            if (-not $path.StartsWith($root.TrimEnd('\') + '\', [StringComparison]::OrdinalIgnoreCase)) { throw "Pfadausbruch: $name" }
            return $path
          }
          foreach ($name in $fixed.Keys) { if ($handoff.$name -ne $fixed[$name]) { throw "Unbekannter Produktpfad: $name" }; Resolve-HandoffPath $handoff.$name | Out-Null }
          $declared = @($handoff.input_sha256.PSObject.Properties.Name | Sort-Object)
          $actual = @(Get-ChildItem -LiteralPath $root -Recurse -File -Force | ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\','/') } | Where-Object { $_ -ne 'packaging/build/windows-signing.json' } | Sort-Object)
          if (Compare-Object $declared $actual) { throw "Dateiliste und Übergabemanifest weichen voneinander ab." }
          foreach ($entry in $handoff.input_sha256.PSObject.Properties) {
            if ($entry.Value -notmatch '^[0-9a-f]{64}$') { throw "Ungültige Datei-Prüfsumme: $($entry.Name)" }
            $path = Resolve-HandoffPath $entry.Name
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLower() -ne $entry.Value) { throw "Geänderter Signiereingang: $($entry.Name)" }
          }
          "SIGNING_ROOT=$root" >> $env:GITHUB_ENV
          "SIGNING_HANDOFF=$handoffPath" >> $env:GITHUB_ENV

      - name: Installer aus der geprüften Übergabe bauen
        shell: pwsh
        run: |
          $compiler = (Get-Command ISCC -ErrorAction SilentlyContinue).Source
          if (-not $compiler) { $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup 6 fehlt auf dem GitHub-Runner." }
          $handoff = Get-Content -Raw -LiteralPath $env:SIGNING_HANDOFF | ConvertFrom-Json
          & $compiler "/DAppName=Solidon3D" "/DAppVersion=$($handoff.app_version)" "/DAppVendor=RS Digital" "/DAppId=de.rsdigital.solidon3d" "/DAppUrl=https://solidon3d.de/" "/DProjectSuffix=.p3d" "/DPartFileSuffix=.solidon-part" "/DPartFileMimeType=application/vnd.solidon.part+json" "/DSourceDir=$(Join-Path $env:SIGNING_ROOT 'dist/Solidon3D')" "/DOutputDir=$(Join-Path $env:SIGNING_ROOT 'dist')" "/DLicenseFile=$(Join-Path $env:SIGNING_ROOT 'packaging/eula.txt')" "/DSetupIconFile=$(Join-Path $env:SIGNING_ROOT 'packaging/solidon3d.ico')" (Join-Path $env:SIGNING_ROOT "packaging/solidon3d.iss")
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup konnte den Installer nicht bauen." }
          $setup = Join-Path $env:SIGNING_ROOT "dist/$($handoff.setup_filename)"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw "Die exakt benannte Setup-Datei fehlt." }
          $sum = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLower()
          "$sum  $($handoff.setup_filename)" | Set-Content -Encoding ascii "$setup.sha256"
          "ARTIFACT_SETUP=$setup" >> $env:GITHUB_ENV

      - name: Unsignierten Demobau ausweisen
        if: env.WINDOWS_SIGNING_MODE == 'unsigned'
        shell: pwsh
        run: Write-Host "::warning::Unsignierter Demobau - SmartScreen warnt beim ersten Start."

      - name: Unsignierten finalen Installer intern übergeben
        if: env.WINDOWS_SIGNING_MODE == 'unsigned'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidon3d-windows-final-private
          path: |
            ${{ env.ARTIFACT_SETUP }}
            ${{ env.ARTIFACT_SETUP }}.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Installer zur Signierung übergeben
        if: env.WINDOWS_SIGNING_MODE != 'unsigned'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidon3d-windows-installer-input
          path: |
            ${{ env.ARTIFACT_SETUP }}
            ${{ env.ARTIFACT_SETUP }}.sha256
          if-no-files-found: error
          retention-days: 1

  windows-installer-sign-azure:
    name: Windows-Installer mit Azure signieren
    needs: windows-installer
    if: vars.WINDOWS_SIGNING_MODE == 'azure'
    runs-on: windows-latest
    environment: production-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Gebundenen Installer laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-windows-installer-input
          path: installer-input
      - name: Exakten Installer prüfen
        shell: pwsh
        run: |
          $inputRoot = (Resolve-Path installer-input).Path
          $files = @(Get-ChildItem -LiteralPath $inputRoot -File -Recurse -Force)
          if ($files | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }) { throw "Installer-Übergabe enthält einen Reparse-Point." }
          $setup = @($files | Where-Object Name -Match '^Solidon3D-Setup-\d+\.\d+\.\d+\.exe$')
          if ($files.Count -ne 2 -or $setup.Count -ne 1 -or $setup[0].DirectoryName -ne $inputRoot -or -not (Test-Path -LiteralPath "$($setup[0].FullName).sha256")) { throw "Unbekannte Installer-Übergabe." }
          $line = (Get-Content -Raw "$($setup[0].FullName).sha256").Trim()
          if ($line -notmatch '^([0-9a-f]{64})  Solidon3D-Setup-\d+\.\d+\.\d+\.exe$' -or (Get-FileHash $setup[0].FullName -Algorithm SHA256).Hash.ToLower() -ne $Matches[1]) { throw "Geänderter Installer-Eingang." }
          "ARTIFACT_SETUP=$($setup[0].FullName)" >> $env:GITHUB_ENV
      - name: Bei Azure für Artifact Signing anmelden
        uses: azure/login@4c03e4685fe81df2c50d5714c7d93cf39d8deb7f # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Installer mit Azure Artifact Signing signieren
        uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30 # v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ env.ARTIFACT_SETUP }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Solidon3D Setup
          description-url: https://solidon3d.de/
      - name: Azure-Signatur prüfen und Prüfsumme erneuern
        shell: pwsh
        run: |
          signtool verify /pa /v $env:ARTIFACT_SETUP
          if ($LASTEXITCODE -ne 0) { throw "Die Signatur des Installers ist ungültig." }
          $sum = (Get-FileHash -LiteralPath $env:ARTIFACT_SETUP -Algorithm SHA256).Hash.ToLower()
          "$sum  $([IO.Path]::GetFileName($env:ARTIFACT_SETUP))" | Set-Content -Encoding ascii "$env:ARTIFACT_SETUP.sha256"
      - name: Finalen Installer intern übergeben
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidon3d-windows-final-private
          path: |
            ${{ env.ARTIFACT_SETUP }}
            ${{ env.ARTIFACT_SETUP }}.sha256
          if-no-files-found: error
          retention-days: 1

  windows-installer-sign-pfx:
    name: Windows-Installer mit PFX signieren
    needs: windows-installer
    if: vars.WINDOWS_SIGNING_MODE == 'pfx'
    runs-on: windows-latest
    environment: production-signing
    permissions:
      contents: read
    steps:
      - name: Gebundenen Installer laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-windows-installer-input
          path: installer-input
      - name: Exakten Installer prüfen
        shell: pwsh
        run: |
          $inputRoot = (Resolve-Path installer-input).Path
          $files = @(Get-ChildItem -LiteralPath $inputRoot -File -Recurse -Force)
          if ($files | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }) { throw "Installer-Übergabe enthält einen Reparse-Point." }
          $setup = @($files | Where-Object Name -Match '^Solidon3D-Setup-\d+\.\d+\.\d+\.exe$')
          if ($files.Count -ne 2 -or $setup.Count -ne 1 -or $setup[0].DirectoryName -ne $inputRoot -or -not (Test-Path -LiteralPath "$($setup[0].FullName).sha256")) { throw "Unbekannte Installer-Übergabe." }
          $line = (Get-Content -Raw "$($setup[0].FullName).sha256").Trim()
          if ($line -notmatch '^([0-9a-f]{64})  Solidon3D-Setup-\d+\.\d+\.\d+\.exe$' -or (Get-FileHash $setup[0].FullName -Algorithm SHA256).Hash.ToLower() -ne $Matches[1]) { throw "Geänderter Installer-Eingang." }
          "ARTIFACT_SETUP=$($setup[0].FullName)" >> $env:GITHUB_ENV
      - name: Installer mit vorhandenem PFX signieren und prüfen
        shell: pwsh
        env:
          SIGN_CERTIFICATE: ${{ secrets.SIGN_CERTIFICATE }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERTIFICATE))
            signtool sign /f $pfx /p $env:SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $env:ARTIFACT_SETUP
            if ($LASTEXITCODE -ne 0) { throw "Der Installer konnte nicht signiert werden." }
            signtool verify /pa /v $env:ARTIFACT_SETUP
            if ($LASTEXITCODE -ne 0) { throw "Die Signatur des Installers ist ungültig." }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
          $sum = (Get-FileHash -LiteralPath $env:ARTIFACT_SETUP -Algorithm SHA256).Hash.ToLower()
          "$sum  $([IO.Path]::GetFileName($env:ARTIFACT_SETUP))" | Set-Content -Encoding ascii "$env:ARTIFACT_SETUP.sha256"
      - name: Finalen Installer intern übergeben
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidon3d-windows-final-private
          path: |
            ${{ env.ARTIFACT_SETUP }}
            ${{ env.ARTIFACT_SETUP }}.sha256
          if-no-files-found: error
          retention-days: 1

  windows-release-check:
    name: Windows-Releaseakte prüfen
    needs: [windows-installer, windows-installer-sign-azure, windows-installer-sign-pfx]
    if: >-
      always() && needs.windows-installer.result == 'success' &&
      ((vars.WINDOWS_SIGNING_MODE == 'azure' && needs.windows-installer-sign-azure.result == 'success') ||
       (vars.WINDOWS_SIGNING_MODE == 'pfx' && needs.windows-installer-sign-pfx.result == 'success') ||
       ((vars.WINDOWS_SIGNING_MODE == '' || vars.WINDOWS_SIGNING_MODE == 'unsigned') &&
        needs.windows-installer-sign-azure.result == 'skipped' && needs.windows-installer-sign-pfx.result == 'skipped'))
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE || 'unsigned' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.14"
      - name: Abhängigkeiten der Zielumgebung
        # Die Releaseakte liest die installierten Wheels
        # (`packages_distributions`) und importiert `tools.make_sbom` → `app`:
        # ohne die Extras des Paketjobs wäre jede native Datei „ohne Besitzer"
        # und der erste Import ein ImportError. Gemessen am 02.09.2026 — der
        # Job hatte bis dahin nie ein echtes Artefakt gesehen.
        run: python -m pip install -c constraints.txt -e ".[geom,ui,agent,brep]"
      - name: Finalen Installer laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-windows-final-private
          path: release-download
      - name: Azure-App-Baum laden
        if: env.WINDOWS_SIGNING_MODE == 'azure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-windows-app-azure
          path: app-download
      - name: PFX-App-Baum laden
        if: env.WINDOWS_SIGNING_MODE == 'pfx'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-windows-app-pfx
          path: app-download
      - name: Unsignierten App-Baum laden
        if: env.WINDOWS_SIGNING_MODE == 'unsigned'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-windows-signing-input
          path: app-download
      - name: Releasebelege fail-closed prüfen
        shell: pwsh
        run: |
          $archive = Resolve-Path app-download/windows-signing-input.zip
          $archiveLine = (Get-Content -Raw app-download/windows-signing-input.zip.sha256).Trim()
          if ($archiveLine -notmatch '^([0-9a-f]{64})  windows-signing-input\.zip$' -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne $Matches[1]) { throw "Geänderter Windows-App-Baum vor der Releaseprüfung." }
          Expand-Archive -LiteralPath $archive -DestinationPath release-app
          $artifactRoot = Resolve-Path release-app/dist/Solidon3D
          $sbom = @(Get-ChildItem -LiteralPath $artifactRoot -Recurse -File -Filter "Solidon3D.cdx.json")
          if ($sbom.Count -ne 1) { throw "Die Windows-Endartefakt-SBOM fehlt oder ist mehrdeutig." }
          $sbomPath = $sbom[0].FullName
          $setup = @(Get-ChildItem release-download -File -Filter 'Solidon3D-Setup-*.exe')
          if ($setup.Count -ne 1 -or -not (Test-Path -LiteralPath "$($setup[0].FullName).sha256")) { throw "Finaler Windows-Installer fehlt oder ist mehrdeutig." }
          $setupLine = (Get-Content -Raw "$($setup[0].FullName).sha256").Trim()
          if ($setupLine -notmatch '^([0-9a-f]{64})  Solidon3D-Setup-\d+\.\d+\.\d+\.exe$' -or (Get-FileHash -LiteralPath $setup[0].FullName -Algorithm SHA256).Hash.ToLower() -ne $Matches[1]) { throw "Geänderter finaler Windows-Installer." }
          Copy-Item -LiteralPath $setup[0].FullName -Destination build/$($setup[0].Name)
          python tools/make_licence_notices.py --write-evidence --sbom $sbomPath --release-evidence build/release-evidence.json --package "windows-installer=build/$($setup[0].Name)"
          if ($LASTEXITCODE -ne 0) { throw "Die Windows-Release-Evidenz wurde nicht geschrieben." }
          python tools/make_licence_notices.py --release-check --artifact-root $artifactRoot --sbom $sbomPath --release-evidence build/release-evidence.json
          if ($LASTEXITCODE -ne 0) { throw "Die Windows-Releasebelege sind unvollständig." }
      - name: Geprüften Installer veröffentlichen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidon3d-setup-windows
          path: release-download/*
          if-no-files-found: error
          retention-days: 7

  macos-app-sign:
    name: macOS-Anwendung signieren (${{ matrix.machine_arch }})
    needs: package
    if: >-
      (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') &&
      (vars.MACOS_SIGNING_MODE == 'signed' || vars.MACOS_SIGNING_MODE == 'notarized')
    runs-on: ${{ matrix.os }}
    environment: production-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            runner_arch: X64
            machine_arch: x86_64
          - os: macos-latest
            runner_arch: ARM64
            machine_arch: arm64
    env:
      MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE }}
    steps:
      - name: Gebundenen App-Baum laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-macos-app-input-${{ matrix.runner_arch }}
          path: app-input

      - name: App-Baum vor Schlüsselimport unveränderlich prüfen
        shell: bash
        run: |
          set -euo pipefail
          files=$(find app-input -mindepth 1 -type f | wc -l | tr -d ' ')
          directories=$(find app-input -mindepth 1 -type d | wc -l | tr -d ' ')
          [ "$files" = 2 ] && [ "$directories" = 0 ] || { echo "Unbekannte Dateien in der macOS-App-Übergabe."; exit 1; }
          archive=$(find app-input -maxdepth 1 -type f -name "Solidon3D-*-macos-${{ matrix.machine_arch }}.zip")
          [ -n "$archive" ] && [ -f "$archive.sha256" ] || { echo "Gebundener App-Baum fehlt."; exit 1; }
          checksum=$(cat "$archive.sha256")
          [[ "$checksum" =~ ^([0-9a-f]{64})[[:space:]][[:space:]]Solidon3D-[0-9]+\.[0-9]+\.[0-9]+-macos-${{ matrix.machine_arch }}\.zip$ ]] || { echo "Ungültige App-Prüfsumme."; exit 1; }
          [ "$(shasum -a 256 "$archive" | awk '{print $1}')" = "${BASH_REMATCH[1]}" ] || { echo "Geänderter App-Baum."; exit 1; }
          while IFS= read -r entry; do
            trimmed=${entry%/}
            case "/$trimmed/" in *'/../'*|*'/./'*|*'//'*) echo "Unzulässiger Archivpfad: $entry"; exit 1;; esac
            case "$trimmed" in /*|*\\*) echo "Unzulässiger Archivpfad: $entry"; exit 1;; esac
          done < <(zipinfo -1 "$archive")
          mkdir app-stage
          ditto -x -k "$archive" app-stage
          [ -d app-stage/Solidon3D.app ] || { echo "Solidon3D.app fehlt."; exit 1; }
          [ "$(find app-stage -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 1 ] || { echo "Unbekanntes Produkt im App-Archiv."; exit 1; }
          /usr/bin/perl -MFile::Find -MCwd=abs_path -e '$root=abs_path($ARGV[0]); find({no_chdir=>1,wanted=>sub{return unless -l $File::Find::name; $path=abs_path($File::Find::name); die "Symlink verlässt App-Baum\n" unless defined($path) && index($path, "$root/")==0}},$root)' app-stage/Solidon3D.app
          plist=app-stage/Solidon3D.app/Contents/Info.plist
          [ "$(plutil -extract CFBundleIdentifier raw "$plist")" = "de.rsdigital.solidon3d" ]
          [ "$(plutil -extract CFBundleName raw "$plist")" = "Solidon3D" ]
          version=$(plutil -extract CFBundleShortVersionString raw "$plist")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          lipo -archs app-stage/Solidon3D.app/Contents/MacOS/Solidon3D | tr ' ' '\n' | grep -qx '${{ matrix.machine_arch }}'
          printf 'ARTIFACT_APP=%s\n' "$PWD/app-stage/Solidon3D.app" >> "$GITHUB_ENV"

      - name: App mit Developer-ID signieren und Schlüssel wieder sperren
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/solidon-app.keychain-db"
          certificate="$RUNNER_TEMP/solidon-app.p12"
          password=$(uuidgen)
          cleanup() {
            security delete-keychain "$keychain" 2>/dev/null || true
            rm -f "$certificate"
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 300 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          codesign --force --deep --options runtime --timestamp --keychain "$keychain" --sign "$APPLE_SIGN_IDENTITY" "$ARTIFACT_APP"
          codesign --verify --deep --strict --verbose=2 "$ARTIFACT_APP"

      - name: Signierte App bei Apple notarisieren
        if: env.MACOS_SIGNING_MODE == 'notarized'
        shell: bash
        env:
          APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent "$ARTIFACT_APP" notarization.zip
          xcrun notarytool submit notarization.zip --apple-id "$APPLE_NOTARY_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_NOTARY_PASSWORD" --wait
          xcrun stapler staple "$ARTIFACT_APP"
          xcrun stapler validate "$ARTIFACT_APP"
          spctl --assess --type execute --verbose=2 "$ARTIFACT_APP"

      - name: Freigegebenen App-Baum neu binden
        shell: bash
        run: |
          set -euo pipefail
          version=$(plutil -extract CFBundleShortVersionString raw "$ARTIFACT_APP/Contents/Info.plist")
          archive="Solidon3D-${version}-macos-${{ matrix.machine_arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$ARTIFACT_APP" "$archive"
          shasum -a 256 "$archive" | tee "$archive.sha256"
      - name: Freigegebenen App-Baum intern übergeben
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidon3d-macos-app-signed-${{ matrix.runner_arch }}
          path: |
            Solidon3D-*-macos-*.zip
            Solidon3D-*-macos-*.zip.sha256
          if-no-files-found: error
          retention-days: 1

  macos-package:
    name: macOS-Installer ohne Signierrechte bauen (${{ matrix.machine_arch }})
    needs: [package, macos-app-sign]
    if: >-
      always() && needs.package.result == 'success' &&
      (((vars.MACOS_SIGNING_MODE == '' || vars.MACOS_SIGNING_MODE == 'unsigned') && needs.macos-app-sign.result == 'skipped') ||
       ((vars.MACOS_SIGNING_MODE == 'signed' || vars.MACOS_SIGNING_MODE == 'notarized') && needs.macos-app-sign.result == 'success'))
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            runner_arch: X64
            machine_arch: x86_64
          - os: macos-latest
            runner_arch: ARM64
            machine_arch: arm64
    env:
      MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE || 'unsigned' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.14"
      - name: Signierten App-Baum laden
        if: env.MACOS_SIGNING_MODE != 'unsigned'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-macos-app-signed-${{ matrix.runner_arch }}
          path: app-input
      - name: Unsignierten App-Baum laden
        if: env.MACOS_SIGNING_MODE == 'unsigned'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-macos-app-input-${{ matrix.runner_arch }}
          path: app-input
      - name: Gebundenen App-Baum auspacken
        shell: bash
        run: |
          set -euo pipefail
          files=$(find app-input -mindepth 1 -type f | wc -l | tr -d ' ')
          directories=$(find app-input -mindepth 1 -type d | wc -l | tr -d ' ')
          [ "$files" = 2 ] && [ "$directories" = 0 ] || { echo "Unbekannte Dateien in der macOS-App-Übergabe."; exit 1; }
          archive=$(find app-input -maxdepth 1 -type f -name "Solidon3D-*-macos-${{ matrix.machine_arch }}.zip")
          [ -n "$archive" ] && [ -f "$archive.sha256" ]
          checksum=$(cat "$archive.sha256")
          [[ "$checksum" =~ ^([0-9a-f]{64})[[:space:]][[:space:]]Solidon3D-[0-9]+\.[0-9]+\.[0-9]+-macos-${{ matrix.machine_arch }}\.zip$ ]]
          [ "$(shasum -a 256 "$archive" | awk '{print $1}')" = "${BASH_REMATCH[1]}" ] || { echo "Geänderter App-Baum."; exit 1; }
          while IFS= read -r entry; do
            trimmed=${entry%/}
            case "/$trimmed/" in *'/../'*|*'/./'*|*'//'*) echo "Unzulässiger Archivpfad: $entry"; exit 1;; esac
            case "$trimmed" in /*|*\\*) echo "Unzulässiger Archivpfad: $entry"; exit 1;; esac
          done < <(zipinfo -1 "$archive")
          ditto -x -k "$archive" dist
          [ -d dist/Solidon3D.app ]
          /usr/bin/perl -MFile::Find -MCwd=abs_path -e '$root=abs_path($ARGV[0]); find({no_chdir=>1,wanted=>sub{return unless -l $File::Find::name; $path=abs_path($File::Find::name); die "Symlink verlässt App-Baum\n" unless defined($path) && index($path, "$root/")==0}},$root)' dist/Solidon3D.app
          cp "$archive" "dist/$(basename "$archive")"
          cp "$archive.sha256" "dist/$(basename "$archive.sha256")"
      - name: Installationspaket bauen
        shell: bash
        run: |
          set -euo pipefail
          notarized=false
          [ "$MACOS_SIGNING_MODE" = notarized ] && notarized=true
          python -c 'import sys; from tools import make_macos_package as tool; tool.write_files(sys.argv[1], notarized=sys.argv[2] == "true"); raise SystemExit(tool.build(sys.argv[1]))' '${{ matrix.machine_arch }}' "$notarized"
          package=$(find dist -maxdepth 1 -type f -name "Solidon3D-*-macos-${{ matrix.machine_arch }}.pkg")
          [ -n "$package" ]
          shasum -a 256 "$package" | tee "$package.sha256"
      - name: Unsignierten finalen Mac-Bau intern übergeben
        if: env.MACOS_SIGNING_MODE == 'unsigned'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidon3d-macos-final-private-${{ matrix.runner_arch }}
          path: |
            dist/Solidon3D-*-macos-*.pkg
            dist/Solidon3D-*-macos-*.pkg.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Mac-Installer zur Signierung übergeben
        if: env.MACOS_SIGNING_MODE != 'unsigned'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidon3d-macos-installer-input-${{ matrix.runner_arch }}
          path: |
            dist/Solidon3D-*-macos-*.pkg
            dist/Solidon3D-*-macos-*.pkg.sha256
          if-no-files-found: error
          retention-days: 1

  macos-installer-sign:
    name: macOS-Installer signieren (${{ matrix.machine_arch }})
    needs: macos-package
    if: vars.MACOS_SIGNING_MODE == 'signed' || vars.MACOS_SIGNING_MODE == 'notarized'
    runs-on: ${{ matrix.os }}
    environment: production-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            runner_arch: X64
            machine_arch: x86_64
          - os: macos-latest
            runner_arch: ARM64
            machine_arch: arm64
    env:
      MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE }}
    steps:
      - name: Gebundenen Installer laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-macos-installer-input-${{ matrix.runner_arch }}
          path: installer-input
      - name: Exakten Installer vor Schlüsselimport prüfen
        shell: bash
        run: |
          set -euo pipefail
          [ "$(find installer-input -mindepth 1 -type f | wc -l | tr -d ' ')" = 2 ]
          [ "$(find installer-input -mindepth 1 -type d | wc -l | tr -d ' ')" = 0 ]
          package=$(find installer-input -maxdepth 1 -type f -name "Solidon3D-*-macos-${{ matrix.machine_arch }}.pkg")
          [ -n "$package" ] && [ -f "$package.sha256" ]
          expected=$(awk '{print $1}' "$package.sha256")
          [ ${#expected} = 64 ] && [ "$(shasum -a 256 "$package" | awk '{print $1}')" = "$expected" ] || { echo "Geänderter Installer-Eingang."; exit 1; }
          printf 'ARTIFACT_PACKAGE=%s\n' "$PWD/$package" >> "$GITHUB_ENV"
      - name: Installer mit Developer-ID signieren und Schlüssel wieder sperren
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/solidon-installer.keychain-db"
          certificate="$RUNNER_TEMP/solidon-installer.p12"
          password=$(uuidgen)
          signed="$RUNNER_TEMP/signed.pkg"
          cleanup() {
            security delete-keychain "$keychain" 2>/dev/null || true
            rm -f "$certificate" "$signed"
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 300 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          productsign --sign "$APPLE_INSTALLER_IDENTITY" --keychain "$keychain" "$ARTIFACT_PACKAGE" "$signed"
          pkgutil --check-signature "$signed"
          mv "$signed" "$ARTIFACT_PACKAGE"
      - name: Installer bei Apple notarisieren
        if: env.MACOS_SIGNING_MODE == 'notarized'
        shell: bash
        env:
          APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$ARTIFACT_PACKAGE" --apple-id "$APPLE_NOTARY_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_NOTARY_PASSWORD" --wait
          xcrun stapler staple "$ARTIFACT_PACKAGE"
          xcrun stapler validate "$ARTIFACT_PACKAGE"
          spctl --assess --type install --verbose=2 "$ARTIFACT_PACKAGE"
      - name: Finalen Installer neu binden
        shell: bash
        run: shasum -a 256 "$ARTIFACT_PACKAGE" | tee "$ARTIFACT_PACKAGE.sha256"
      - name: Finalen Mac-Bau intern übergeben
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidon3d-macos-final-private-${{ matrix.runner_arch }}
          path: |
            ${{ env.ARTIFACT_PACKAGE }}
            ${{ env.ARTIFACT_PACKAGE }}.sha256
          if-no-files-found: error
          retention-days: 1

  macos-release-check:
    name: macOS-Releaseakte prüfen (${{ matrix.machine_arch }})
    needs: [macos-package, macos-installer-sign]
    if: >-
      always() && needs.macos-package.result == 'success' &&
      (((vars.MACOS_SIGNING_MODE == '' || vars.MACOS_SIGNING_MODE == 'unsigned') && needs.macos-installer-sign.result == 'skipped') ||
       ((vars.MACOS_SIGNING_MODE == 'signed' || vars.MACOS_SIGNING_MODE == 'notarized') && needs.macos-installer-sign.result == 'success'))
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            runner_arch: X64
            machine_arch: x86_64
          - os: macos-latest
            runner_arch: ARM64
            machine_arch: arm64
    env:
      MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE || 'unsigned' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.14"
      - name: Abhängigkeiten der Zielumgebung
        # Die Releaseakte liest die installierten Wheels
        # (`packages_distributions`) und importiert `tools.make_sbom` → `app`:
        # ohne die Extras des Paketjobs wäre jede native Datei „ohne Besitzer"
        # und der erste Import ein ImportError. Gemessen am 02.09.2026 — der
        # Job hatte bis dahin nie ein echtes Artefakt gesehen.
        run: python -m pip install -c constraints.txt -e ".[geom,ui,agent,brep]"
      - name: Finalen Installer laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-macos-final-private-${{ matrix.runner_arch }}
          path: release-download
      - name: Signierten App-Baum laden
        if: env.MACOS_SIGNING_MODE != 'unsigned'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-macos-app-signed-${{ matrix.runner_arch }}
          path: app-download
      - name: Unsignierten App-Baum laden
        if: env.MACOS_SIGNING_MODE == 'unsigned'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-macos-app-input-${{ matrix.runner_arch }}
          path: app-download
      - name: Releasebelege fail-closed prüfen
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find app-download -maxdepth 1 -type f -name "Solidon3D-*-macos-${{ matrix.machine_arch }}.zip")
          [ -n "$archive" ] && [ -f "$archive.sha256" ]
          [ "$(shasum -a 256 "$archive" | awk '{print $1}')" = "$(awk '{print $1}' "$archive.sha256")" ] || { echo "Geänderter finaler macOS-App-Baum."; exit 1; }
          mkdir release-app
          ditto -x -k "$archive" release-app
          package=$(find release-download -maxdepth 1 -type f -name "Solidon3D-*-macos-${{ matrix.machine_arch }}.pkg")
          [ -n "$package" ] && [ -f "$package.sha256" ]
          [ "$(shasum -a 256 "$package" | awk '{print $1}')" = "$(awk '{print $1}' "$package.sha256")" ] || { echo "Geänderter finaler macOS-Installer."; exit 1; }
          cp "$package" "build/$(basename "$package")"
          sbom=$(find release-app/Solidon3D.app -type f -name Solidon3D.cdx.json)
          [ "$(printf '%s\n' "$sbom" | sed '/^$/d' | wc -l | tr -d ' ')" = 1 ] || { echo "Die macOS-Endartefakt-SBOM fehlt oder ist mehrdeutig."; exit 1; }
          python tools/make_licence_notices.py --write-evidence --sbom "$sbom" --release-evidence build/release-evidence.json --package "macos-installer=build/$(basename "$package")"
          python tools/make_licence_notices.py --release-check --artifact-root release-app/Solidon3D.app --sbom "$sbom" --release-evidence build/release-evidence.json
      - name: Geprüften Mac-Bau veröffentlichen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidon3d-macos-${{ matrix.runner_arch }}
          path: |
            release-download/*
            app-download/*
          if-no-files-found: error
          retention-days: 7

  latest:
    name: Neueste Versionen
    # Die Frühwarnung: ohne `constraints.txt`, also alles frisch aufgelöst.
    # Wird dieser Job rot, während `suite` grün bleibt, liegt es an einer neuen
    # Version und nicht am Code — und im Protokoll steht, an welcher.
    #
    # Nur Ubuntu und nur wöchentlich: private Minuten sind gezählt, und für
    # diese Frage genügt eine Plattform. Er hängt an keinem anderen Job und
    # blockiert nichts — er meldet.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.14"
          cache: pip

      - name: Qt-Systembibliotheken
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Abhängigkeiten ohne Constraints
        run: python -m pip install -e ".[dev,geom,ui,agent,brep]"

      - name: Installierte Versionen
        # Gehört ins Protokoll: nach einem roten Lauf sieht man hier, was sich
        # gegenüber `constraints.txt` bewegt hat.
        run: python -m pip freeze --exclude-editable

      - name: Stil und Typen
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        # **Dieselbe Auslassung wie in der Suite**, und aus demselben Grund:
        # VTK stirbt auf einem Runner ohne Grafikkarte mit SIGSEGV. Ohne sie
        # war dieser Job am 20.08.2026 rot, obwohl er nichts gefunden hatte —
        # der `union-attr`-Fund davor war echt und ist behoben, dahinter kam
        # der Absturz zum Vorschein.
        #
        # Ein Wächter, der immer schreit, warnt vor nichts mehr: Dieser Job
        # existiert, um zu melden, wenn eine neue Paketversion etwas bricht.
        # Steht er dauerhaft auf rot, sieht niemand mehr hin, und die Meldung
        # geht unter — er prüft deshalb, was er hier prüfen kann.
        run: |
          windowed=$(grep -lE "MainWindow|Viewport\(" tests/test_*.py | tr '\n' ' ')
          ignores=""
          for file in $windowed; do ignores="$ignores --ignore=$file"; done
          echo "::warning::Fensterdateien übersprungen (VTK ohne GL): $windowed"
          # Wie in der Suite oben: ohne die Bausteinbereichstests, sonst steht
          # auch dieser Lauf Stunden bei 49 Prozent.
          python -m pytest -q -n auto -m "not performance" $ignores --ignore=tests/test_parts.py

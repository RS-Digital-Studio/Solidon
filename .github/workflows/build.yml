# Automatische Bauläufe für alle Zielplattformen (Bauplan §37.2).
#
# Suite und Paketierung tragen eine Reihenfolge. Danach trennen eigene Jobs
# App-Signatur, ungeschützten Installerbau, Installer-Signatur und abschließende
# Releaseakte. Nur was grün ist, wird veröffentlicht. Ein Installer aus einer
# roten Suite ist schlimmer als gar keiner. Die Baujobs arbeiten gegen
# `constraints.txt`, damit ein Lauf heute dasselbe installiert wie einer in
# drei Monaten.
#
# Der Versionswächter steht daneben und läuft wöchentlich: er lässt die Versionen frei
# auflösen und meldet, wenn eine neue etwas bricht. Ohne ihn erfährt man davon
# erst beim nächsten frischen Klon — und dann mitten in einer anderen Arbeit.
#
# Die Signierung braucht externe Identitäten, die nicht in diesem Repository
# liegen: Azure Artifact Signing oder ein vorhandenes PFX für Windows sowie
# Developer-IDs und Notarisierungsdaten für Apple. Geheimnisse erreichen nur
# den jeweiligen Signierschritt; Windows erhält OIDC ausschließlich im
# geschützten Signierjob. Ein ausdrücklich als `unsigned` gesetzter Modus baut
# die Demo mit sichtbarer Warnung.
#
# Der tägliche Push läuft nur auf Ubuntu; die volle Drei-Plattform-Matrix und
# die Paketierung laufen bei Tags und beim Handstart (workflow_dispatch), also
# genau dann, wenn veröffentlicht wird.
#
# Die Begründung dafür hat sich am 14.08.2026 geändert. Hier stand, das
# Repository sei privat und private Minuten seien gezählt — macOS zehnfach,
# Windows doppelt. Es ist seit der Umbenennung auf `Solidon` öffentlich, und
# damit kosten die Standard-Runner nichts mehr. Was bleibt, ist die
# Rückmeldezeit: der Ubuntu-Lauf allein braucht schon über zwölf Minuten.
# Wer die Matrix trotzdem auf jeden Push erweitert, tut das mit einem echten
# Grund — plattformabhängige Fehler fallen sonst erst am Tag der
# Veröffentlichung auf, und genau das ist hier schon passiert.

name: Bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Montags früh: ein Lauf die Woche findet eine gebrochene Version, bevor
    # sie jemandem im Weg steht.
    - cron: "0 5 * * 1"
  workflow_dispatch:

# **Ein Stand je Zweig, nicht ein Lauf je Push.** Am 02.09.2026 pushten drei
# Sitzungen innerhalb einer Viertelstunde, und jeder Push startete seinen
# eigenen vollen Lauf — vier Suiten nebeneinander für denselben Zweig, und
# das an einem Tag, an dem GitHub die Läufe wegen des Kostenlimits schon
# einmal abgelehnt hatte. Ein neuer Push auf denselben Zweig bricht den
# älteren Lauf deshalb ab: Geprüft wird, was liegt, nicht, was war. Für
# Tags gilt das nicht — ein Tag ist ein Release, und ein zweiter Tag am
# selben Tag darf dem ersten nicht das Paket wegnehmen; Zeitplan und
# Handstart bleiben aus demselben Grund ungestört.
concurrency:
  group: bauen-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  suite:
    name: Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # **Eine Frist, damit ein Hänger nach einer Stunde rot wird und nicht nach
    # sechs.** Die Suite lag bis zum 02.09.2026 bei 19 bis 23 Minuten; an dem
    # Tag standen drei Läufe je vier Stunden in einer einzigen Testdatei,
    # bevor GitHub sie abbrach, und niemand hat es gesehen, weil ein laufender
    # Lauf wie ein langsamer aussieht. Sechzig Minuten sind das Dreifache des
    # Normalen: Wer sie reißt, hat einen Hänger, keinen langen Lauf.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && fromJSON('["windows-latest", "ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.14"
          cache: pip

      - name: Qt-Systembibliotheken (Linux)
        # PySide6 lädt libEGL auch offscreen; ohne sie scheitert schon der
        # Import in jedem UI-Test. Dazu Xvfb — die Begründung steht unten beim
        # Testschritt.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 xvfb \
            libgl1-mesa-dri \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-sync1 libxcb-glx0

      - name: PHP für die Endpunkttests (Linux)
        # Die Tests gegen `website/api` starten PHPs eingebauten Server und
        # brauchen `pdo_sqlite` für den Aktivierungsdienst. Bis zum 02.09.2026
        # richtete dieser Lauf PHP nie ein — der Ubuntu-Runner brachte es
        # zufällig mit, und ohne es hätten sich 88 Testfälle still
        # übersprungen. Ausdrücklich eingerichtet, und unter `CI` ist fehlendes
        # PHP auf Linux ein roter Test (`tests/php_probe.py`); Windows und
        # macOS richten keines ein und überspringen weiter. Die Paketlisten
        # hat der Schritt davor schon geholt.
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends php-cli php-sqlite3

      - name: Abhängigkeiten
        # Mit `brep`, sonst liefe der zweite Kern nie: seine Tests überspringen
        # sich, wenn OpenCASCADE fehlt (§30). Gegen `constraints.txt`, damit
        # dieser Lauf denselben Satz installiert wie der letzte grüne.
        run: python -m pip install -c constraints.txt -e ".[dev,geom,ui,agent,brep]"

      - name: Konturverkettung übersetzen
        # Zur Laufzeit optional, hier aber Pflicht: ohne sie überspringt sich
        # `tests/test_slice_core.py`, und dann prüft niemand mehr, ob der
        # übersetzte Weg noch dasselbe rechnet wie der über GEOS. Einen
        # Compiler haben alle drei Runner.
        run: python tools/build_slice_core.py

      - name: Stil und Typen
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy

      - name: Tests
        # Offscreen: die Runner haben keinen Bildschirm, und der Viewport sagt
        # das, statt den Prozess mitzunehmen. Ohne die Leistungstests: §31
        # misst eine Referenzmaschine, geteilte Runner streuen zu stark —
        # das Budget prüft der lokale Lauf.
        #
        # **Unter Xvfb, nicht offscreen** — und das ist die Antwort auf eine
        # Woche Abstürze. Vom 06. bis zum 12.08.2026 starb jeder Lauf hier mit
        # einem Segmentierungsfehler: erst in `HistoryPanel.show_document`,
        # nach der Reparatur dieser Stelle beim Aufbau des nächsten Fensters,
        # in `render_window_interactor.initialize`. Der Absturz wanderte, hing
        # also an keinem Test.
        #
        # Was reparierbar war, ist repariert (`tests/conftest.py`: die Sitzung
        # ruft nicht mehr in weggeräumte Widgets). Der Rest ist VTK: es will
        # einen GL-Kontext, und Qts Offscreen-Plattform gibt ihm keinen — auf
        # einem Runner ohne Anzeige rechnet es sich einen aus Software zurecht,
        # bis eine Grenze reißt. Xvfb ist die Anzeige, die es sucht; es ist
        # zugleich der Weg, den pyvista selbst für CI empfiehlt.
        #
        # `QT_QPA_PLATFORM` bleibt ungesetzt: unter Xvfb läuft Qt normal, und
        # `tests/conftest.py` setzt offscreen nur, wenn nichts anderes dasteht.
        #
        # **Und je Fensterdatei ein eigener Prozess.** Xvfb allein hat den
        # Absturz nur nach vorn geholt: er hängt an der Zahl der VTK-Fenster,
        # die ein Prozess nacheinander aufbaut, und die Suite baut siebenhundert.
        # Die Liste wird nicht gepflegt, sondern gesucht — wer eine neue
        # Oberflächendatei anlegt, bekommt ihren eigenen Prozess, ohne hier
        # etwas zu ändern.
        #
        # **Gesucht wird nach dem Aufbau, nicht nach der Erwähnung.** Nach
        # `MainWindow` allein fehlten zwei Dateien, die einen `Viewport` bauen,
        # ohne das Fenster zu nennen: `tests/test_cursors.py` mit acht Aufbauten
        # und `tests/test_plates.py` mit einem. Neun VTK-Fenster mehr im großen
        # Stapel, ohne dass es auffiel — bei einem Absturz, der genau an dieser
        # Zahl hängt.
        #
        # Nach `Viewport(` mit Klammer und nicht nach dem nackten Namen: sieben
        # weitere Dateien *erwähnen* ihn oder `pyvista` nur, in einem Import,
        # einem Kommentar, der Lizenzliste von `test_licences.py`. Die bekämen
        # sonst einen eigenen Prozess für nichts.
        #
        # Nachgemessen am 20.08.2026, lokal auf Windows in *einem* Prozess: die
        # ganze Suite brach bei 5 % mit einer Zugriffsverletzung ab, im
        # `window`-Fixture von `test_analysis_ui.py` (`QThread.__init__`,
        # Exit 139). Dieselbe Datei allein: dreimal grün, 103 Tests. Je
        # Fensterdatei ein Prozess: 4021 Tests grün, kein Absturz. Es ist die
        # Zahl der Fenster und nichts an einem einzelnen Test.
        #
        # **`shell: bash` ist keine Formalie.** Ohne die Zeile führt Windows
        # dieses Skript in PowerShell aus, und die zerbricht an der ersten
        # Ersetzung: „$(subexpression) is missing the closing ')'". Der Schritt
        # endete dort nach zwei Minuten mit einem ParserError — auf Windows lief
        # seit der Umstellung auf Xvfb **kein einziger Test**, und weil
        # `package` an dieser Suite hängt, wurde auch nie etwas paketiert. Auf
        # macOS scheiterte derselbe Aufruf an `xvfb-run`, das es dort nicht
        # gibt. Beides fiel nicht auf, weil die Matrix nur bei Tags und beim
        # Handstart über eine Plattform hinausgeht.
        shell: bash
        env:
          # Unter Xvfb läuft Qt normal; wo es keinen X-Server gibt, muss
          # offscreen stehen. Hier stand „xcb" für alle drei — eine Plattform,
          # die es außerhalb von Linux nicht gibt.
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'xcb' || 'offscreen' }}
          # **Software-Rendering, ausdrücklich.** Kein Runner hat eine
          # Grafikkarte; VTK sucht trotzdem einen echten GL-Kontext und
          # bekommt einen halb emulierten. Dabei stirbt es mit SIGSEGV — auf
          # Linux im geforkten Test, auf Windows ohne Fork, in beiden Fällen
          # wandernd und lokal nie: `test_chat_ui.py` läuft hier in sieben
          # Sekunden mit fünfundzwanzig grünen Tests durch.
          #
          # Mesa ausdrücklich zu verlangen ist der Weg, den pyvista für CI
          # nennt, und er nimmt die Zufälligkeit heraus: langsamer, aber
          # derselbe Kontext auf jedem Lauf.
          LIBGL_ALWAYS_SOFTWARE: 1
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -e
          windowed=$(grep -lE "MainWindow|Viewport\(" tests/test_*.py | tr '\n' ' ')
          ignores=""
          for file in $windowed; do ignores="$ignores --ignore=$file"; done
          # Xvfb nur, wo es eines gibt.
          if [ "$RUNNER_OS" = "Linux" ]; then
            run() { xvfb-run -a --server-args="-screen 0 1920x1080x24" python -m pytest -q "$@"; }
          else
            run() { python -m pytest -q "$@"; }
          fi
          # **Kein Fork, sondern Worker.** `--forked` stand hier als Variable,
          # die nie in einen Aufruf kam — und auf macOS zerlegte es den Lauf
          # ohnehin (20.08.2026: 80 von 110 in zehn Sekunden tot, weil
          # `fork()` ohne `exec()` in einem Prozess mit CoreFoundation nicht
          # vorgesehen ist). Der große Zug läuft stattdessen mit `-n auto`,
          # wie lokal seit Wochen mit `-n 8`: Jeder Worker baut nur einen Teil
          # der Fenster und Dialoge, und die Familie, die im seriellen Prozess
          # nach zwanzig Tests von `test_print_settings_ui.py` mit Segfault
          # riss (02.09.2026, zweimal hintereinander, nach 11:46 grüner
          # Laufzeit), findet die Menge nicht mehr, an der sie reißt.

          # **Ein Absturz wird einmal wiederholt.** Nicht jeder Fehlschlag: nur
          # dieser Aufruf als Ganzes, und nur ein zweites Mal. VTK stirbt auf
          # den Runnern gelegentlich mit SIGSEGV — am 20.08.2026 einmal in
          # `test_header.py` unter Linux (fünf andere Tests derselben Datei
          # grün, lokal dreimal grün) und einmal im Dateilauf unter Windows.
          # Der Absturz wandert, hängt an keinem Test und ist seit Wochen als
          # offener Punkt notiert.
          #
          # Was er anrichtet, ist unverhältnismäßig: Der Paketier-Job hängt an
          # dieser Suite, also verhindert ein zufälliger Absturz die
          # Auslieferung aller vier Plattformen. Ein zweiter Anlauf trennt den
          # Zufall vom Befund — was zweimal an derselben Stelle stirbt, ist
          # keiner, und der Lauf wird rot wie vorher.
          attempt() {
            run "$@" || {
              echo "::warning::Zweiter Anlauf für: $*"
              run "$@"
            }
          }
          # **`tests/test_parts.py` läuft hier nicht** — Entscheidung Robert,
          # 02.09.2026: Die CI fährt das Nötigste, die Bausteinbereichstests
          # fährt das lokale Tor. Die 27 Bereichstests bauen jeden Baustein an
          # allen 2114 Ecken seines Parameterraums und prüfen Wand und
          # Selbstdurchdringung — rund eine Minute je Baustein auf einem Kern.
          # Lokal verteilt `suite-getrennt.sh` das auf acht Worker und sieht
          # es nie; hier lief es seriell, und drei Läufe an diesem Tag standen
          # je vier Stunden bei 49 Prozent, bevor sie mit Segfault endeten.
          # Die Deckung dafür liegt damit allein beim lokalen Lauf vor dem
          # Commit (`/pruefen`), nicht mehr im Bautor.
          attempt -n auto -m "not performance" $ignores --ignore=tests/test_parts.py

          # **Die Fensterdateien laufen hier nicht mehr**, und das ist eine
          # Entscheidung mit Datum: 20.08.2026.
          #
          # Kein Runner hat eine Grafikkarte. VTK sucht trotzdem einen echten
          # GL-Kontext, bekommt einen emulierten und stirbt darin mit SIGSEGV —
          # auf Linux im geforkten Test, auf Windows ohne Fork, mit und ohne
          # LIBGL_ALWAYS_SOFTWARE, mal in `test_header`, mal in `test_chat_ui`,
          # mal in `pyvistaqt/plotting.py` selbst. Der Absturz wandert, hängt an
          # keinem Test und ist lokal nicht zu sehen: dieselben Dateien laufen
          # auf einer Maschine mit GL in Sekunden grün durch, 4021 Tests.
          #
          # Was das anrichtete, war unverhältnismäßig: Der Paketier-Job hängt an
          # dieser Suite, also verhinderte ein Fremdcode-Absturz in einer
          # Umgebung, die niemand benutzt, die Auslieferung aller vier
          # Plattformen. Wochenlang.
          #
          # Also prüft die CI, was sie prüfen kann — Kern, Geometrie, Agent,
          # Website, Paketierung —, und die Fenster prüft, wer einen Bildschirm
          # hat. **Das ist eine Lücke und keine Lösung**: Wer eine Ansicht
          # ändert, fährt `pytest tests/test_*_ui.py` lokal, bevor er pusht.
          # Sie schließt sich, sobald VTK dort läuft oder die Runner GL
          # bekommen; bis dahin steht sie in ROADMAP.md.
          echo "::warning::Fensterdateien übersprungen (VTK ohne GL): $windowed"

  package:
    name: Paket (${{ matrix.os }})
    needs: suite
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Zwei Macs, keine Doppelung: `macos-26-intel` läuft auf Intel,
        # `macos-latest` auf Apple Silicon. PyInstaller packt, was unter ihm
        # liegt — ein auf arm64 gebautes Paket startet auf einem Intel-Mac
        # nicht, und das betrifft jedes Gerät vor 2020.
        #
        # **Drei der vier Labels enden auf `-latest`, und das ist der Punkt.**
        # Ein `-latest` wandert mit; eine feste Nummer veraltet und stirbt
        # irgendwann. Hier stand `macos-13`, seit dem 04.12.2025 abgeschaltet,
        # und ein Job mit einem toten Label wird nicht abgelehnt — er wird
        # **angenommen und nie zugeteilt.** Am 20.08.2026 stand er
        # siebenundzwanzig Minuten in der Warteschlange und wäre nach dem
        # Sechs-Stunden-Timeout gestorben. Von außen sieht das aus wie ein
        # langsamer Lauf, nicht wie ein Fehler. Aufgefallen ist es erst, als
        # die Suite zum ersten Mal seit Wochen grün war und der Paketier-Job
        # überhaupt so weit kam.
        #
        # Für Intel gibt es kein `-latest`: `macos-latest` ist arm64, und
        # x64 gibt es nur unter seiner Nummer. Diese eine Zeile veraltet also
        # zwangsläufig und ist die einzige, die **nachgesehen werden muss** —
        # aktuell ist `macos-26-intel` (GA seit 26.02.2026).
        #
        # Und sie hat ein Ablaufdatum: Apple hat x86_64 aufgegeben, GitHub
        # trägt Intel bis zur Ausmusterung des 26er-Images. Fällt es weg,
        # fällt die Intel-Version — dann sagt die Website das, statt eine
        # Version anzubieten, die niemand mehr baut.
        os: [windows-latest, ubuntu-latest, macos-26-intel, macos-latest]
    env:
      # Keine Geheimnisse: Der Modus ist eine gewöhnliche Repository-Variable.
      # Schutz kommt ausschließlich von der Produktionsumgebung an den
      # signierenden Jobs; Geheimnisse erreichen nur deren feste Schritte.
      MACOS_SIGNING_MODE: ${{ vars.MACOS_SIGNING_MODE || 'unsigned' }}
      WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE || 'unsigned' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.14"
          cache: pip

      - name: Signiermodi fail-closed prüfen
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_MODE -notin @('azure', 'pfx', 'unsigned')) { throw "WINDOWS_SIGNING_MODE muss azure, pfx oder unsigned sein." }
          if ($env:MACOS_SIGNING_MODE -notin @('signed', 'notarized', 'unsigned')) { throw "MACOS_SIGNING_MODE muss signed, notarized oder unsigned sein." }

      - name: Qt-Systembibliotheken (Linux)
        # Auch hier: die Beispielprojekte und die PyInstaller-Analyse
        # importieren Module, die ihre Grafikbibliothek beim Laden ziehen.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Die xcb-util-Bibliotheken und xkbcommon-x11: Qts X11-Plugin hängt
          # hart an ihnen, PyInstaller bündelt nur, was der Runner hat — und der
          # hatte sie nicht. Auf einem Ubuntu-GNOME fehlt libxcb-cursor0
          # regelmäßig, und Qt startet dann nicht (make_sbom.LINUX_LIBRARY_FAMILIES).
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 pkg-config \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-util1 libxcb-xkb1 libxkbcommon-x11-0

      - name: Abhängigkeiten
        # Derselbe Satz wie in der Suite: was geprüft wurde, wird paketiert.
        run: |
          python -m pip install -c constraints.txt -e ".[geom,ui,agent,brep]"
          # Auch hier die Constraints, und hier besonders: `constraints.txt`
          # nagelt `pyinstaller` und `pyinstaller-hooks-contrib` fest, und
          # gerade dessen Hooks entscheiden, welche Metadaten und Datendateien
          # ins Paket wandern. Ein Bauwerkzeug von morgen kann anderes
          # einpacken als das von heute, ohne dass sich eine Zeile Code ändert
          # — das war die einzige ungepinnte Installationszeile des Workflows.
          python -m pip install -c constraints.txt pyinstaller

      - name: Beispielprojekte erzeugen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_examples.py

      - name: Rechen- und Prüfmodule kompilieren, Manifest signieren
        # Die schnelle Konturverkettung aus §31 muss auf genau der Plattform
        # entstehen, für die PyInstaller gleich darunter das Kundenpaket baut.
        # Die Suite hat einen eigenen frischen Runner; ihr Bau reist nicht bis
        # hierher. V4c (Konzept §2 I H4/H5) verlangt daneben das Prüfmodul als
        # Maschinencode, dessen Manifest die vier Grenzdateien deckt. Cython
        # und setuptools sind reine Bau-Abhängigkeiten und landen nicht im
        # Paket.
        run: |
          python -m pip install -c constraints.txt cython setuptools
          python tools/build_slice_core.py
          python tools/build_licence_module.py

      - name: Bauen
        # Analysis bestimmt die tatsächlich importierten Distributionen; die
        # gemeinsame Spec schreibt die Laufzeit-Stückliste aber erst nach dem
        # fertigen COLLECT beziehungsweise macOS-BUNDLE. Dadurch enthält sie
        # auch CPython, Bootloader und jede wirklich mitgereiste native Datei.
        run: pyinstaller packaging/solidon3d.spec --noconfirm

      - name: Laufzeit-Stückliste gegen CycloneDX 1.6 prüfen
        # Das JSON Schema ist die Referenzimplementierung von CycloneDX. Der
        # Abruf ist auf den offiziellen Release-Commit 1.6 festgeschrieben;
        # eine spätere Änderung an master kann den Bau deshalb nicht verändern.
        shell: pwsh
        run: |
          $schemaUri = "https://raw.githubusercontent.com/CycloneDX/specification/55343ba19dee1785acf1ce9191540d5fd7b590db/schema/bom-1.6.schema.json"
          $schema = (Invoke-WebRequest -UseBasicParsing $schemaUri).Content
          $sbomPath = python tools/make_sbom.py --locate-artifact dist
          if ($LASTEXITCODE -ne 0) {
            throw "Die Stückliste liegt nicht genau einmal im Kundenartefakt. Paket neu bauen und PyInstaller-Datenliste prüfen."
          }
          # Auf macOS bleibt neben der .app ein COLLECT-Zwischenordner liegen.
          # Der Locator prüft nur die .app; Windows/Linux prüfen den finalen
          # COLLECT-Ordner. Eine zufällige zweite Kopie unter dist zählt nicht.
          $document = Get-Content -Raw -LiteralPath $sbomPath
          if (-not (Test-Json -Json $document -Schema $schema)) {
            throw "Solidon3D.cdx.json entspricht nicht dem offiziellen CycloneDX-1.6-Schema. Stückliste mit tools/make_sbom.py neu erzeugen."
          }

      - name: Lizenzbeilage aus dem fertigen Kundenartefakt erzeugen
        # Notice und SBOM gehören in den unveränderlich gebundenen App-Baum;
        # das maschinenlesbare Schema-2-Manifest bleibt dagegen in der
        # CRA-/Buildakte. Dieser Schritt läuft vor jeder Paketierung und vor
        # jeder Signierübergabe.
        shell: pwsh
        run: |
          $sbomPath = python tools/make_sbom.py --locate-artifact dist
          if ($LASTEXITCODE -ne 0) { throw "Die Endartefakt-SBOM fehlt oder ist mehrdeutig." }
          $artifactRoot = if ($IsMacOS) { Resolve-Path "dist/Solidon3D.app" } else { Resolve-Path "dist/Solidon3D" }
          $noticePath = Join-Path $artifactRoot "THIRD-PARTY-NOTICES.md"
          python tools/make_licence_notices.py `
            --sbom $sbomPath `
            --output $noticePath `
            --manifest build/third-party-licenses.json
          if ($LASTEXITCODE -ne 0) { throw "Die Lizenzbeilage konnte nicht aus der Endartefakt-SBOM erzeugt werden." }
          $manifest = Get-Content -Raw build/third-party-licenses.json | ConvertFrom-Json
          if ($manifest.schema -ne 2) { throw "Das CRA-Lizenzmanifest hat nicht Schema 2." }

      - name: Prüfsummengebundene Signierübergabe erzeugen (Windows)
        # Der Paketjob sieht weder Signiergeheimnisse noch ein OIDC-Token. Er
        # übergibt nur den vollständig gebauten, geprüften Stand an den
        # geschützten Signierjob darunter.
        if: runner.os == 'Windows'
        run: python tools/make_installer.py --signing-handoff

      - name: Signiereingang packen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $handoff = Get-Content -Raw packaging/build/windows-signing.json | ConvertFrom-Json
          $stage = Join-Path $env:RUNNER_TEMP "windows-signing-input"
          $archive = Join-Path $PWD "dist/windows-signing-input.zip"
          New-Item -ItemType Directory -Force "$stage/dist" | Out-Null
          New-Item -ItemType Directory -Force "$stage/packaging/build" | Out-Null
          Copy-Item -Recurse -LiteralPath $handoff.source_dir -Destination "$stage/dist"
          Copy-Item -LiteralPath $handoff.script, $handoff.licence, $handoff.icon -Destination "$stage/packaging"
          Copy-Item -LiteralPath packaging/build/licence.manifest, packaging/build/windows-signing.json -Destination "$stage/packaging/build"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -CompressionLevel Optimal
          $sum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower()
          "$sum  windows-signing-input.zip" | Set-Content -Encoding ascii "dist/windows-signing-input.zip.sha256"

      - name: Signiereingang übergeben (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidon3d-windows-signing-input
          path: |
            dist/windows-signing-input.zip
            dist/windows-signing-input.zip.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Archiv packen (Linux)
        # Als tar.gz, nicht als roher Ordner: der Artefakt-Upload verliert die
        # Ausführungsrechte, das Archiv behält sie — und das Archiv trägt jetzt
        # ein `install.sh`, das ohne sie nicht startet.
        #
        # Der `tar`-Aufruf, der hier stand, packte genau den Bau. Wer ihn
        # auspackte, hatte ein Programm ohne Menüeintrag, ohne Symbol und ohne
        # gelesenen Lizenzvertrag; das Werkzeug legt beides daneben.
        if: runner.os == 'Linux'
        run: python tools/make_linux_packages.py --tarball

      - name: Paketierwerkzeuge holen (Linux)
        # appimagetool kommt als AppImage und wird selbst nicht installiert;
        # flatpak-builder liegt in jeder Distribution. Beide sind externe
        # Programme — Solidon liefert keines mit (§36). Werkzeug und der
        # Laufzeitkern, der später Teil der Kundendatei wird, kommen von festen
        # Veröffentlichungen und laufen erst nach erfolgreicher SHA-256-Prüfung.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          tool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          runtime="$RUNNER_TEMP/runtime-x86_64"
          curl -fsSL --retry 3 -o "$tool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tool" | sha256sum --check --strict
          curl -fsSL --retry 3 -o "$runtime" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $runtime" | sha256sum --check --strict
          sudo install -m 755 "$tool" /usr/local/bin/appimagetool
          sudo install -m 644 "$runtime" /usr/local/lib/appimage-runtime-x86_64
          echo "APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime-x86_64" >> "$GITHUB_ENV"
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: AppImage und Flatpak bauen (Linux)
        # Beide sind ab der nächsten Version öffentliche Pakete. Ein Fehlschlag
        # macht deshalb den Linux-Zweig rot; ``fail-fast: false`` lässt Windows
        # und beide Mac-Bauten trotzdem zu Ende laufen.
        if: runner.os == 'Linux'
        env:
          # appimagetool ist selbst ein AppImage und braucht sonst FUSE 2, das
          # Ubuntu seit 24.04 nicht mehr mitbringt. Mit dieser Variable packt
          # es sich vorher aus, statt sich einzuhängen — der Fehler wäre sonst
          # „dlopen(): error loading libfuse.so.2", und der sagt niemandem,
          # dass eine Variable fehlt.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: python tools/make_linux_packages.py --appimage --flatpak

      - name: Öffentliche Linux-Pakete prüfen
        if: runner.os == 'Linux'
        run: |
          ls dist/*.AppImage >/dev/null
          ls dist/*.flatpak >/dev/null

      - name: Bundle prüfen (macOS)
        # Der Bau bricht nicht ab, wenn BUNDLE ausbleibt — er liefert dann
        # stillschweigend einen Ordner. Auf einem Mac ist das kein Programm,
        # sondern eine Enttäuschung beim Doppelklick, und sie fiele erst dem
        # ersten Nutzer auf.
        if: runner.os == 'macOS'
        run: |
          name=$(python -c "from app.branding import APP_NAME; print(APP_NAME)")
          test -d "dist/${name}.app" || { echo "::error::dist/${name}.app fehlt — BUNDLE hat nicht gegriffen."; exit 1; }
          test -x "dist/${name}.app/Contents/MacOS/${name}" || { echo "::error::Im Bundle fehlt die ausführbare Datei."; exit 1; }
          plutil -lint "dist/${name}.app/Contents/Info.plist"

      - name: Unsignierten macOS-App-Eingang packen
        # `ditto`, nicht `zip`: ein Bundle trägt Symlinks und erweiterte
        # Attribute, und ein gewöhnliches zip macht daraus Kopien und verliert
        # später die Signatur. Prüfsumme und feste Namen binden genau den
        # signierbaren App-Baum, bevor ein Apple-Schlüssel importiert wird.
        if: runner.os == 'macOS'
        run: |
          name=$(python -c "from app.branding import APP_NAME; print(APP_NAME)")
          version=$(python -c "from app.branding import APP_VERSION; print(APP_VERSION)")
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/${name}.app" "dist/${name}-${version}-macos-$(uname -m).zip"
          cd dist
          shasum -a 256 "${name}-${version}-macos-$(uname -m).zip" | tee "${name}-${version}-macos-$(uname -m).zip.sha256"

      - name: Prüfsummen (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          # Auch für die beiden Pakete, und mit ``|| true`` je Muster: Wer nur
          # das tar.gz hat, weil ein Paketierschritt scheiterte, soll dessen
          # Prüfsumme trotzdem bekommen.
          for pattern in "*-linux-x86_64.tar.gz" "*.AppImage" "*.flatpak"; do
            for archive in $pattern; do
              test -f "$archive" || continue
              sha256sum "$archive" | tee "$archive.sha256"
            done
          done

      - name: Archiv hochladen (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidon3d-linux-release-input
          path: |
            dist/*-linux-x86_64.tar.gz
            dist/*-linux-x86_64.tar.gz.sha256
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.flatpak
            dist/*.flatpak.sha256
          # Der Bau darüber verlangt AppImage und Flatpak ausdrücklich. Dieses
          # private Zwischenartefakt trägt zusätzlich den App-Baum; öffentlich
          # werden erst die zwei Pakete nach dem Releasecheck darunter.
          if-no-files-found: error
          retention-days: 1

      - name: macOS-App-Eingang übergeben
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidon3d-macos-app-input-${{ runner.arch }}
          path: |
            dist/*-macos-*.zip
            dist/*-macos-*.zip.sha256
          if-no-files-found: error
          retention-days: 1

  linux-release-check:
    name: Linux-Releaseakte prüfen
    needs: package
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.14"
      - name: Abhängigkeiten der Zielumgebung
        # Die Releaseakte liest die installierten Wheels
        # (`packages_distributions`) und importiert `tools.make_sbom` → `app`:
        # ohne die Extras des Paketjobs wäre jede native Datei „ohne Besitzer"
        # und der erste Import ein ImportError. Gemessen am 02.09.2026 — der
        # Job hatte bis dahin nie ein echtes Artefakt gesehen.
        run: python -m pip install -c constraints.txt -e ".[geom,ui,agent,brep]"
      - name: Äußere Linux-Pakete und App-Baum laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-linux-release-input
          path: release-download
      - name: Releasebelege fail-closed prüfen
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find release-download -maxdepth 1 -type f -name 'Solidon3D-*-linux-x86_64.tar.gz')
          appimage=$(find release-download -maxdepth 1 -type f -name '*.AppImage')
          flatpak=$(find release-download -maxdepth 1 -type f -name '*.flatpak')
          [ -n "$archive" ] && [ -n "$appimage" ] && [ -n "$flatpak" ]
          for package in "$archive" "$appimage" "$flatpak"; do
            [ -f "$package.sha256" ]
            expected=$(awk '{print $1}' "$package.sha256")
            [ "$(sha256sum "$package" | awk '{print $1}')" = "$expected" ] || { echo "Geändertes Linux-Paket: $package"; exit 1; }
          done
          cp "$appimage" "$flatpak" build/
          while IFS= read -r entry; do
            case "/$entry/" in *'/../'*|*'/./'*|*'//'*) echo "Unzulässiger Archivpfad: $entry"; exit 1;; esac
            case "$entry" in /*|*\\*) echo "Unzulässiger Archivpfad: $entry"; exit 1;; esac
          done < <(tar -tzf "$archive")
          mkdir release-app
          tar -xzf "$archive" -C release-app
          artifact=$(find release-app -mindepth 2 -maxdepth 2 -type d -name Solidon3D)
          [ -n "$artifact" ] || { echo "Solidon3D-App-Baum fehlt im Linux-Archiv."; exit 1; }
          sbom=$(find "$artifact" -type f -name Solidon3D.cdx.json)
          [ "$(printf '%s\n' "$sbom" | sed '/^$/d' | wc -l | tr -d ' ')" = 1 ] || { echo "Die Linux-Endartefakt-SBOM fehlt oder ist mehrdeutig."; exit 1; }
          # Die Evidenz entsteht hier, wo äußere Pakete und SBOM zusammenliegen,
          # und wird gleich danach geprüft: Hashes der Pakete, Quellenangebote je
          # LGPL-Familie, Frist. Bis zum 02.09.2026 schrieb sie niemand.
          python tools/make_licence_notices.py --write-evidence --sbom "$sbom" --release-evidence build/release-evidence.json \
            --package "appimage=build/$(basename "$appimage")" --package "flatpak=build/$(basename "$flatpak")"
          python tools/make_licence_notices.py --release-check --artifact-root "$artifact" --sbom "$sbom" --release-evidence build/release-evidence.json
      - name: Geprüfte Linux-Pakete veröffentlichen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidon3d-linux
          path: |
            release-download/*.AppImage
            release-download/*.AppImage.sha256
            release-download/*.flatpak
            release-download/*.flatpak.sha256
          if-no-files-found: error
          retention-days: 7

  windows-app-sign-azure:
    name: Windows-Anwendung mit Azure signieren
    needs: package
    if: >-
      (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') &&
      vars.WINDOWS_SIGNING_MODE == 'azure'
    runs-on: windows-latest
    environment: production-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Gebundenen App-Baum laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: solidon3d-windows-signing-input
          path: signing-download

      - name: Vollständigen App-Baum prüfen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadRoot = (Resolve-Path "signing-download").Path
          $downloadFiles = @(Get-ChildItem -LiteralPath $downloadRoot -Recurse -File -Force)
          $downloadNames = @($downloadFiles | ForEach-Object { $_.FullName.Substring($downloadRoot.Length + 1).Replace('\','/') } | Sort-Object)
          if ($downloadNames.Count -ne 2 -or (Compare-Object $downloadNames @('windows-signing-input.zip', 'windows-signing-input.zip.sha256'))) { throw "Unbekannte Datei in der Windows-App-Übergabe." }
          $archive = (Resolve-Path "signing-download/windows-signing-input.zip").Path
          $line = (Get-Content -Raw "signing-download/windows-signing-input.zip.sha256").Trim()
          if ($line -notmatch '^([0-9a-f]{64})  windows-signing-input\.zip$') { throw "Ungültige Archiv-Prüfsumme." }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne $Matches[1]) { throw "Geändertes Übergabearchiv." }
          $root = [IO.Path]::GetFullPath((Join-Path $PWD "signing-input"))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          $entries = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          try {
            foreach ($entry in $zip.Entries) {
              $name = $entry.FullName.TrimEnd('/')
              $parts = $name.Split('/')
              if (-not $name -or $entry.FullName.Contains('\') -or [IO.Path]::IsPathRooted($name) -or $parts -contains '' -or $parts -contains '.' -or $parts -contains '..' -or -not $entries.Add($name)) { throw "Unzulässiger oder doppelter Archivpfad: $($entry.FullName)" }
              $destination = [IO.Path]::GetFullPath((Join-Path $root $name))
              if (-not $destination.StartsWith($root.TrimEnd('\') + '\', [StringComparison]::OrdinalIgnoreCase)) { throw "Archivpfad verlässt das Ziel: $name" }
            }
          }
          finally { $zip.Dispose() }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $reparsePoints = @(Get-ChildItem -LiteralPath $root -Recurse -Force | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint })
          if ($reparsePoints) { throw "Die Windows-Übergabe enthält Verknüpfungen oder Reparse-Points." }
          $handoffPath = Join-Path $root "packaging/build/windows-signing.json"
          $handoff = Get-Content -Raw -LiteralPath $handoffPath | ConvertFrom-Json
          $fixed = @{
            application = "dist/Solidon3D/Solidon3D.exe"; source_dir = "dist/Solidon3D"; output_dir = "dist"
            script = "packaging/solidon3d.iss"; licence = "packaging/eula.txt"; icon = "packaging/solidon3d.ico"
            licence_manifest = "packaging/build/licence.manifest"
          }
          if ($handoff.schema_version -ne 1 -or $handoff.app_name -ne 'Solidon3D' -or $handoff.app_vendor -ne 'RS Digital' -or $handoff.app_id -ne 'de.rsdigital.solidon3d' -or $handoff.app_url -ne 'https://solidon3d.de/' -or $handoff.project_suffix -ne '.p3d' -or $handoff.part_file_suffix -ne '.solidon-part' -or $handoff.part_file_mime_type -ne 'application/vnd.solidon.part+json' -or $handoff.app_version -notmatch '^\d+\.\d+\.\d+$' -or $handoff.setup_filename -ne "Solidon3D-Setup-$($handoff.app_version).exe") { throw "Unbekannte Produktangaben in der Übergabe." }
          function Resolve-HandoffPath([string]$name) {
            if ([IO.Path]::IsPathRooted($name) -or $name.Contains('\') -or $name.Split('/') -contains '..') { throw "Unzulässiger Übergabepfad: $name" }
            $path = [IO.Path]::GetFullPath((Join-Path $root $name))
            if (-not $path.StartsWith($root.TrimEnd('\') + '\', [StringComparison]::OrdinalIgnoreCase)) { throw "Pfadausbruch: $name" }
            return $path
          }
          foreach ($name in $fixed.Keys) { if ($handoff.$name -ne $fixed[$name]) { throw "Unbekannter Produktpfad: $name" }; Resolve-HandoffPath $handoff.$name | Out-Null }
          $declared = @($handoff.input_sha256.PSObject.Properties.Name | Sort-Object)
          $actual = @(Get-ChildItem -LiteralPath $root -Recurse -File -Force | ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\','/') } | Where-Object { $_ -ne 'packaging/build/windows-signing.json' } | Sort-Object)
          if (Compare-Object $declared $actual) { throw "Dateiliste und Übergabemanifest weichen voneinander ab." }
          foreach ($entry in $handoff.input_sha256.PSObject.Properties) {
            if ($entry.Value -notmatch '^[0-9a-f]{64}$') { throw "Ungültige Datei-Prüfsumme: $($entry.Name)" }
            $path = Resolve-HandoffPath $entry.Name
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLower() -ne $entry.Value) { throw "Geänderter Signiereingang: $($entry.Name)" }
          }
          "SIGNING_ROOT=$root" >> $env:GITHUB_ENV
          "SIGNING_HANDOFF=$handoffPath" >> $env:GITHUB_ENV
          "ARTIFACT_APP=$(Resolve-HandoffPath 'dist/Solidon3D/Solidon3D.exe')" >> $env:GITHUB_ENV

      - name: Bei Azure für Artifact Signing anmelden
        uses: azure/login@4c03e4685fe81df2c50d5714c7d93cf39d8deb7f # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Anwendung mit Azure Artifact Signing signieren
        uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30 # v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ env.ARTIFACT_APP }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Solidon3D
          description-url: https://solidon3d.de/

      - name: Azure-Signatur prüfen und Übergabe neu binden
        shell: pwsh
        run: |
          signtool verify /pa /v $env:ARTIFACT_APP
          if ($LASTEXITCODE -ne 0) { throw "Die Signatur der Anwendung ist ungültig." }
          $handoff = Get-Content -Raw -LiteralPath $env:SIGNING_HANDOFF | ConvertFrom-Json
          $handoff.input_sha256.'dist/Solidon3D/Solidon3D.exe' = (Get-FileHash -LiteralPath $env:ARTIFACT_APP -Algorithm SHA256).Hash.ToLower()
          $handoff | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 $env:SIGNING_HANDOFF
          Compress-Archive -Path "$env:SIGNING_ROOT/*" -DestinationPath windows-signing-input.zip
          $sum = (Get-FileHash windows-signing-input.zip -Algorithm SHA256).Hash.ToLower()
          "$sum  windows-signing-input.zip" | Set-Content -Encoding ascii windows-signing-input.zip.sha256

      - name: Signierten App-Baum übergeben
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solidon3d-windows-app-azure
          path: |
            windows-signing-input.zip
            windows-signing-input.zip.sha256
          if-no-files-found: error
          retention-days: 1

  windows-app-sign-pfx:
    name: Windows-Anwendung mit PFX signieren
    needs: package
    if: >-
      (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') &&
      vars.WINDOWS_SIGNING_MODE == 'pfx'
    runs-on: windows-latest
    environment: production-signing
    permissions:
      contents: read
    steps:
      - name: Gebundenen App-Baum laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:

# Startbestand an Materialprofilen (Bauplan §38, §28.3).
#
# Das sind Ausgangswerte, keine Messungen: `calibrated = false` überall. Der
# Kalibrierlauf (§28.3) schreibt gemessene Werte in das Materialprofil zurück,
# und weil Toleranzen im Stapel Verweise sind („auto:petg", §12), rechnet
# danach auch jedes bestehende Projekt mit den gemessenen Zahlen.
#
# clearance         Spiel einer Schiebepassung in mm
# press             Übermaß für einen Presssitz in mm (negativ = größer)
# hole_compensation kommt auf den Nenndurchmesser, FDM druckt Löcher zu eng
# elephant_foot     Verbreiterung der ersten Schicht, die ausgeglichen wird
# shrinkage         relativ, 0.004 = 0,4 %
#
# youngs_modulus    Elastizitätsmodul in MPa
# yield_strength    Streckgrenze in MPa
#
# Die beiden letzten sind für alles, was federn soll: Schnapphaken,
# Klemmzungen, Filmscharniere. Sie stehen hier als **Richtwerte gedruckter
# Teile**, längs zur Schichtebene, wie sie Datenblätter für FDM-Filamente
# nennen — nicht als Messung an unserem Drucker; `calibrated = false` gilt für
# sie wie für die Toleranzen darüber.
#
# **Quer zur Schichtrichtung trägt ein gedrucktes Teil weniger**, nach
# üblicher Annahme rund 60 Prozent. Dieser Abschlag steht nicht hier, sondern
# in der Rechnung (`knowledge/strength.py`): Er hängt an der Lage des Teils
# auf der Platte und nicht am Filament.
#
# Ein Profil ohne die beiden Werte bekommt 0, und 0 heißt **unbekannt**. Die
# Rechnung sagt dann, dass sie nichts sagen kann, statt mit einer geratenen
# Zahl zu antworten.

[pla]
title = "PLA"
clearance = 0.20
press = -0.05
hole_compensation = 0.15
elephant_foot = 0.15
shrinkage = 0.002
calibrated = false
youngs_modulus = 3500.0
yield_strength = 50.0


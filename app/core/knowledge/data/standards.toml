# Normteiltabelle (Bauplan §24.2).
#
# "Loch für M4-Einpressmutter" muss ein Nachschlagewert sein, kein Ratespiel.
# Deshalb liegen die Maße als Daten hier und nicht im Code: ein korrigierter
# Wert braucht kein Release, und die Herkunft steht daneben.
#
# Rechtliches (§24.2): Maßangaben als Zahlen sind frei verwendbar, Normtexte
# und Normtabellen nicht. Die Werte hier sind aus frei zugänglichen
# Herstellerangaben und den üblichen Katalogmaßen zusammengetragen, es ist
# kein Normblatt abgeschrieben. Wo Hersteller sich unterscheiden, steht der
# gebräuchlichste Wert und in `note` woher er kommt.
#
# Alle Maße in Millimetern.

# Version 3 seit dem 25.08.2026: Die Lochwandmaße sind als eigene Tabellenart
# `boards` dazugekommen. Version 2 seit dem 20.08.2026: Die Aluprofil-Nutmaße
# tragen zwei Felder mehr (`lip`, `depth`). In beiden Schritten hat sich kein
# bestehender Wert geändert, alte Projekte rechnen also unverändert — die Zahl
# sagt, dass die Tabelle mehr weiß, nicht dass sie etwas anderes weiß.
version = "3"


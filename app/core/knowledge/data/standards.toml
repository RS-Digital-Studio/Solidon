# --- Aluprofil-Nutmaße ----------------------------------------------------------
# slot: Nutbreite außen · core: Kerndurchmesser der Nut · screw: passende Schraube
# lip: Stegdicke — wie dick das Material an der Nutöffnung ist
# depth: Kammertiefe — von der Innenseite des Stegs bis zum Nutgrund
#
# `lip` und `depth` kamen am 20.08.2026 dazu, für die Nutfeder. Sie sind die
# zwei Maße, die eine Feder braucht und die außen niemand sieht: der Steg
# bestimmt die Halslänge, die Kammer die Kopfhöhe. Nach dem Verfahren aus dem
# Kopf dieser Datei stehen hier die gebräuchlichsten Werte, und `note` nennt
# die Streuung — sie ist bei diesen beiden größer als bei Nutbreite und
# Kerndurchmesser, weil kein Katalog sie führt und jeder sie anders zeichnet.
# Wer eine Feder baut, die klemmt oder wackelt, prüft zuerst diese zwei.


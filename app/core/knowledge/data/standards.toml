# --- Lochwände ------------------------------------------------------------------
# slot_width/slot_height: das Loch, das keine Bohrung ist — bei SKÅDIS ein
# stehender Schlitz mit halbrunden Enden. pitch: Rastermaß in beide Richtungen.
# stagger: um wie viel die zweite Lochschar gegen die erste versetzt ist; null
# hieße ein einfaches Quadratraster. thickness: Plattendicke.
#
# `stagger` liest derzeit kein Baustein — der Einhänger setzt seine Haken in
# eine Reihe oder eine Spalte, und dort ist der Abstand `pitch`, gleich ob die
# Nachbarreihe versetzt liegt. Der Wert steht trotzdem hier, weil er zur Platte
# gehört und nicht zum Baustein; wer im Zickzack setzen will, findet ihn vor.
# Ein ungelesener Wert kann falsch sein, ohne dass es auffällt; dieser ist es
# nicht — die Zeichnung zeigt beide 20,00 ausdrücklich.
#
# **Herkunft: die Lochung ist geprüft, die Plattendicke nicht.**
#
# Am 25.08.2026 gegen eine bemaßte Zeichnung geprüft, die Robert beigebracht
# hat — Schlitz 5,00 × 15,00 mit R2,50 an den Enden, Raster 40,00, zweite
# Lochschar um 20,00 in beiden Richtungen versetzt, Randabstand 20,00. Alle
# vier Werte dieser Tabelle stimmen damit auf den Hundertstel, und die R2,50
# belegen zugleich die Form: ein Langloch, dessen Radius die halbe Breite ist.
# Das ist der Punkt, an dem der Einhänger zuerst gescheitert war — er baute
# Rechtecke.
#
# **`thickness` steht nicht darauf**, denn die Zeichnung ist eine Draufsicht.
# Der Wert stammt weiter aus einer Sammlung, die ihn selbst als „approximate;
# the exact decimal is unverified" führt — und er ist der einzige hier, aus dem
# etwas folgt: Die Nasentiefe des Einhängers ist zwei Drittel davon (`lip`).
# Wer eine Platte zur Hand hat, misst sie mit dem Messschieber und trägt sie
# hier ein; alles andere ist erledigt.
#
# **An einer echten Platte nachgemessen** (27.08.2026, Alexander Schneider,
# Messschieber): Schlitzbreite 4,9 bis 5,1, Schlitzhöhe 14,9 bis 15,1, und über
# zwei benachbarte Schlitze außen gemessen 45,0 — das ist Raster plus eine
# Schlitzbreite und bestätigt die 40,00 auf den Zehntel. Die Nennmaße der
# Zeichnung stimmen also; **neu ist die Toleranz von ±0,1 mm**, die keine
# Zeichnung hergibt. Sie ist der Grund, aus dem der Zapfen sein Spiel aus dem
# Materialprofil bezieht und nicht knapp auf das Nennmaß gebaut wird: Im
# engsten gemessenen Schlitz bleiben unter PETG 0,15 mm Luft, unter PLA 0,10.
# `tests/test_parts.py` hält das fest.
#
# **Die Plattendicke ist nachgemessen.** Am 28.08.2026 wurde eine SKÅDIS-Platte
# mit dem Messschieber mit 5,00 mm gemessen. Sie bestimmt den Durchgang des
# Einhängers und die Nasentiefe; der Wert bleibt deshalb in dieser Tabelle und
# nicht als Konstante im Baustein.
#
# **Beim Hersteller gesucht und nicht gefunden** (25.08.2026): IKEA
# veröffentlicht die Lochung an keiner der vier offiziellen Stellen — Produkt-
# seite US (003.208.03) und DE (00320803) nennen Breite und Höhe, die deutsche
# nicht einmal eine Materialstärke; die Montageanleitung zeigt das Bohrbild für
# die Wand; der Buying Guide (offizielles PDF, Januar 2024, sechs Seiten) führt
# Produktgrößen und Artikelnummern. Deshalb die Zeichnung.

[[boards]]
size = "skadis"
slot_width = 5.0
slot_height = 15.0
pitch = 40.0
stagger = 20.0
thickness = 5.0
note = "IKEA SKÅDIS; Schlitz mit halbrunden Enden, zweite Lochschar um 20 mm versetzt. Nennmaße an einer echten Platte bestätigt, Toleranz ±0,1 mm; Plattendicke 5,00 mm am 28.08.2026 gemessen"


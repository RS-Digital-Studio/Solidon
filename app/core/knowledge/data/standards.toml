# --- Sechskantmuttern -----------------------------------------------------------
# width: Schlüsselweite · height: Höhe (Regelmutter, m max nach ISO 4032)
#
# **Drei Höhen waren die der zurückgezogenen DIN 934**, und zwar genau die drei,
# in denen sich beide Normen unterscheiden: M5 stand auf 4,00 statt 4,70, M6 auf
# 5,00 statt 5,20, M8 auf 6,50 statt 6,80. Für M2 bis M4 sind die Werte in
# beiden Normen gleich, deshalb fiel es nirgends auf. Eine M5-Mutternfalle war
# damit 0,6 mm zu flach — bei der verbreitetsten Größe, und der Baustein
# verspricht im caveat das Gegenteil.
#
# M1.6 und M10 bis M64 seit Version 13, s max und m max aus dem Maßblatt DIN 934 /
# ISO 4032 von Aspen Fasteners; die Schlüsselweiten bis M42 zusätzlich gegen
# Wikipedia „Schlüsselweite" (ISO 4032, ISO 272), M27 bis M64 samt M33, M39, M45 und
# M52 gegen wermac.org „Dimensions Across Flats and Heights of Hex Nuts according to
# ISO 4032". Ab M10 weicht die
# Schlüsselweite von der alten DIN 934 ab (M10 16 statt 17, M12 18 statt 19, M14
# 21 statt 22, M22 34 statt 32); hier steht die ISO-Reihe wie bei den Höhen.


# --- Heat-Set-Einpressbuchsen ---------------------------------------------------
# Maße nach den gängigen Katalogangaben (Ruthex, CNC Kitchen). Das Loch wird
# etwas enger als der Außendurchmesser gebohrt, damit sich Material verdrängt.
#
# **`outer` steht bei allen sechs auf demselben Wert wie `hole`, und das ist
# nicht der Rändeldurchmesser.** Eingetragen ist zweimal die Bohrung; der echte
# Außendurchmesser einer Buchse liegt darüber, sonst verdrängte sie nichts. Am
# 25.08.2026 beim Hersteller gesucht und nicht gefunden: Ruthex veröffentlicht
# die Maße weder auf den Produktseiten noch auf seiner Dokumenten-Seite, nur als
# STEP-Dateien. Was aus den Bezeichnungen ablesbar war, steht drin — die Längen

# Normteiltabelle (Bauplan §24.2).
#
# "Loch für M4-Einpressmutter" muss ein Nachschlagewert sein, kein Ratespiel.
# Deshalb liegen die Maße als Daten hier und nicht im Code: ein korrigierter
# Wert braucht keine Codeänderung, und die Herkunft steht daneben.
#
# Rechtliches (§24.2): Maßangaben als Zahlen sind frei verwendbar, Normtexte
# und Normtabellen nicht. Die Werte hier sind aus frei zugänglichen
# Herstellerangaben und den üblichen Katalogmaßen zusammengetragen, es ist
# kein Normblatt abgeschrieben. Wo Hersteller sich unterscheiden, steht der
# gebräuchlichste Wert und in `note` woher er kommt.
#
# Alle Maße in Millimetern.

# Version 10 seit dem 02.10.2026: Die Rohrreihe ist als eigene Tabellenart
# `pipes` dazugekommen, für die Rohrschelle (RM-398). Kein bestehender Wert hat
# sich geändert.
# Version 9 seit dem 22.09.2026: Die Schrauben tragen neben dem mittleren
# Durchgangsloch auch die feine und die grobe Reihe nach ISO 273. Kein
# bestehender Wert hat sich geändert. Gebraucht werden die Reihen für die
# Einschätzung einer gemessenen Bohrung: 5,7 mm ist das grobe Durchgangsloch
# einer M5 und keine Bohrung zwischen zwei Größen.

# Version 8: Ruthex RX-M2,5x5,7 verwendet das empfohlene Einbauloch d3=4,0 mm
# statt 3,6 mm. Außenmaß d1=4,6 mm und Länge L=5,7 mm sind bestätigt.
# Quelle: Herstellerdatenblatt, Maßtabelle auf Seite 1:
# https://www.igo3d.com/mediafiles/Sonstiges/Ruthex/ruthex_Datenblatt_RX-Serie.pdf

# Version 7 seit dem 28.08.2026: Die ISO-7089-Scheiben decken jetzt dieselben
# Größen M2 bis M8 ab wie die Schraubentabelle; das Schraubenloch kann ihre
# Tasche unmittelbar schneiden.
# Version 6 seit dem 28.08.2026: Heat-Set-Buchsen tragen den gemessenen größten
# Außendurchmesser aus den STEP-Dateien des Herstellers statt ein zweites Mal
# die Bohrung. Die kurzen Varianten M3S, M4S und M5S sind eigene Einträge.
# Dazu deckt die Lagertabelle die Größen 624, 626, 6000 und 6001 ab, die der
# neue Lagersitz unmittelbar verwendet.
# Version 5 seit dem 28.08.2026: Die Dicke der SKÅDIS-Lochwand ist mit 5,00 mm
# an einer Platte nachgemessen und nicht länger als unbelegt gekennzeichnet.
# Der Zahlenwert war schon derselbe; neu ist seine belastbare Herkunft.
# Version 4 seit dem 25.08.2026: Drei Mutternhöhen auf ISO 4032 berichtigt und
# eine Buchsenlänge (M2.5). Das sind die ersten Änderungen an bestehenden
# Werten — bis dahin kam nur hinzu.
# Version 3 seit dem 25.08.2026: Die Lochwandmaße sind als eigene Tabellenart
# `boards` dazugekommen. Version 2 seit dem 20.08.2026: Die Aluprofil-Nutmaße
# tragen zwei Felder mehr (`lip`, `depth`). In beiden Schritten hat sich kein
# bestehender Wert geändert, alte Projekte rechnen also unverändert — die Zahl
# sagt, dass die Tabelle mehr weiß, nicht dass sie etwas anderes weiß.
version = "10"

# --- Metrische Schrauben --------------------------------------------------------

# --- Lochwände ------------------------------------------------------------------
# slot_width/slot_height: das Loch, das keine Bohrung ist — bei SKÅDIS ein
# stehender Schlitz mit halbrunden Enden. pitch: Rastermaß in beide Richtungen.
# stagger: um wie viel die zweite Lochschar gegen die erste versetzt ist; null
# hieße ein einfaches Quadratraster. thickness: Plattendicke.
#
# `stagger` liest derzeit kein Baustein — der Einhänger setzt seine Haken in
# eine Reihe oder eine Spalte, und dort ist der Abstand `pitch`, gleich ob die
# Nachbarreihe versetzt liegt. Der Wert steht trotzdem hier, weil er zur Platte
# gehört und nicht zum Baustein; wer im Zickzack setzen will, findet ihn vor.
# Ein ungelesener Wert kann allerdings falsch sein, ohne dass es auffällt —
# beim Prüfdruck gehört er mitgemessen.
#
# **Herkunft, und sie ist schwächer als bei allem anderen hier.** IKEA
# veröffentlicht die Lochung nicht — das ist am 25.08.2026 gesucht und nicht
# gefunden worden, an vier offiziellen Stellen:
#
#   * Produktseite US (003.208.03) und DE (00320803): Breite und Höhe, sonst
#     nichts. Die deutsche nennt nicht einmal eine Materialstärke, nur
#     „Hartfaserplatte, Acrylfarbe".
#   * Montageanleitung: Wandschiene, Bohrbild für die *Wand*, nichts zur Platte.
#   * Buying Guide (offizielles PDF, Januar 2024, sechs Seiten): Produktgrößen
#     und Artikelnummern, keine einzige Maßangabe zur Lochung.
#
# Die Zahlen stammen deshalb aus der Gemeinschaft, und die Quelle sagt es
# selbst: pegboardly.com kennzeichnet Außenmaße als „manufacturer-stated" und
# Lochung, Raster und Plattendicke ausdrücklich als „community-sourced" — die
# Dicke zusätzlich als „approximate; the exact decimal is unverified".
# dimensions.com führt für diese Platte gar keine Lochmaße; seine Zeichnungen
# stehen dort auf „under development". Ein früherer Stand dieses Kommentars
# sprach von „zwei unabhängigen Sammlungen übereinstimmend" — das war zu
# großzügig. Es ist **eine** Sammlung für die Lochung.
#
# Was daraus folgt: `thickness` ist der schwächste Wert der Tabelle und
# zugleich der, an dem die Nasentiefe des Einhängers hängt (`lip`, zwei
# Drittel davon). Wer eine Platte zur Hand hat, misst nach, bevor er eine
# Charge druckt — und trägt das Ergebnis hier ein.
#
# Zum Muster: 40 mm Raster, und dazu eine zweite Lochschar, die um 20 mm in
# **beiden** Richtungen versetzt liegt. Zwei Schlitze auf gleicher Höhe stehen
# damit 40 mm auseinander, zwei in derselben Spalte ebenfalls — `pitch` gilt
# für beides, und genau das braucht der Einhänger.

[[boards]]
size = "skadis"
slot_width = 5.0
slot_height = 15.0
pitch = 40.0
stagger = 20.0
thickness = 5.0
note = "IKEA SKÅDIS; Schlitz mit halbrunden Enden, zweite Lochschar um 20 mm versetzt"


# Normteiltabelle (Bauplan §24.2).
#
# "Loch für M4-Einpressmutter" muss ein Nachschlagewert sein, kein Ratespiel.
# Deshalb liegen die Maße als Daten hier und nicht im Code: ein korrigierter
# Wert braucht keine Codeänderung, und die Herkunft steht daneben.
#
# Rechtliches (§24.2): Maßangaben als Zahlen sind frei verwendbar, Normtexte
# und Normtabellen nicht. Die Werte hier sind aus frei zugänglichen
# Herstellerangaben und den üblichen Katalogmaßen zusammengetragen, es ist
# kein Normblatt abgeschrieben. Wo Hersteller sich unterscheiden, steht der
# gebräuchlichste Wert und in `note` woher er kommt.
#
# Alle Maße in Millimetern.

# Version 14 seit dem 09.10.2026: Zoll- und Rohrgewinde als eigene Tabellenart
# `threads` (G, R, UNC, UNF, NPT, RM-544). Kein bestehender Wert hat sich geändert.
# Version 13 seit dem 06.10.2026: Schrauben, Muttern und Scheiben reichen über
# die ISO-Größen von M1.6 bis M64 (ohne M60); die Regelsteigungen aus `pitches`
# (Version 12) stehen jetzt bei ihren Schrauben, die Tabellenart entfällt. Dazu
# die Einpressbuchsen Ruthex RX-M8x12,7 und RX-M3x5x4 und CNC Kitchen M10 ×
# 12,7. Kein bestehender Wert hat sich geändert.
# Version 12 seit dem 06.10.2026: Die Regelsteigungen über M8 sind als eigene
# Tabellenart `pitches` dazugekommen, für Gewinde mit eigenem Maß. Kein
# bestehender Wert hat sich geändert.
# Version 11: Benannte Motedis-Nuten aus Zeichnung und STEP; alte Profilwerte
# bleiben für gespeicherte Konstruktionen erhalten.
# Version 10 seit dem 02.10.2026: Die Rohrreihe ist als eigene Tabellenart
# `pipes` dazugekommen, für die Rohrschelle (RM-398). Kein bestehender Wert hat
# sich geändert.
# Version 9 seit dem 22.09.2026: Die Schrauben tragen neben dem mittleren
# Durchgangsloch auch die feine und die grobe Reihe nach ISO 273. Kein
# bestehender Wert hat sich geändert. Gebraucht werden die Reihen für die
# Einschätzung einer gemessenen Bohrung: 5,7 mm ist das grobe Durchgangsloch
# einer M5 und keine Bohrung zwischen zwei Größen.

# Version 8: Ruthex RX-M2,5x5,7 verwendet das empfohlene Einbauloch d3=4,0 mm
# statt 3,6 mm. Außenmaß d1=4,6 mm und Länge L=5,7 mm sind bestätigt.
# Quelle: Herstellerdatenblatt, Maßtabelle auf Seite 1:
# https://www.igo3d.com/mediafiles/Sonstiges/Ruthex/ruthex_Datenblatt_RX-Serie.pdf

# Version 7 seit dem 28.08.2026: Die ISO-7089-Scheiben decken jetzt dieselben
# Größen M2 bis M8 ab wie die Schraubentabelle; das Schraubenloch kann ihre
# Tasche unmittelbar schneiden.
# Version 6 seit dem 28.08.2026: Heat-Set-Buchsen tragen den gemessenen größten
# Außendurchmesser aus den STEP-Dateien des Herstellers statt ein zweites Mal
# die Bohrung. Die kurzen Varianten M3S, M4S und M5S sind eigene Einträge.
# Dazu deckt die Lagertabelle die Größen 624, 626, 6000 und 6001 ab, die der
# neue Lagersitz unmittelbar verwendet.
# Version 5 seit dem 28.08.2026: Die Dicke der SKÅDIS-Lochwand ist mit 5,00 mm
# an einer Platte nachgemessen und nicht länger als unbelegt gekennzeichnet.
# Der Zahlenwert war schon derselbe; neu ist seine belastbare Herkunft.
# Version 4 seit dem 25.08.2026: Drei Mutternhöhen auf ISO 4032 berichtigt und
# eine Buchsenlänge (M2.5). Das sind die ersten Änderungen an bestehenden
# Werten — bis dahin kam nur hinzu.
# Version 3 seit dem 25.08.2026: Die Lochwandmaße sind als eigene Tabellenart
# `boards` dazugekommen. Version 2 seit dem 20.08.2026: Die Aluprofil-Nutmaße
# tragen zwei Felder mehr (`lip`, `depth`). In beiden Schritten hat sich kein
# bestehender Wert geändert, alte Projekte rechnen also unverändert — die Zahl
# sagt, dass die Tabelle mehr weiß, nicht dass sie etwas anderes weiß.
version = "14"

# --- Metrische Schrauben --------------------------------------------------------
# nominal: Nenndurchmesser · clearance: Durchgangsloch (mittel)
# tap: Kernloch für Gewindeschneiden · head: Kopfdurchmesser Zylinderkopf (ISO 4762)
# head_height: Kopfhöhe · countersink: Kopfdurchmesser Senkkopf (ISO 10642)
#   countersink bis M12 2·d — nachgeschlagen am 02.09.2026: ISO 10642 / DIN 7991
#   nennen dk max = 2·d für M3 bis M12 (größere Zahlen in Händlertabellen sind die
#   Senkung d2 der Durchgangsbohrung, nicht der Kopf); M1.6, M2 und M2.5 stehen
#   nicht in der Norm und folgen derselben Regel. Darüber das Maßblatt DIN 7991
#   von Aspen Fasteners: M14 27, M16 30, M20 36, M24 39. M18 und M22 führt das
#   Blatt nicht, und über M24 führt keine Norm einen Senkkopf — dort ist der Wert
#   nach der Ableitungsregel für eigene Maße gerechnet (`standards._along`:
#   zwischen zwei Größen linear, jenseits im Verhältnis der M24, 1,625·d) und
#   trägt `countersink_derived = true`; das Schraubenloch sagt es dann am
#   Ergebnis (Review RM-532 Runde 2, N3). Die Regel 2·d gab dort eine Senkung,
#   in der ein Kopf nach DIN 7991 bis 4,5 mm zu tief saß.
# hex: Schlüsselweite Innensechskant · pitch: Regelsteigung
# clearance_fine / clearance_coarse: Durchgangsloch feine und grobe Reihe
#   (ISO 273; die mittlere Reihe ist clearance). Seit Version 9.
#
# M1.6 und M10 bis M64 seit Version 13: die Größen der Version-12-Steigungstabelle,
# dazu M1.6 und aus der zweiten Wahl nach ISO 262 M33, M39, M45 und M52. Herkunft
# je Spalte, gelesen am 06.10.2026:
#   pitch, tap, clearance_*: Gewindetabelle von PreciFast
#     (precifast.de/tabelle-metrisches-gewinde-din-iso/: Kernloch als Bohrermaß,
#     Steigung, Durchgangsloch fein/mittel/grob); die Durchgangslöcher zusätzlich
#     gegen Wikipedia „Durchgangsbohrung" (ISO 273) — beide gleich, bis auf einen
#     Druckfehler bei PreciFast (M56 fein 38 statt 58). Für M33 und M39 mechcodex.com
#     „Metric Clearance Hole Sizes", für M45 und M52 engineeringhardware.com
#     „Clearance Hole Sizes (ISO 273)" (dort auch M56 und M64, gleich). Kernloch der
#     zweiten Wahl d − P. M1.6 Kernloch 1,25 nach DIN 336 (Wikipedia „Metrisches
#     ISO-Gewinde“), d − P wie jede andere Zeile; PreciFast nennt 1,3.
#   head, hex: DIN 912 / ISO 4762 — bis M24 Maßblatt von Aspen Fasteners
#     (head_height dort k = d; das Blatt hat drei Druckfehler in k: M8 6, M12 1,
#     M22 2); M1.6 (dk 3,0, max 3,14) und M27 bis M64 fasten.it „DIN 912" und
#     schraube-mutter.de „DIN 912 Schraubenkopfdurchmesser" und „Schlüsselweiten von
#     Innensechskantschrauben"; M33 50, M39 58, M45 68, M52 78 ebenda. M39 s 27 (s min
#     27,065; eine Seite mit „37" hat einen Druckfehler).
# M60 steht bewusst nicht in der Tabelle: DIN 912 führt keine Zylinderschraube M60.
# Als eigenes Maß leitet Ø 60 zwischen M56 und M64 ab und trifft dort die Normwerte
# (Steigung 5,5, Mutter 90/48, Scheibe 66/110/10, Durchgang 62/66/70), was
# `tests/test_standards.py` festhält. `headless` nennt solche Nennmaße: Ein
# eigenes Maß dort sagt, dass nur der Kopf abgeleitet ist (Review RM-532 Runde 2,
# K-N3).
# `tests/test_standards.py` rechnet jede Zeile gegen eine zweite Herleitung nach.
headless = [60.0]

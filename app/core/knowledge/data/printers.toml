# Startbestand an Druckerprofilen (Bauplan §38).
#
# Eine Datentabelle, gepflegt wie die Normteiltabelle (§24.2): die Zahlen
# stammen aus frei zugänglichen Herstellerangaben, nie aus Normtexten. Beim
# ersten Start soll niemand Bauraummaße abtippen; eigene Profile werden hiervon
# abgeleitet.
#
# Alle Längen in Millimetern. extrusion_width ist ohne Angabe Düse * 1,05.
# technology ist ohne Angabe "fdm" — jedes vor dem 22.09.2026 angelegte Profil
# ist damit ein FDM-Drucker, ohne Migration. Ein Resin-Drucker trägt
# technology = "resin" und statt Düse und Bahnbreite die Pixelgröße
# (pixel_size, XY in mm) und seine Mindestwand (minimum_wall); layer_height
# ist dort die Belichtungsschicht. Düsenfelder in einem Resin-Profil werden
# nicht gelesen.
# nozzles zählt die Düsen, die zugleich drucken — ohne Angabe eine. Eine
# Wechselstation (AMS, CFS) macht daraus keine zweite: Sie spült bei jedem
# Filamentwechsel. Wer einen Prusa XL mit mehreren Köpfen oder einen IDEX
# fährt, trägt die Zahl in seinem eigenen Profil ein (Druckdialog, „Düsen").
# travel_speed ist die Leerfahrt in mm/s — eine Eigenschaft der Maschine, nicht
# der Qualitätsstufe. Ohne Angabe gilt Solidons Vorgabe (150). Die Werte stammen
# aus dem Standardprozess des Herstellerprofils im Bestand von OrcaSlicer
# (25.09.2026); Drucker ohne eigenen Wert dort tragen keinen.
# speed_* und die Beschleunigungen sind das Standardtempo des Druckers, aus
# demselben Standardprozess; sie gelten für die Stufe „Standard", die übrigen
# Stufen skalieren sie. Fehlt ein Wert oder steht er dort nur relativ (in
# Prozent) oder als null, bleibt der Wert der Stufe. flow_factor ist der
# Volumenstrom des generischen PLA-Profils des Herstellers gegen Solidons
# 12 mm³/s (Centauri Carbon 2: 21 → 1,75); ohne Angabe eins. Er hebt nur PLA —
# die übrigen Materialien begrenzt das Filament, nicht das Hotend.
# overhang_limit ist die Stützgrenze gegen die Senkrechte aus dem Standardprozess
# im Slicer des Herstellers (27.09.2026): ElegooSlicer, Bambu Studio, PrusaSlicer,
# Creality Print; Anycubic und Sovol aus OrcaSlicer. Dort steht sie gegen die
# Waagerechte (support_threshold_angle 30 → 60 hier; PrusaSlicers
# support_material_threshold MK4S 35 → 55, MINI 50 → 40, XL 45 → 45; SV06 40 → 50).
# Ohne Angabe gilt die Startregel von 45 Grad; eine Kalibrierung geht vor.
# Konturen: XY relativ zur nominellen Bettmitte; Z ab Bett. Ohne Kontur gilt
# das nominale Rechteck. Brim-/Skirt-Ränder gehören zum Auftrag, nicht hierher.


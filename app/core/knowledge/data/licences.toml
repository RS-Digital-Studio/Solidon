# Freigabeliste für Abhängigkeitslizenzen (Bauplan §36).
#
# Jede Abhängigkeit wird gegen diese Datei geprüft; ein Paket mit einer Lizenz,
# die hier nicht freigegeben ist, lässt die Prüfung rot werden. Neue
# Abhängigkeit heißt: zuerst ein Eintrag hier (AGENTS.md Regel 22, Checkliste
# „neue Abhängigkeit").
#
# Die entscheidende Regel: kein GPL. PySide6 steht unter der LGPL und darf mit
# einer geschlossenen Anwendung ausgeliefert werden, solange es dynamisch
# gebunden bleibt. Die Slicer stehen unter der GPL und werden deshalb
# ausschließlich als extern installierte Programme aufgerufen, nie
# mitgeliefert.
#
# **Was extern läuft, steht trotzdem hier.** Die Prüfung unten sieht nur, was
# in der eigenen Laufzeit installiert ist — ein Programm, das Solidon bloß
# aufruft, kommt darin nicht vor und wäre damit die einzige Abhängigkeit ohne
# Aktenlage. Deshalb die Aufzählung, auch wenn kein Test sie liest:
#
#   PrusaSlicer       AGPL-3.0  extern aufgerufen (§29), nie mitgeliefert
#   OrcaSlicer        AGPL-3.0  dito
#   CuraEngine        AGPL-3.0  dito
#   Ollama            MIT       extern, eigener Prozess — der lokale Chat (§27)
#   ComfyUI           GPL-3.0   extern, eigener Prozess — Weg 3 (§27)
#   TripoSG           MIT       Quelltext und Gewichte, in ComfyUI geladen
#   BiRefNet          MIT       Freistell-Gewichte (Comfy-Org/BiRefNet)
#   Azure/login       MIT       OIDC-Anmeldung nur im Windows-Baulauf
#   Azure/artifact-signing-action
#                      MIT       signiert Anwendung und Installer im Windows-Baulauf
#
# TripoSG ist der Grund, warum Weg 3 überhaupt geht: Die naheliegende
# Alternative war lizenzrechtlich in Europa nicht nutzbar. Die Knoten unter
# ``app/core/backends/data/comfyui/`` sind eigener Code und liegen im
# Repository, damit sie mitversioniert sind und ins Paket kommen; Quelltext,
# Gewichte und Pakete holt ``app/core/backends/comfy_setup.py``.
#
# **Und was Solidon in eine fremde Umgebung installiert, steht auch hier.** Die
# Einrichtung von Weg 3 zieht Pakete in ComfyUIs eigenes Python nach
# (``comfy_setup.PACKAGES``). Sie sind keine Abhängigkeit dieser Anwendung —
# nichts davon wird hier importiert, und die Prüfung unten sieht sie nicht —,
# aber Solidon legt sie auf den Rechner eines Kunden, und damit gehören sie in
# die Aktenlage. ``tests/test_licences.py`` hält die Liste gegen diese Datei:
#
#   jaxtyping                 MIT         Typprüfung im TripoSG-Quelltext
#   typeguard                 MIT         dito
#   fast-simplification       MIT         Dezimieren, statt pymeshlab (GPL)
#   trimesh                   MIT         Netze im Knoten
#   diffusers                 Apache-2.0  die Pipeline von TripoSG
#   scikit-image              BSD-3       Marching Cubes im Rückfallpfad
#   lazy_loader               BSD-3       Abhängigkeit von scikit-image
#   omegaconf                 BSD-3       Konfiguration im TripoSG-Quelltext
#   antlr4-python3-runtime    BSD-3       Abhängigkeit von omegaconf, Version 4.9.3
#
# Der Grund für die Version steht in ``comfy_setup.PACKAGES``: Die 4.13
# serialisiert den Automaten anders, den ``omegaconf`` liest.

[policy]
# Lizenzkennungen, die in Ordnung sind. Verglichen wird ohne Rücksicht auf
# Groß- und Kleinschreibung, als Teilzeichenkette.
allowed = [
  "MIT",
  "BSD",
  "Apache",
  "ISC",
  "Python Software Foundation",
  "PSF",
  "MPL",
  "Mozilla",
  "Boost",
  "Zlib",
  "CC0",
  "Unlicense",
  "LGPL",
  "Historical Permission Notice",
  "HPND",
]

# Lizenzkennungen, die die Sache beenden. Geprüft wird vor `allowed`, und
# „LGPL" gewinnt gegen „GPL" nur deshalb, weil es zuerst als ganzes Wort
# verglichen wird.
forbidden = ["GPL-2", "GPL-3", "GPLv2", "GPLv3", "AGPL", "General Public License"]

# Pakete, die nie installiert werden dürfen, was ihre Metadaten auch sagen
# mögen (§36). rtree steht hier wegen **Stabilität**, nicht Lizenz:
# libspatialindex zerlegte den Heap (24.08.2026, „Breite auf 90"), der Code
# ist seit 933bba4 rtree-frei — und installiert bliebe das Paket eine geladene
# Falle, weil trimesh es über eigene Importe von selbst hereinzöge.
banned_packages = ["pymeshlab", "PyQt5", "PyQt6", "PyQt5-Qt5", "PyQt6-Qt6", "rtree"]

# Distributionen, deren Metadaten die Lizenz nicht maschinenlesbar nennen.
# Von Hand geprüft, Quelle notiert — sonst wird die Prüfung ein Stempel.
[known]
manifold3d = { licence = "Apache-2.0", note = "Kern der Bausteinbibliothek" }
trimesh = { licence = "MIT", note = "Netze lesen, schreiben, reparieren" }
numpy = { licence = "BSD-3-Clause" }
scipy = { licence = "BSD-3-Clause", note = "Graphen, Zuordnungslöser und der Skizzenlöser in der Ebene (§30.1)" }
shapely = { licence = "BSD-3-Clause", note = "Polygone für den geschlossenen Schnitt; bringt GEOS mit (LGPL-2.1)" }
networkx = { licence = "BSD-3-Clause", note = "Konturhierarchie beim Schließen einer Schnittfläche" }
scikit-image = { licence = "BSD-3-Clause", note = "Marching Cubes für die Voxelstufe der Rückfallkette" }
lxml = { licence = "BSD-3-Clause", note = "XML-Schreiber hinter dem 3MF-Export" }
vhacdx = { licence = "BSD-3-Clause", note = "V-HACD-Hinweis für die Trennebene (§22.3); optional, das Original github.com/kmammou/v-hacd steht unter BSD-3" }
fast-simplification = { licence = "MIT", note = "Quadrik-Dezimierung für erzeugte Netze (§25)" }
"svg.path" = { licence = "MIT", note = "SVG-Pfade lesen für den Zeichnungsimport (§25)" }
# Der zweite Konstruktionskern (§30). Die Python-Anbindung steht unter
# Apache-2.0; OpenCASCADE selbst unter LGPL-2.1 mit der OCCT-Linking-Ausnahme
# und wird dynamisch gebunden, genau wie PySide6 (§36).
cadquery-ocp-novtk = { licence = "Apache-2.0", note = "OCP-Anbindung; OpenCASCADE darunter steht unter LGPL-2.1 mit Linking-Ausnahme" }
cadquery-ocp-proxy = { licence = "Apache-2.0", note = "wählt die OCP-Version, die zum installierten VTK passt" }
lazy_loader = { licence = "BSD-3-Clause", note = "kommt mit scikit-image" }
imageio = { licence = "BSD-2-Clause", note = "kommt mit scikit-image" }
tifffile = { licence = "BSD-3-Clause", note = "kommt mit scikit-image" }
PySide6 = { licence = "LGPL-3.0", note = "dynamisch gebunden, §36" }
PySide6-Essentials = { licence = "LGPL-3.0" }
PySide6-Addons = { licence = "LGPL-3.0" }
shiboken6 = { licence = "LGPL-3.0" }
pyvista = { licence = "MIT" }
pyvistaqt = { licence = "MIT" }
vtk = { licence = "BSD-3-Clause" }
matplotlib = { licence = "PSF-based", note = "matplotlib-Lizenz, BSD-verträglich" }
pillow = { licence = "MIT-CMU", note = "HPND, freizügig" }
# Der Agent legt den eigenen Schlüssel im Schlüsselbund des Systems ab (§27).
# Alles darunter kommt mit `keyring`; durchweg MIT außer pywin32-ctypes, das
# unter BSD-3 steht.
keyring = { licence = "MIT", note = "Schlüsselbund des Systems für den Modellschlüssel" }
"jaraco.classes" = { licence = "MIT", note = "kommt mit keyring" }
"jaraco.context" = { licence = "MIT", note = "kommt mit keyring" }
"jaraco.functools" = { licence = "MIT", note = "kommt mit keyring" }
more-itertools = { licence = "MIT", note = "kommt mit keyring" }
pywin32-ctypes = { licence = "BSD-3-Clause", note = "Windows-Anmeldespeicher hinter keyring" }
"backports.tarfile" = { licence = "MIT", note = "kommt mit keyring" }

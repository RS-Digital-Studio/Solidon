# Freigabeliste für Abhängigkeitslizenzen (Bauplan §36).
#
# Jede Abhängigkeit wird gegen diese Datei geprüft; ein Paket mit einer Lizenz,
# die hier nicht freigegeben ist, lässt die Prüfung rot werden. Neue
# Abhängigkeit heißt: zuerst ein Eintrag hier (AGENTS.md Regel 22, Checkliste
# „neue Abhängigkeit").
#
# Die entscheidende Regel: kein GPL. PySide6 steht unter der LGPL und darf mit
# einer geschlossenen Anwendung ausgeliefert werden, solange es dynamisch
# gebunden bleibt. Die Slicer stehen unter der GPL und werden deshalb
# ausschließlich als extern installierte Programme aufgerufen, nie
# mitgeliefert.
#
# **Und was mitreist, ohne ein Paket zu sein, ebenfalls.** Vier Schriftsippen
# liegen als sechsundzwanzig TTF-Dateien in `app/core/geom/data/fonts/` und
# werden mit ausgeliefert; `pip` weiß nichts von ihnen. DejaVu steht unter der
# Bitstream-Vera-Lizenz (seine eigenen Änderungen gemeinfrei, die Arev-Glyphen
# unter gleichlautenden Bedingungen), die übrigen drei unter der SIL Open Font
# License 1.1:
#
#   DejaVu          2.35    zwölf Dateien, drei Familien zu vier Schnitten
#   Liberation      2.1.5   zwölf Dateien, drei Familien zu vier Schnitten
#   Comfortaa       3.105   eine Datei, variabel
#   Dancing Script  2.001   eine Datei, variabel
#
# Ihre Lizenztexte stehen unter `third_party_licenses/`, benannt nach Sippe und
# Fassung; die Zuordnung führt `label_ops.BUNDLED_FONT_LICENCES`. Drei Tests
# halten das zusammen: `test_every_bundled_font_carries_its_licence` verlangt
# zu jeder Datei einen Eintrag und zu jedem Eintrag einen Text,
# `test_every_licence_text_names_the_version_that_lies_beside_it` hält die
# Fassung im Dateinamen gegen die Schriftdatei selbst, und
# `test_the_bundled_fonts_are_listed_here` hält diese Aufzählung gegen die
# Zuordnung — eine fünfte Sippe stünde sonst nirgends in der Aktenlage.
# Zusätzlich führt `third_party_licenses.toml` ihre festen Primärquellen und
# SHA-256-Werte. `test_font_licence_corruption_is_rejected` belegt, dass der
# Beilagengenerator auch einen beschädigten Schriftlizenztext zurückweist.
#
# Sie erscheinen **nicht** in `THIRD-PARTY-NOTICES.md`: Die Beilage entsteht
# aus den installierten Wheels und den nativen Laufzeitteilen, und eine Schrift
# ist beides nicht. Was die OFL verlangt, ist trotzdem eingelöst — der
# Lizenztext reist als Datei mit, `third_party_licenses/` liegt im Paket.
#
# **Was extern läuft, steht trotzdem hier.** Die Prüfung unten sieht nur, was
# in der eigenen Laufzeit installiert ist — ein Programm, das Solidon bloß
# aufruft, kommt darin nicht vor und wäre damit die einzige Abhängigkeit ohne
# Aktenlage. Deshalb die Aufzählung, auch wenn kein Test sie liest:
#
#   PrusaSlicer       AGPL-3.0  extern aufgerufen (§29), nie mitgeliefert
#   OrcaSlicer        AGPL-3.0  dito
#   CuraEngine        AGPL-3.0  dito
#   Ollama            MIT       extern, eigener Prozess — der lokale Chat (§27)
#   ComfyUI           GPL-3.0   extern, eigener Prozess — Weg 3 (§27)
#   TRELLIS.2-4B      MIT (Microsoft), Formkern und Form-VAE für Weg 3,
#                               eingebaute Knoten in ComfyUI ab 0.34; Solidon
#                               lädt die Packung Comfy-Org/TRELLIS.2 @ 430a9d09
#                               (``comfy_setup.SHAPE_FILES``) in ComfyUI, nie ins
#                               Paket
#   DINOv3 ViT-L/16   DINOv3 License (Meta), Bildkodierer von TRELLIS.2:
#                               weltweit und gewerblich, mit Nutzungsbedingungen
#                               (Handelskontrolle, keine Waffen, §1.b), Meta darf
#                               ändern (§8). Geladen aus Comfy-Org/TRELLIS.2, dort
#                               als MIT geführt und ohne Lizenzkopie; Belege und
#                               Kanzleifragen: konzepte/nachweise-generatoren-2026-10/
#   BiRefNet          MIT       Freistell-Gewichte (Comfy-Org/BiRefNet, byte-
#                               gleich mit ZhengPeng7/BiRefNet); die Trainings-
#                               daten DIS5K sind nur nicht-kommerziell
#                               freigegeben (konzepte/nachweise-generatoren-2026-10/)
#   FLUX.2 [klein] 4B Apache-2.0 (Black Forest Labs), Bildmodell des Textwegs,
#                               auf Wunsch eingerichtet (``comfy_setup.
#                               IMAGE_MODEL_FILES``); dazu Textkodierer Qwen3-4B
#                               (Apache-2.0) und die FLUX.2-VAE aus der Packung
#                               von Comfy-Org. Die 9B-Fassung und FLUX.2 [dev]
#                               sind nicht-kommerziell, die Rolle ``image``
#                               schließt sie aus
#   Qwen3-TTS         Apache-2.0, Quelltext und 1.7B-VoiceDesign-/Base-Gewichte
#                               (github.com/QwenLM/Qwen3-TTS und
#                               huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-Base).
#                               Ausschließlich externe Medienproduktion in
#                               .venv-qwen-tts; keine App-Abhängigkeit, keine
#                               Auslieferung. Referenzen müssen selbst erzeugt
#                               oder mit ausdrücklicher Einwilligung freigegeben sein.
#   Thorsten-Voice    CC0-1.0, vom Sprecher selbst für freie Sprachsynthese
#                               einschließlich kommerzieller Nutzung freigegeben
#                               (thorsten-voice.de, github.com/thorstenMueller/Thorsten-Voice).
#                               Nur externe Medienproduktion; Quelle, Aufnahmehash
#                               und Einwilligungsbeleg liegen bei der Referenz.
#   Chatterbox        MIT       Sprachsynthese der Marketingfilme in .venv-tts
#                               (tools/speak_chatterbox.py); nur externe
#                               Medienproduktion, jede Aufnahme trägt Resembles
#                               Wasserzeichen
#   Piper             GPL-3.0-or-later
#                               Sprachsynthese der Werkstattfilme, als Programm
#                               aus .venv-video aufgerufen, nie importiert
#                               (tools/speak_piper.py, Regel 15); die deutsche
#                               Stimme ist Thorsten-Voice
#   en_US-ljspeech-high Public Domain laut Modellautor Bryce Beattie; von ihm
#                               von Grund auf mit dem LJ Speech Dataset trainiert
#                               und für Uploads freigegeben
#                               (brycebeattie.com/files/tts/). Das Modellkarten-
#                               Verzeichnis auf Hugging Face zeigt zwar MIT auf
#                               Repository-Ebene; die einzelne Karte nennt keine
#                               eigene Lizenz und widerspricht dem Modellautor
#                               bei den Trainingsangaben (1000 statt 2000 Epochen,
#                               22.500 statt 22.050 Hz).
#                               Die Rechteangabe stützt sich deshalb auf die
#                               explizite Erklärung des Modellautors. LJ Speech
#                               v1.1 nennt Texte, Aufnahmen und Annotationen
#                               gemeinfrei (keithito.com/LJ-Speech-Dataset/).
#                               Der lokale ONNX-Stand hat SHA-256
#                               5d4f08ba6a2a48c44592eed3ce56bf85e9de3dd4e20df90541ae68a8310c029a,
#                               die Konfiguration
#                               7e1f4634af596d83cca997fb7a931ba80b70f8a316a2655ee69c55365e0ace14.
#                               Die Quellen belegen Modell- und Datenherkunft;
#                               eine gesonderte Einwilligung der Sprecherin in
#                               die Nachahmung ihrer Stimme oder deren Werbung
#                               belegen sie nicht.
#
# Bis Oktober 2026 lief Weg 3 über TripoSG mit eigenem Knoten und Paketen,
# die Solidon in ComfyUIs Python nachzog. Ein Teil des TripoSG-Quelltexts
# steht unter Tencent- und FlashVDM-Lizenzen, deren Gebiet die EU,
# Großbritannien und Südkorea ausnimmt (RM-003); seitdem richtet Solidon
# keinen Knoten und kein Paket mehr in ComfyUI ein, nur Modelldateien mit
# fester Revision und SHA-256 (``app/core/backends/comfy_setup.py``). Was
# die alte Einrichtung angelegt hat, räumt ``comfy_setup.remove_legacy``.

[policy]
# SPDX-Lizenzkennungen, die als einzelner Zweig in Ordnung sind. Die Prüfung
# vergleicht exakt und wertet AND, OR, WITH und Klammern aus. Anzeigenamen aus
# alten Paketmetadaten gehören nicht hierher, sondern paketbezogen nach
# ``known``.
allowed = [
  "MIT",
  # SIL Open Font License — die mitgelieferten Liberation-Schriften
  # (`geom/data/fonts/`, zwölf Dateien, 4,2 MB). Sie sind kein Python-Paket
  # und tauchen in der Prüfung unten deshalb nicht auf; was sie hält, ist
  # `tests/test_licences.py::test_every_bundled_font_carries_its_licence` —
  # dieselbe Überlegung wie bei den ComfyUI-Abläufen, deren Lizenzfrage auch
  # nicht in `pyproject.toml` steht (`.claude/rules/kern.md`).
  "OFL-1.1",
  # Bitstream Vera — die mitgelieferten DejaVu-Schriften (zwölf Dateien), bis
  # RM-471 über matplotlib im Paket, jetzt als eigene Dateien.
  "Bitstream-Vera",
  "MIT-CMU",
  "0BSD",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSD-3-Clause-Open-MPI",
  "Apache-2.0",
  "ISC",
  "PSF-2.0",
  "MPL-2.0",
  "BSL-1.0",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "HPND",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LicenseRef-Matplotlib",
  "LicenseRef-HarfBuzz-Old-MIT",
  # Die fünf unten kommen aus den Systembibliotheken, die das Linux-Paket
  # bündelt (`make_sbom.LINUX_FAMILY_COMPONENTS`), und sind am 03.09.2026
  # nacherfasst worden: Sie liegen seit 0.2.1 im ausgelieferten Paket, es ist
  # also keine Aufnahme, sondern die Dokumentation dessen, was ohnehin
  # verteilt wird. Alle fünf sind freizügig oder gemeinfrei.
  "AFL-2.1",          # D-Bus — Doppellizenz mit GPL-2.0+, die Regel 15 ausschließt
  "FTL",              # FreeType — dasselbe Muster: FTL oder GPL-2.0
  "bzip2-1.0.6",      # bzip2, BSD-artig
  "libpng-2.0",       # libpng, BSD-artig
  "LicenseRef-libselinux-public-domain",  # „public domain software, i.e. not copyrighted"
]

# Exakt geprüfte Copyleft-Kennungen. Ein erlaubter OR-Zweig kann gewählt
# werden; in einem AND-Zweig bleibt jede verbotene Lizenz verboten. LGPL in
# einem anderen Zweig hebt deshalb weder GPL noch AGPL auf.
forbidden = [
  "GPL-1.0-only", "GPL-1.0-or-later",
  "GPL-2.0-only", "GPL-2.0-or-later",
  "GPL-3.0-only", "GPL-3.0-or-later",
  "AGPL-1.0-only", "AGPL-1.0-or-later",
  "AGPL-3.0-only", "AGPL-3.0-or-later",
]

# Ausnahmen werden als vollständiges SPDX-WITH-Paar freigegeben, nie als
# Teilzeichenkette. Die OCCT-Ausnahme ist der vertragliche Weg für den zweiten
# dynamisch gebundenen Konstruktionskern. Die GCC-Ausnahme betrifft die in den
# NumPy-/SciPy-Ziel-Wheels enthaltene Laufzeitbibliothek, nicht beliebigen
# GPL-Code.
allowed_with = [
  "LGPL-2.1-only WITH OCCT-exception-1.0",
  "GPL-3.0-or-later WITH GCC-exception-3.1",
]

# Pakete, die nie installiert werden dürfen, was ihre Metadaten auch sagen
# mögen (§36). rtree steht hier wegen **Stabilität**, nicht Lizenz:
# libspatialindex zerlegte den Heap (24.08.2026, „Breite auf 90"), der Code
# ist seit 933bba4 rtree-frei — und installiert bliebe das Paket eine geladene
# Falle, weil trimesh es über eigene Importe von selbst hereinzöge.
banned_packages = ["pymeshlab", "PyQt5", "PyQt6", "PyQt5-Qt5", "PyQt6-Qt6", "rtree"]

# Distributionen, deren Metadaten die Lizenz nicht maschinenlesbar nennen.
# Von Hand geprüft, Quelle notiert — sonst wird die Prüfung ein Stempel.
[known]
manifold3d = { licence = "Apache-2.0", note = "Kern der Bausteinbibliothek" }
trimesh = { licence = "MIT", note = "Netze lesen, schreiben, reparieren" }
numpy = { licence = "BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0", note = "Hauptpaket; die Beilage übernimmt zusätzlich die Lizenzdateien des konkreten Ziel-Wheels" }
scipy = { licence = "BSD-3-Clause AND BSD-3-Clause-Open-MPI AND (GPL-3.0-or-later WITH GCC-exception-3.1)", note = "Graphen, Zuordnungslöser und Skizzenlöser; Ausdruck entspricht dem aktuellen Windows-Ziel-Wheel samt BLAS/LAPACK/GCC-Laufzeit" }
shapely = { licence = "BSD-3-Clause AND LGPL-2.1-or-later", note = "Polygone für den geschlossenen Schnitt; Ziel-Wheel bringt GEOS unter LGPL-2.1-or-later mit" }
networkx = { licence = "BSD-3-Clause", note = "Konturhierarchie beim Schließen einer Schnittfläche" }
scikit-image = { licence = "BSD-3-Clause", note = "Marching Cubes für die Voxelstufe der Rückfallkette" }
vhacdx = { licence = "BSD-3-Clause", note = "V-HACD-Hinweis für die Trennebene (§22.3); optional, das Original github.com/kmammou/v-hacd steht unter BSD-3" }
fast-simplification = { licence = "MIT", note = "Quadrik-Dezimierung für erzeugte Netze (§25)" }
hidapi = { licence = "BSD-3-Clause", note = "HID-Leser für die 3D-Maus (§2.9, Konzept 3D-Maus); das Paket ist dreifach lizenziert (GPL-3.0 OR BSD-3-Clause OR HIDAPI), gewählt ist BSD-3 — die Metadaten nennen nur Klassifikatoren, deshalb steht die Wahl hier" }
xxhash = { licence = "BSD-2-Clause", note = "schneller Array-Hash für trimeshs Cache-Prüfungen; ohne ihn fällt trimesh auf blake2b zurück" }
"svg.path" = { licence = "MIT", note = "SVG-Pfade lesen für den Zeichnungsimport (§25)" }
# Der Renderer hinter der 3D-Ansicht (§18): pygfx über wgpu. Seit dem Ausbau
# von VTK am 06.09.2026 ist er der einzige. Die vier
# Pakete der pygfx-Familie nennen ihre Lizenz nur in der Datei, nicht in den
# Metadaten; die Beilage übernimmt die Lizenzdateien der Wheels.
pygfx = { licence = "BSD-2-Clause", note = "Renderer über wgpu (§18); Lizenzdatei im Wheel, Metadaten leer" }
wgpu = { licence = "BSD-2-Clause", note = "WebGPU-Anbindung unter pygfx, direkt in ui/render gefragt; bringt wgpu-native (Apache-2.0 OR MIT) als Binärdatei mit" }
rubicon-objc = { licence = "BSD-3-Clause", note = "Objective-C-Anbindung von wgpu unter macOS; PyPI 0.5.6 nennt BSD-3-Clause" }
rendercanvas = { licence = "BSD-2-Clause", note = "die Leinwand für pygfx — Qt-Widget und Puffer ohne Fenster, direkt in ui/render gebaut" }
pylinalg = { licence = "BSD-2-Clause", note = "lineare Algebra für pygfx" }
freetype-py = { licence = "BSD-3-Clause", note = "Schrift für pygfx-Beschriftungen; bringt FreeType (FTL) mit — die Metadaten sagen nur „BSD License“" }
uharfbuzz = { licence = "Apache-2.0", note = "Textsatz für pygfx und die Schriftzüge (geom/glyphs.py); bringt HarfBuzz (MIT-artig) mit — die Metadaten sagen nur „Apache License 2.0“" }
Jinja2 = { licence = "BSD-3-Clause", note = "Shader-Vorlagen in pygfx; die Metadaten sagen nur „BSD License“" }
hsluv = { licence = "MIT", note = "Farbraum für pygfx; die Metadaten sagen nur „MIT License“" }
# Der zweite Konstruktionskern (§30). Die Python-Anbindung steht unter
# Apache-2.0; OpenCASCADE selbst unter LGPL-2.1 mit der OCCT-Linking-Ausnahme
# und wird dynamisch gebunden, genau wie PySide6 (§36).
cadquery-ocp-novtk = { licence = "Apache-2.0 AND (LGPL-2.1-only WITH OCCT-exception-1.0)", note = "OCP-Anbindung und mitgereichtes OpenCASCADE unter LGPL-2.1 mit Linking-Ausnahme" }
cadquery-ocp-proxy = { licence = "Apache-2.0", note = "wählt die OCP-Version, die zum installierten VTK passt" }
lazy_loader = { licence = "BSD-3-Clause", note = "kommt mit scikit-image" }
imageio = { licence = "BSD-2-Clause", note = "direkt: liest das Höhenbild der Reliefoperation (geom/displace.py)" }
tifffile = { licence = "BSD-3-Clause", note = "kommt mit scikit-image" }
PySide6 = { licence = "LGPL-3.0-only", note = "dynamisch gebunden, §36" }
PySide6-Essentials = { licence = "LGPL-3.0-only" }
PySide6-Addons = { licence = "LGPL-3.0-only" }
shiboken6 = { licence = "LGPL-3.0-only" }
pillow = { licence = "MIT-CMU", note = "HPND, freizügig" }
# Der Agent legt den eigenen Schlüssel im Schlüsselbund des Systems ab (§27).
# Alles darunter kommt mit `keyring`; durchweg MIT außer pywin32-ctypes, das
# unter BSD-3 steht.
keyring = { licence = "MIT", note = "Schlüsselbund des Systems für Geräteidentität und Modellschlüssel" }
"jaraco.classes" = { licence = "MIT", note = "kommt mit keyring" }
"jaraco.context" = { licence = "MIT", note = "kommt mit keyring" }
"jaraco.functools" = { licence = "MIT", note = "kommt mit keyring" }
more-itertools = { licence = "MIT", note = "kommt mit keyring" }
pywin32-ctypes = { licence = "BSD-3-Clause", note = "Windows-Anmeldespeicher hinter keyring" }
certifi = { licence = "MPL-2.0" }
fonttools = { licence = "MIT" }
packaging = { licence = "Apache-2.0 OR BSD-2-Clause" }
Pygments = { licence = "BSD-2-Clause" }
typing_extensions = { licence = "PSF-2.0" }
SecretStorage = { licence = "BSD-3-Clause" }
jeepney = { licence = "MIT" }
cryptography = { licence = "Apache-2.0 OR BSD-3-Clause" }
cffi = { licence = "MIT" }
pycparser = { licence = "BSD-3-Clause" }

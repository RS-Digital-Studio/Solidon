# Systembibliotheken, die das Linux-Paket bündelt
#
# Nacherfasst am 03.09.2026, und zwar ohne Roberts Zustimmung, weil sie seit
# 0.2.1 im ausgelieferten Paket liegen: Regel 22 verlangt den Eintrag vor einer
# **neuen** Abhängigkeit; hier ist keine dazugekommen, sondern eine
# undokumentierte wird dokumentiert — der schlechtere von beiden Zuständen war
# der bisherige. Zu widerrufen ist das jederzeit; der Registerpunkt nennt es.
#
# Fünf Lizenzkennungen kommen dafür neu in die Freigabeliste: AFL-2.1 (D-Bus),
# FTL (FreeType), bzip2-1.0.6, libpng-2.0 und die gemeinfreie libselinux. Bei
# D-Bus und libcap ist die Wahl innerhalb der Doppellizenz keine

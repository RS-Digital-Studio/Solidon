# **Mehrere Fassungen, weil zwei Plattformwege liefern.** Windows und macOS
# bekommen OpenSSL mit dem CPython-Bau (3.5.9 mit 3.14.8, laut
# `PCbuild/python.props` und `Mac/BuildScript/build-installer.py` zum Tag;
# 3.5.7 mit 3.14.7, 3.0.21 mit 3.13), auf Linux reist die Systembibliothek
# des Bauservers mit — Ubuntu 22.04 trägt 3.0.2 (bis 0.6.0 baute Linux auf
# 24.04 mit 3.0.13; die Fassung bleibt für die Akte der alten Pakete). Der
# erste Linux-Paketlauf, der überhaupt bis zur Releaseakte kam (Tag-Lauf 8,
# 03.09.2026), ist darüber gestolpert. Alle Fassungen stehen unter Apache-2.0;
# die Quelle nennt deshalb das Repository und nicht einen einzelnen Baum, denn
# eine Zeile kann nicht auf mehrere Tags zeigen.

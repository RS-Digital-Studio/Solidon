# Startbestand an Druckeinstellungen (Bauplan §29).
#
# Drei Ebenen, die übereinander gelegt werden — dieselbe Aufteilung, die
# PrusaSlicer und Orca als Prozess-, Filament- und Druckerprofil führen:
#
#   [quality.*]   Was die Qualitätsstufe ausmacht: Schichthöhe, Wände, Füllung,
#                 Geschwindigkeit. Materialunabhängig.
#   [material.*]  Was am Filament hängt: Temperaturen, Kühlung, Rückzug, Dichte.
#                 Überschreibt die Stufe, wo beide etwas sagen.
#   Drucker       Kommt nicht aus dieser Datei, sondern aus printers.toml —
#                 Düsendurchmesser skaliert Schichthöhe und Linienbreite.
#
# Eigene Werte gehören in <Nutzerdaten>/profiles/print_settings.toml und werden
# darüber gelegt; der mitgelieferte Bestand bleibt unberührt.
#
# Alle Längen in Millimetern, Temperaturen in Grad Celsius, Geschwindigkeiten in
# mm/s. Anteile sind Zahlen zwischen 0 und 1 — 0.15 sind fünfzehn Prozent.
#
# Die Werte sind belastbare Ausgangspunkte für eine 0,4-mm-Düse, keine
# Messungen. Was der Druck widerlegt, gehört ins eigene Profil.

# --- Qualitätsstufen -----------------------------------------------------------

[quality.draft]
title = "Entwurf"
layer_height = 0.28
first_layer_height = 0.3
wall_count = 2
top_layers = 4
bottom_layers = 3
infill_density = 0.1
infill_pattern = "grid"
speed_outer_wall = 50.0
speed_inner_wall = 80.0
speed_infill = 120.0
speed_top_surface = 50.0
speed_first_layer = 25.0
minimum_layer_time = 5.0

[quality.standard]
title = "Standard"
layer_height = 0.2
first_layer_height = 0.25
wall_count = 3
top_layers = 5
bottom_layers = 4
infill_density = 0.15
infill_pattern = "grid"
speed_outer_wall = 40.0
speed_inner_wall = 60.0
speed_infill = 80.0
speed_top_surface = 40.0
speed_first_layer = 20.0
minimum_layer_time = 8.0

[quality.fine]
title = "Fein"
layer_height = 0.12
first_layer_height = 0.2
wall_count = 3
top_layers = 7
bottom_layers = 5
infill_density = 0.2
infill_pattern = "gyroid"
speed_outer_wall = 30.0
speed_inner_wall = 45.0
speed_infill = 60.0
speed_top_surface = 30.0
speed_first_layer = 18.0
minimum_layer_time = 12.0
# Dünne Schichten kühlen zu schnell aus, um sie auch noch schnell zu fahren.

[quality.strong]
title = "Belastbar"
layer_height = 0.2
first_layer_height = 0.25
wall_count = 5
top_layers = 6
bottom_layers = 5
infill_density = 0.4
infill_pattern = "cubic"
speed_outer_wall = 35.0
speed_inner_wall = 50.0
speed_infill = 70.0
speed_top_surface = 35.0
speed_first_layer = 20.0
minimum_layer_time = 10.0
# Festigkeit kommt aus Wänden, nicht aus Füllung: fünf Wände tragen mehr als
# vierzig Prozent Infill und kosten weniger Zeit.

# --- Materialien ---------------------------------------------------------------

[material.pla]
nozzle = 210
nozzle_first_layer = 215
bed = 60
bed_first_layer = 60
chamber = 0
fan_speed = 1.0
bridge_fan_speed = 1.0
disable_fan_layers = 1
retraction_length = 0.8
retraction_speed = 35.0
z_hop = 0.2
density = 1.24
flow_ratio = 0.98
colour = "#4A90D9"
adhesion = "skirt"

[material.petg]
nozzle = 240
nozzle_first_layer = 245
bed = 80
bed_first_layer = 80
chamber = 0
fan_speed = 0.5
bridge_fan_speed = 1.0
disable_fan_layers = 2
retraction_length = 1.2
retraction_speed = 30.0
z_hop = 0.3
density = 1.27
flow_ratio = 0.95
colour = "#3FAE6B"
adhesion = "skirt"
# PETG zieht Fäden und klebt an der Platte fest: weniger Lüfter, mehr Rückzug,
# und der Z-Hop hält die Düse aus dem eben Gelegten heraus.

[material.petg-cf]
nozzle = 250
nozzle_first_layer = 255
bed = 80
bed_first_layer = 80
chamber = 0
fan_speed = 0.4
bridge_fan_speed = 0.8
disable_fan_layers = 2
retraction_length = 1.0
retraction_speed = 30.0
z_hop = 0.3
density = 1.30
flow_ratio = 0.96
colour = "#2C2C2C"
adhesion = "brim"
# Gefüllte Filamente brauchen eine gehärtete Düse; das steht im Handbuch, nicht
# in einer Zahl hier.

[material.asa]
nozzle = 255
nozzle_first_layer = 260
bed = 100
bed_first_layer = 100
chamber = 50
fan_speed = 0.2
bridge_fan_speed = 0.5
disable_fan_layers = 3
retraction_length = 1.0
retraction_speed = 35.0
z_hop = 0.2
density = 1.07
flow_ratio = 0.97
colour = "#D9D0C1"
adhesion = "brim"

[material.abs]
nozzle = 250
nozzle_first_layer = 255
bed = 100
bed_first_layer = 100
chamber = 50
fan_speed = 0.15
bridge_fan_speed = 0.4
disable_fan_layers = 3
retraction_length = 1.0
retraction_speed = 35.0
z_hop = 0.2
density = 1.04
flow_ratio = 0.97
colour = "#B84A4A"
adhesion = "brim"
# ASA und ABS ziehen sich beim Abkühlen zusammen. Wenig Lüfter, warme Kammer,
# Brim — ohne geschlossenen Bauraum reißen hohe Teile an den Ecken auf.

[material.tpu-95a]
nozzle = 225
nozzle_first_layer = 230
bed = 45
bed_first_layer = 45
chamber = 0
fan_speed = 0.6
bridge_fan_speed = 0.8
disable_fan_layers = 1
retraction_length = 0.4
retraction_speed = 20.0
z_hop = 0.0
density = 1.21
flow_ratio = 1.05
colour = "#E0A32E"
adhesion = "skirt"
# Weiches Filament staucht im Bowden statt zurückzuziehen: kurzer, langsamer
# Rückzug. Die Geschwindigkeitsdeckelung steckt in `advise.py`, nicht hier —
# sie hängt am Material, aber sie ist eine Obergrenze, keine Vorgabe.

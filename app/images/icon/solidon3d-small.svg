<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Das Anwendungssymbol für kleine Größen: 16 bis 32 Pixel, also
       Titelleiste, Taskleiste, Alt-Tab und die Titelleiste jedes Dialogs.

       Es ist **dieselbe Form** wie die große Fassung — gleiche Punkte, gleiche
       Farben, gleiche Bohrung. Der einzige Unterschied: die Schichtlinien an
       der linken Flanke fehlen.

       Warum genau die: Sie sind in der großen Fassung 2,5 Einheiten breit, bei
       einer Viewbox von 128 also rund ein Fünfzigstel der Kantenlänge. Auf
       sechzehn Pixel gerastert sind das 0,3 Pixel — zu wenig für eine Linie,
       genug für einen grauen Schleier über der halben Fläche. Die Flanke
       verliert dadurch ihren Ton, und der Körper ist nicht mehr als Körper zu
       lesen.

       Alles andere bleibt, wie es ist. Eine zweite Fassung ist kein Anlass für
       einen zweiten Entwurf: Wer das Symbol in der Taskleiste sieht und dann
       im Über-Dialog, soll nicht zwei Bilder vergleichen.

       Gepflegt wird sie von Hand, gerastert von tools/make_icon.py. -->
  <!-- Deckfläche -->
  <polygon points="64,18 104,41 64,64 24,41" fill="#e08b4e" />
  <!-- linke Flanke, hier ohne Schichtlinien -->
  <polygon points="24,41 64,64 64,110 24,87" fill="#b96428" />
  <!-- rechte Flanke -->
  <polygon points="104,41 64,64 64,110 104,87" fill="#7c3a10" />
  <!-- Bohrung: isometrisch projizierter Kreis auf der Deckfläche -->
  <ellipse cx="64" cy="41" rx="17" ry="9.8" fill="#3a1c06" />
</svg>

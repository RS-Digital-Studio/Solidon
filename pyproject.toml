[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formwerk"
version = "0.0.1"
description = "Desktop application for building, generating and editing printable models"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "RS Digital" }]
dependencies = []

[project.optional-dependencies]
# Geometry kernels and mesh IO. Licence check runs against Bauplan §36.
geom = [
  "numpy>=1.26",
  # trimesh needs a graph engine for watertightness and components; scipy also
  # brings the assignment solver the feature matching in §21.2 will use.
  "scipy>=1.13",
  "trimesh>=4.4",
  "manifold3d>=2.5",
  # Polygon work behind the capped section cut (§18.2). BSD-3, bundles GEOS (LGPL).
  "shapely>=2.0",
  # Contour hierarchy for the same cut: without these two a cut through a plate
  # with a hole cannot be closed. BSD-3 and MIT.
  "networkx>=3.0",
  "rtree>=1.2",
  # Marching cubes for the voxel stage of the boolean fallback chain (§17.2). BSD-3.
  "scikit-image>=0.24",
  # 3MF is the format slicers prefer, and it needs an XML writer (§29). BSD-3.
  "lxml>=5.0",
  # V-HACD tells the auto split where a body comes apart by itself (§22.3).
  # Optional at runtime: without it the plane search answers on its own. BSD-3.
  "vhacdx>=0.0.8",
  # Decimation for generated meshes (§25, "Netz"). MIT.
  "fast-simplification>=0.1.9",
  # SVG paths behind the drawing import (§25). MIT; DXF trimesh reads itself.
  "svg.path>=6.3",
]
# Desktop shell. PySide6 is LGPL and must stay dynamically linked (§36).
ui = [
  "PySide6>=6.7",
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
]
# The agent needs a place for the user's own key (§27). Without this extra the
# application works; only the chat stays switched off.
agent = ["keyring>=25.0"]
# The second construction kernel (§30): real edges, and therefore exact fillets,
# chamfers and STEP. Optional — without it those operations say so in one
# sentence and everything else is untouched. The binding is Apache-2.0, the
# kernel underneath LGPL-2.1 with the OCCT linking exception, so it is used as a
# dynamically linked library like PySide6 (§36). "novtk" because pyvista already
# brings VTK; two copies in one process are one too many.
brep = ["cadquery-ocp-novtk>=7.8"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  # Evaluates environment markers for the licence check.
  "packaging>=24.0",
]

[project.scripts]
formwerk = "app.cli.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.core.knowledge" = ["data/*.toml"]
# The ComfyUI workflows are data, not code (§27): a different generator means a
# different file, not a patch.
"app.core.backends" = ["data/*.json"]
"app.core.knowledge.parts" = ["LICENSE"]
"app.i18n" = ["locales/*.json"]
# The three example projects are shipped: documentation, acceptance test and
# start screen content at once (§37.2). The manual figures ship with them —
# the drawn and rendered ones are computed on the fly, the screenshots cannot
# be, so they travel as files (one folder per language).
"app" = ["examples/*.p3d", "images/manual/*/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
  "performance: measures against the budget in Bauplan §31",
  "slow: takes noticeably longer than a unit test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Bauplan §33.1 fixes the exception names. OutOfBuildVolume and OperationCancelled
# are part of the contract, not a style choice.
"app/core/errors.py" = ["N818"]
# MapTooLarge is a control-flow signal inside the maps, not a reported error.
"app/core/perceive/maps.py" = ["N818"]
# BackendUnavailable reads as a state, and it is one — §33.1 fixes the names.
"app/core/backends/llm.py" = ["N818"]
# UnsafeSource and ScadUnavailable read as states too, and both are AppErrors.
"app/core/backends/openscad.py" = ["N818"]
# GenerationFailed says what happened, which is what the user reads (§33.1).
"app/core/backends/mesh.py" = ["N818"]
# BRepUnavailable is a state like the two above, and §33.1 fixes the names.
"app/core/brep/kernel.py" = ["N818"]
# The suite has to redirect the user directories before anything reads them,
# so those two imports come after the environment is set (§38).
"tests/conftest.py" = ["E402"]
# Qt signals are camelCase by convention, and "20 × 20 mm" is how a dimension is
# written in German — both are deliberate in the surface.
"app/ui/*" = ["N815", "RUF001"]
# The digest is read by people and by the model; "20 × 20 mm" is the right sign.
"app/core/perceive/digest.py" = ["RUF001"]
"tests/*" = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
  "trimesh.*",
  "manifold3d.*",
  "pyvista.*",
  "scipy.*",
  "skimage.*",
  "shapely.*",
  # The OpenCASCADE binding is a compiled extension without stubs (§30).
  "OCP.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Platform branches are unreachable on every platform except one — that is the point.
module = ["app.core.paths", "app.core.discover"]
warn_unreachable = false

[[tool.mypy.overrides]]
# trimesh ships only partial annotations; calls into it cannot be typed from here.
module = [
  "app.core.geom.*",
  "app.core.ingest.*",
  "app.core.export.*",
  "app.core.perceive.*",
  "app.core.slice.*",
  "app.core.knowledge.parts.*",
  # The same for OpenCASCADE: an unstubbed extension module (§30).
  "app.core.brep.*",
]
disallow_untyped_calls = false

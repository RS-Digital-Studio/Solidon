[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formwerk"
version = "0.0.1"
description = "Desktop application for building, generating and editing printable models"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "RS Digital" }]
dependencies = []

[project.optional-dependencies]
# Geometry kernels and mesh IO. Licence check runs against Bauplan §36.
geom = [
  "numpy>=1.26",
  # trimesh needs a graph engine for watertightness and components; scipy also
  # brings the assignment solver the feature matching in §21.2 will use.
  "scipy>=1.13",
  "trimesh>=4.4",
  "manifold3d>=2.5",
  # Polygon work behind the capped section cut (§18.2). BSD-3, bundles GEOS (LGPL).
  "shapely>=2.0",
  # Contour hierarchy for the same cut: without these two a cut through a plate
  # with a hole cannot be closed. BSD-3 and MIT.
  "networkx>=3.0",
  "rtree>=1.2",
  # Marching cubes for the voxel stage of the boolean fallback chain (§17.2). BSD-3.
  "scikit-image>=0.24",
  # 3MF is the format slicers prefer, and it needs an XML writer (§29). BSD-3.
  "lxml>=5.0",
]
# Desktop shell. PySide6 is LGPL and must stay dynamically linked (§36).
ui = [
  "PySide6>=6.7",
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
]
# The agent needs a place for the user's own key (§27). Without this extra the
# application works; only the chat stays switched off.
agent = ["keyring>=25.0"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  # Evaluates environment markers for the licence check.
  "packaging>=24.0",
]

[project.scripts]
formwerk = "app.cli.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.core.knowledge" = ["data/*.toml"]
"app.core.knowledge.parts" = ["LICENSE"]
"app.i18n" = ["locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
  "performance: measures against the budget in Bauplan §31",
  "slow: takes noticeably longer than a unit test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Bauplan §33.1 fixes the exception names. OutOfBuildVolume and OperationCancelled
# are part of the contract, not a style choice.
"app/core/errors.py" = ["N818"]
# MapTooLarge is a control-flow signal inside the maps, not a reported error.
"app/core/perceive/maps.py" = ["N818"]
# BackendUnavailable reads as a state, and it is one — §33.1 fixes the names.
"app/core/backends/llm.py" = ["N818"]
# Qt signals are camelCase by convention, and "20 × 20 mm" is how a dimension is
# written in German — both are deliberate in the surface.
"app/ui/*" = ["N815", "RUF001"]
# The digest is read by people and by the model; "20 × 20 mm" is the right sign.
"app/core/perceive/digest.py" = ["RUF001"]
"tests/*" = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["trimesh.*", "manifold3d.*", "pyvista.*", "scipy.*", "skimage.*", "shapely.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Platform branches are unreachable on every platform except one — that is the point.
module = ["app.core.paths"]
warn_unreachable = false

[[tool.mypy.overrides]]
# trimesh ships only partial annotations; calls into it cannot be typed from here.
module = [
  "app.core.geom.*",
  "app.core.ingest.*",
  "app.core.export.*",
  "app.core.perceive.*",
  "app.core.slice.*",
]
disallow_untyped_calls = false

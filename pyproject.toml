[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "solidon3d"
version = "0.5.3"
description = "Desktop application for building, generating and editing printable models"
requires-python = ">=3.14"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "RS Digital" }]
dependencies = [
  # CA-Satz für HTTPS im gebauten macOS-Paket. OpenSSLs dortige Vorgabepfade
  # zeigen sonst in die Python-Installation des Bauservers. MPL-2.0.
  "certifi>=2026.7.22",
  # Sicherer System-Schlüsselbund für die Geräteidentität der Lizenz und den
  # optionalen Modellschlüssel. Ohne ihn darf die Gerätebindung nicht auf eine
  # kopierbare Datei zurückfallen. MIT.
  "keyring>=25.0",
]

[project.optional-dependencies]
# Geometriekerne und Netz-Ein-/Ausgabe. Die Lizenzprüfung läuft gegen §36.
geom = [
  "numpy>=1.26",
  # trimesh braucht einen Graphen für Wasserdichtheit und Komponenten; scipy
  # bringt zudem den Zuordnungslöser für das Feature-Matching aus §21.2 mit.
  "scipy>=1.13",
  # Ab 5.0 typisiert (``py.typed``), und das gleichmäßige Vernetzen liefert
  # bei gleicher Kantenlänge einen Bruchteil der Dreiecke. Zusammengefügt wird
  # über die Engführung ``mesh.concatenated``, nicht ``trimesh.util.concatenate``.
  "trimesh>=5.0",
  # ``mesh_ops`` baut den Körper über ``Mesh64`` (ab 3.0 — die einfache
  # ``Mesh`` nimmt ``float32`` und verstieße gegen Regel 6) und räumt mit
  # ``Manifold.simplify`` auf (ab 3.1).
  "manifold3d>=3.1",
  # trimeshs Cache prüft seine Arrays bei jedem Zugriff über einen Hash und
  # fällt ohne xxhash auf blake2b zurück — knapp 300 000 Aufrufe je Auswertung
  # einer großen Baugruppe, gemessen acht Prozent des Einlesewegs. trimesh
  # fragt das Paket selbst ab; hier steht es, damit auch das gebaute Paket
  # den schnellen Weg fährt und nicht nur die Entwicklungsumgebung. BSD-2.
  "xxhash>=3.4",
  # Polygonarbeit hinter dem gedeckelten Schnitt (§18.2). BSD-3, bündelt GEOS (LGPL).
  "shapely>=2.0",
  # Konturhierarchie für denselben Schnitt: ohne den Graphen lässt sich ein
  # Schnitt durch eine Platte mit Loch nicht schließen. BSD-3.
  "networkx>=3.0",
  # Marching Cubes für die Voxelstufe der Booleschen Rückfallkette (§17.2). BSD-3.
  "scikit-image>=0.24",
  # Liest das Höhenbild der Reliefoperation (``geom/displace.py``) und wird
  # dort direkt importiert, nicht nur über scikit-image; Untergrenze wie dort.
  # BSD-2.
  "imageio>=2.33",
  # V-HACD sagt dem Auto Split, wo ein Körper von selbst auseinanderfällt
  # (§22.3). Zur Laufzeit optional: ohne es antwortet die Ebenensuche allein. BSD-3.
  "vhacdx>=0.0.8",
  # Dezimierung für generierte Netze (§25, „Netz"). MIT.
  "fast-simplification>=0.1.9",
  # SVG-Pfade hinter dem Zeichnungsimport (§25). MIT; DXF liest trimesh selbst.
  "svg.path>=6.3",
  # Satz und Glyphenumrisse der Schriftzüge (``geom/glyphs.py``) aus den
  # beiliegenden Schriftdateien; dieselbe HarfBuzz-Maschine setzt auch die
  # Beschriftungen der Ansicht (pygfx). Apache-2.0, bringt HarfBuzz (MIT-artig) mit.
  "uharfbuzz>=0.56",
]
# Desktop-Hülle. PySide6 ist LGPL und bleibt dynamisch gelinkt (§36).
ui = [
  "PySide6>=6.7",
  # Der Renderer hinter der Ansicht (§18): pygfx zeichnet über wgpu (Vulkan,
  # Metal, DX12) und bringt pylinalg mit. BSD-2.
  "pygfx>=0.17",
  # wgpu und rendercanvas kommen mit pygfx, ``app/ui/render`` importiert aber
  # beide selbst (Adapterfrage, Leinwand im Widget und ohne Fenster); die
  # Untergrenzen sind die von pygfx 0.17. BSD-2.
  "wgpu>=0.30.1",
  "rendercanvas>=2.6.1",
  # Die 3D-Maus (SpaceMouse) direkt über HID, ohne Herstellertreiber (§2.9,
  # Konzept 3D-Maus). Dreifach lizenziert; gewählt ist BSD-3.
  "hidapi>=0.14",
]
# Der zweite Konstruktionskern (§30): echte Kanten, und damit exakte
# Verrundungen, Fasen und STEP. Optional — ohne ihn sagen diese Operationen das
# in einem Satz, und alles andere bleibt unberührt. Die Anbindung ist
# Apache-2.0, der Kern darunter LGPL-2.1 mit der OCCT-Linking-Ausnahme, also
# wird er wie PySide6 als dynamisch gelinkte Bibliothek benutzt (§36). „novtk",
# weil diese Variante kein mitgebrachtes VTK bündelt — das Paket bleibt so
# kleiner, unabhängig davon, ob sonst irgendwo im Prozess VTK liefe.
brep = ["cadquery-ocp-novtk>=8.0.1"]
dev = [
  "pytest>=8.0",
  # Jeder Test in einem eigenen Fork (`--forked`, nur POSIX). Gebraucht in
  # der CI für die Dateien, die Fenster bauen: ein natives Renderfenster
  # darf weder sterben noch bleiben — zerstören nimmt den Grafikzustand
  # mit, ansammeln füllt den Speicher des Runners. Ein Fork löst beides,
  # weil er mit dem Test endet. MIT, reine Testabhängigkeit.
  "pytest-forked>=1.6",
  # Verteilt den Rest der Suite auf mehrere Prozesse (`-n`). Gebraucht von
  # `.claude/scripts/suite-getrennt.sh`, das alles ohne Qt in einem Zug
  # fährt; ohne das Paket liefe dort kein einziger dieser Tests.
  # Die Fenstergruppe bekommt es ausdrücklich nicht: dort stirbt ein Worker und
  # reißt den ganzen Lauf mit einem `INTERNALERROR` ab. MIT, reine
  # Testabhängigkeit; zieht execnet nach (ebenfalls MIT).
  "pytest-xdist>=3.6",
  "ruff>=0.6",
  "mypy>=1.11",
  # Wertet Umgebungsmarker für die Lizenzprüfung aus.
  "packaging>=24.0",
  # Die Tests öffnen Bilder und Schriftdateien selbst (``PIL``, ``fontTools``).
  # Pillow kommt zur Laufzeit über imageio und scikit-image; fontTools ist
  # reine Testabhängigkeit, die Anwendung liest Schriften über HarfBuzz.
  # MIT-CMU bzw. MIT.
  "pillow>=10.1",
  "fonttools>=4.28.2",
  # Die SBOM-Tests prüfen auch Interpreter und PyInstaller-Bootloader. Deshalb
  # gehört das bereits für jeden Paketbau verwendete Werkzeug in denselben
  # reproduzierbaren Entwicklungssatz wie die Tests, die es belegen.
  "pyinstaller>=6.0",
  # Legt Kopf- und Fußzeilen auf das gedruckte Handbuch (tools/make_manual.py).
  # Chromium setzt CSS Paged Media nicht um, kennt also keine Seitenzahl; die
  # Lage darüber entsteht mit Qt und wird hiermit aufgelegt. BSD-3, und nur ein
  # Werkzeug — in der Anwendung steckt es nicht (§36).
  "pypdf>=5.0",
  # Übersetzt das Prüfmodul für die Auslieferung nach C (Konzept §2 I H5,
  # tools/build_licence_module.py). Bau-, keine Laufzeitabhängigkeit: die
  # Anwendung und die Suite laufen gegen die Python-Quellen. Apache-2.0/MIT.
  "cython>=3.0",
  "setuptools>=75",
]

[project.scripts]
solidon3d = "app.cli:launch"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.core.knowledge" = ["data/*.toml", "data/third_party_licenses/*.txt"]
"app.core.geom" = ["data/fonts/*.ttf"]
# Die ComfyUI-Workflows sind Daten, kein Code (§27): ein anderer Generator
# heißt eine andere Datei, kein Patch.
"app.core.backends" = ["data/*.json"]
"app.core.knowledge.parts" = ["LICENSE"]
"app.i18n" = ["locales/*.json"]
# Die Beispielprojekte reisen mit: Dokumentation, Abnahmetest und
# Startbildschirm-Inhalt zugleich (§37.2). Die Handbuchbilder dazu — die
# gezeichneten und gerenderten entstehen im Lauf, die Bildschirmfotos nicht,
# also reisen sie als Dateien (ein Ordner je Sprache).
"app" = [
  "examples/*.p3d",
  "examples/*.svg",
  "examples/LICENSE",
  "images/icon/*.svg",
  "images/manual/*/*.png",
  "images/manual/*/*.webp",
  "images/manual/*/guides.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error",
  # numpy 2.5 hat `arr.shape = ...` als veraltet markiert; scikit-image 0.26
  # benutzt es noch. Der eigene Kern kommt ohne diese Zuweisung aus,
  # deshalb eng auf dieses Fremdmodul begrenzt statt
  # numpy nach oben zu deckeln — eine Obergrenze hielte das ganze Projekt auf
  # einer alten Version fest. Fällt weg, sobald scikit-image nachgezogen hat; ob
  # es so weit ist, zeigt der Job „Neueste Versionen“ in build.yml bei
  # öffentlichen v*-Tag-Pushes oder auf Handstart mit check_latest im
  # öffentlichen Repository.
  'ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:skimage\..*',
]
markers = [
  "performance: misst gegen das Budget aus Bauplan §31",
  "windowed: baut Qt-Fenster außerhalb der qt_app-Fixture, auch im Kindprozess; nur beim Release",
  "rendering: fragt einen Grafikadapter ab oder baut, zeichnet oder liest einen echten Renderer; nur beim Release",
  "rendered: vergleicht gegen erzeugte Seiten oder Bilder — braucht einen Lauf von /erzeugen",
  "slicer(programm): ruft einen installierten Slicer auf (Fixture installed_slicer); läuft vor dem Merge in slicer-auswahl.yml auf Linux und macOS",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# Der Sitzungszustand wird nicht geprüft.
#
# Seit „Der Sitzungszustand reist mit" (`a92b0bc`) liegen die Messskripte
# vergangener Durchsichten im Repository, damit drei Maschinen denselben Stand
# sehen. Es sind Wegwerfwerkzeuge — sie haben ihre Zahl geliefert und werden
# nicht mehr angefasst. Ruff fand darin 41 Verstöße und wollte 15 Dateien
# umformatieren; das Tor wäre damit rot gewesen, ohne dass sich an der
# Anwendung etwas geändert hat.
#
# Sie mitzuformatieren wäre schlimmer als sie auszunehmen: Ein Messskript, das
# umgeschrieben wurde, belegt seine Zahl nicht mehr. mypy trifft es nicht, das
# läuft ohnehin nur über `files = ["app"]`. Dasselbe gilt für die Sonden der
# Release-Durchsichten und der CAD-Durchsicht, die unverändert unter
# `konzepte/nachweise-release-*/` und `konzepte/nachweise-cad-durchsicht-2026-09/`
# liegen.
#
# Und die Druckprojekte werden es auch nicht.
#
# „3D Drucker/" enthält physische Druckprojekte in einem eigenen Repository.
# Der Ordner ist hier ignoriert und gehört nicht in die Solidon-Prüfungen.
extend-exclude = [
  ".claude/.state/",
  ".codex-*/",
  "3D Drucker/",
  "konzepte/nachweise-release-*/",
  "konzepte/nachweise-cad-durchsicht-2026-09/",
]

[tool.ruff.per-file-target-version]
# Der Umgebungsprüfer muss eine ältere Installation noch erklären können,
# bevor eine passende Projektumgebung existiert (tomllib benötigt Python 3.11).
"tools/check_env.py" = "py311"
# Cython 3.3 baut diese Module für Python 3.14, versteht aber noch keine
# ungeklammerten Ausnahmegruppen. Die Bauquellen behalten Python-3.13-Syntax.
"app/core/activation/*.py" = "py313"
# Die Sitzungs-Hooks laufen vor jeder Umgebung: SessionStart fällt ohne .venv
# auf ein System-Python zurück, und das kann 3.11 sein.
".claude/hooks/*.py" = "py311"

[tool.ruff.lint]
# Die sechs hinteren kamen am 14.08.2026 dazu, nachgemessen mit 13 Befunden im
# ganzen Baum: A (ein Name, der einen eingebauten überdeckt), C4 (Umwege über
# Generatoren), FURB und PIE (Modernisierung), ICN (Importname) und PTH
# (`pathlib` statt `os.path` — der Rest des Projekts rechnet ohnehin in
# `Path`).
#
# Zwei stehen bewusst **nicht** hier. `PERF` fände neunzehnmal dieselbe
# Schleife, die eine Comprehension werden könnte — ohne sicheren Autofix, und
# der Bestand ist an diesen Stellen mit Kommentaren darin lesbarer.
# `DTZ` fände sieben naive Zeitstempel, fünf davon in der Freischaltung: Das
# ist eine Verhaltensänderung an der Lizenzgrenze und kein Aufräumen.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "A", "C4", "FURB", "ICN", "PIE", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Bauplan §33.1 legt die Ausnahmenamen fest. OutOfBuildVolume und
# OperationCancelled sind Teil des Vertrags, keine Stilfrage.
"app/core/errors.py" = ["N818"]
# MapTooLarge ist ein Ablaufsignal innerhalb der Karten, kein gemeldeter Fehler.
"app/core/perceive/maps.py" = ["N818"]
# BackendUnavailable liest sich als Zustand, und ist einer — §33.1 legt die
# Namen fest.
"app/core/backends/llm.py" = ["N818"]
# GenerationFailed sagt, was passiert ist — und das liest der Nutzer (§33.1).
"app/core/backends/mesh.py" = ["N818"]
# SendFailed steht in derselben Reihe: was passiert ist, nicht wie es heißt.
"app/core/support.py" = ["N818"]
# BRepUnavailable ist ein Zustand wie die beiden oben, §33.1 legt die Namen fest.
"app/core/brep/kernel.py" = ["N818"]
# SetupFailed sagt wie GenerationFailed, was passiert ist, und der Satz daneben
# sagt, was jetzt hilft — dasselbe Muster, dieselbe Ausnahme.
"app/core/backends/comfy_setup.py" = ["N818"]
# Die ComfyUI-Knoten stehen nicht unter unserer Formvorschrift, sondern unter
# der von ComfyUI: Ordner mit Bindestrich (N999), ``INPUT_TYPES`` in
# Großbuchstaben (N802), und der Modell-Cache am Knoten ist Absicht (RUF012).
# Wer das umbenennt, hat Knoten, die ComfyUI nicht mehr findet. Sie liegen
# unter den Daten des Kerns und nicht mehr in ``tools/``: von dort erreicht
# sie das gebaute Paket nicht, und die Anwendung soll die Einrichtung selbst
# können statt auf ein Skript zu verweisen, das der Kunde nicht hat.
"app/core/backends/data/comfyui/*" = ["N999", "N802", "RUF012"]
# Die Suite muss die Nutzerverzeichnisse umbiegen, bevor irgendetwas sie liest,
# also kommen diese beiden Importe nach dem Setzen der Umgebung (§38).
"tests/conftest.py" = ["E402"]
# Qt-Signale sind per Konvention camelCase, und „20 × 20 mm" ist die deutsche
# Schreibweise eines Maßes — beides ist in der Oberfläche Absicht.
"app/ui/*" = ["N815", "RUF001"]
# ``log_message(self, format, *args)`` überschreibt eine Methode von
# ``BaseHTTPRequestHandler``. Der Name kommt aus der Standardbibliothek; ihn zu
# ändern hieße, die Methode nicht mehr zu überschreiben.
"app/ui/remote_server.py" = ["A002", "N815", "RUF001"]
# Den Steckbrief lesen Menschen und das Modell; „20 × 20 mm" ist das richtige
# Zeichen.
"app/core/perceive/digest.py" = ["RUF001"]
# Das Handbuch ist Fließtext für Leser: Bauräume stehen dort als „256 × 256 ×
# 256", mit dem Zeichen, das ein Setzer nähme, nicht mit einem kleinen x.
"app/core/manual.py" = ["RUF001"]
# Die Einheitenrückfrage zeigt, wie groß das Modell mit jeder Antwort wäre —
# „40,0 × 20,0 × 2,5 mm" liest ein Mensch, und der nimmt dasselbe Zeichen wie
# im Steckbrief.
"app/core/ingest/ops.py" = ["RUF001"]
"tests/*" = ["RUF001", "RUF002"]

[tool.pyright]
# Der Editor indiziert Quelltext, keine Druckprojekte, Pakete oder Prüfartefakte.
include = ["app", "tools", "tests", ".claude/hooks"]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.14"
files = ["app"]
strict = true
warn_unreachable = true
# Die ComfyUI-Knoten sind kein Modul dieser Anwendung, sondern eine Datei, die
# in eine fremde Installation kopiert wird. Ihr Ordnername trägt den
# Bindestrich, den ComfyUI verlangt, und mypy hält das für ein kaputtes Paket:
# „contains __init__.py but is not a valid Python package name". Umbenennen
# heißt Knoten, die ComfyUI nicht mehr findet.
exclude = "app/core/backends/data/comfyui/"

[[tool.mypy.overrides]]
# Pakete ohne `py.typed`. trimesh und scikit-image bringen es mit und stehen
# deshalb nicht hier — eine Zeile verdeckte sonst, wenn ein Import daneben greift.
module = [
  "manifold3d.*",
  "networkx.*",
  "pygfx.*",
  "wgpu.*",
  "rendercanvas.*",
  "hid",
  "scipy.*",
  "shapely.*",
  # Die OpenCASCADE-Anbindung ist eine kompilierte Erweiterung ohne Stubs (§30).
  "OCP.*",
  # HarfBuzz über Cython, ohne ``py.typed`` (``geom/glyphs.py``).
  "uharfbuzz",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Plattformzweige sind auf jeder Plattform außer einer unerreichbar — genau
# dafür sind sie da.
module = [
  "app.core.paths",
  "app.core.discover",
  # Und beim Update: welches Paket dieser Rechner braucht, entscheidet
  # dieselbe Abfrage (§37.2).
  "app.core.updates",
  # Das Filamentlager tauscht seine Datei auf Windows über kernel32 mit
  # POSIX-Semantik aus und öffnet sie über msvcrt; beides gibt es nur dort.
  "app.core.knowledge.filaments",
]
warn_unreachable = false

[[tool.mypy.overrides]]
# trimesh 5 ist typisiert, seine älteren Untermodule sind es nicht:
# `transformations`, `grouping`, `remesh`, `repair`, `smoothing`, `proximity`
# und `exchange` tragen weiter keine Signaturen, `skimage.measure` ebenso
# wenig. Ein Aufruf dorthin lässt sich von hier aus nicht typisieren.
#
# `app.core.brep.*` steht nicht hier, weil `OCP.*` oben ohnehin als `Any`
# ankommt. Namentlich statt mit `*`, damit eine
# **neue** Datei, die untypisiert in eine fremde Bibliothek ruft, auffällt statt
# stillschweigend mitgedeckt zu werden. Genau diese Sorte Fehler hat die
# konvexe Zerlegung zwei Phasen lang getragen (siehe `errors.PROGRAMMING_ERRORS`).
#
# Wer hier eine Zeile hinzufügt, prüft erst, ob eine typisierte Engführung
# besser passt — `geom.mesh.concatenated` ist das Muster dafür.
module = [
  "app.core.export.writer",
  "app.core.geom.autosplit",
  "app.core.geom.blend",
  "app.core.geom.label_ops",
  "app.core.geom.lattice",
  "app.core.geom.mesh",
  "app.core.geom.mesh_ops",
  "app.core.geom.orient",
  "app.core.geom.prepare",
  "app.core.geom.repair",
  "app.core.geom.transform",
  "app.core.ingest.loader",
  "app.core.ingest.outline",
  "app.core.knowledge.parts.shapes",
  "app.core.knowledge.parts.testbodies",
  "app.core.perceive.features",
  "app.core.perceive.maps",
  "app.core.slice.orientation",
]
disallow_untyped_calls = false
